name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: waymark
          POSTGRES_PASSWORD: waymark
          POSTGRES_DB: waymark
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U waymark"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://waymark:waymark@127.0.0.1:5434/waymark
      TEST_DATABASE_URL: postgres://waymark:waymark@127.0.0.1:5434/waymark_test
      VDS_BIN: "" # binary gate runs only where the vendor tree exists
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --fund=false
      - run: npm approve-scripts --all || true
      - name: create test databases
        run: |
          docker exec $(docker ps -q --filter ancestor=postgis/postgis:16-3.4) psql -U waymark -d postgres -c "CREATE DATABASE waymark_test"
          docker exec $(docker ps -q --filter ancestor=postgis/postgis:16-3.4) psql -U waymark -d waymark_test -c "CREATE EXTENSION IF NOT EXISTS postgis"
      - run: npm run db:migrate
      - run: npm -w @waymark/server run db:migrate
        env:
          DATABASE_URL: postgres://waymark:waymark@127.0.0.1:5434/waymark_test
      - run: npm run typecheck
      - name: unit tests
        run: npm test
        env:
          VDS_GATE_SKIP: "1"

  e2e:
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: waymark
          POSTGRES_PASSWORD: waymark
          POSTGRES_DB: waymark
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U waymark"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --fund=false
      - run: npm approve-scripts --all || true
      - run: npx playwright install chromium --with-deps
      - run: npm -w @waymark/web run build
      - name: e2e journey
        run: npx playwright test
        env:
          CI: "true"

  # D4: the design gates invoked by CI, not only by the author. The vendor
  # tree is public, so the runner builds the pinned instrument from source
  # and runs the battery. `states` is KNOWN-RED (15 findings standing on the
  # missing decided-target Figma file, [2026] VJS-CC-WAYMARK 2) — the gate
  # failing IS the correct result; anything else is drift.
  design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # the enforcement lock pins the SIBLING path ../vibe-design-system (the
      # shape of a local checkout); actions/checkout cannot write outside the
      # workspace, so clone it by hand at the pinned location
      - name: clone vendor tree
        run: git clone --depth 1 https://github.com/wlilley93/vibe-design-system ../vibe-design-system
      - uses: dtolnay/rust-toolchain@stable
      - name: build vds
        run: cargo build --release --manifest-path ../vibe-design-system/Cargo.toml --bin vds
      - name: design gates
        run: |
          VDS=../vibe-design-system/target/release/vds
          "$VDS" --root . pack verify
          for K in register_completeness reconciliation composition contrast no_stored_values ledger_staleness; do
            echo "== proof $K"
            "$VDS" --root . proof "$K"
          done
          echo "== proof states (known-red: 15 findings on the missing Figma target)"
          set +e
          "$VDS" --root . proof states
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "states must fail with exit 1 (known-red per [2026] VJS-CC-WAYMARK 2); got $code"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --fund=false
      - run: npm approve-scripts --all || true
      - name: binary negative control
        # run through the workspace script so vitest's cwd is apps/server
        run: npm -w @waymark/server run test -- test/vds-gate.test.ts
        env:
          VDS_BIN: ../vibe-design-system/target/release/vds
