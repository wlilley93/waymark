# Waymark deployment — one artifact, two postures (REQUIREMENTS §11).
#
# DEV POSTURE (default): private access over LAN/Tailscale; email stubbed to logs.
#   docker compose up -d --build
#   → http://<host>:8080  (Postgres is NOT published to the host)
#
# PRODUCTION MULTIPLAYER: same compose; set APP_ORIGINS to the public HTTPS
# origin, terminate TLS in front of the web service, and wire SMTP (the
# server logs verification/reset tokens until then).

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: waymark
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-waymark}
      POSTGRES_DB: waymark
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waymark"]
      interval: 5s
      timeout: 3s
      retries: 20
    # no ports: the database stays on the compose network only

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      DATABASE_URL: postgres://waymark:${POSTGRES_PASSWORD:-waymark}@postgres:5432/waymark
      PHOTO_DIR: /data/photos
      APP_ORIGINS: ${APP_ORIGINS:-http://localhost:8090}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      # production email: set SMTP_URL (smtps://user:pass@host) + FROM_EMAIL;
      # unset = dev posture, tokens logged by the server
      SMTP_URL: ${SMTP_URL:-}
      FROM_EMAIL: ${FROM_EMAIL:-waymark@localhost}
      PORT: "3000"
    volumes:
      - photos:/data/photos
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      # Loopback-only by default: tailscaled then owns the tailnet IP for TLS
      # serve. Set WEB_BIND to a LAN IP (e.g. 192.168.50.2 on beelink) to also
      # serve that interface directly. 8080 is taken on beelink (OrbStack/boltrig);
      # waymark claims 8090.
      - "${WEB_BIND:-127.0.0.1}:8090:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  pgdata:
  photos:
