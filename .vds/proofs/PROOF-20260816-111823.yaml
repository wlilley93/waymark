notes:
- '[reach] no figma ledger is present, so `states.drawn` is the register''s own claim and this run did not check it. A pass establishes that the contract is complete, never that a frame exists in the decided-target file. Generate a ledger with `vds figma pull` and re-run to have the claim measured instead: it is a network read, which is why it happens out of band and not inside this proof (VDS S-7(2)(1)).'
- '[taste] whether a drawn state looks right is reserved to the Principal (VDS S-1(6)). This proof checks that a required state is drawn, never that it is good.'
- '[parity] a required state that is drawn and not built is recorded here as an informational finding and never fails this gate; the `parity` proof is the gate for that gap (VDS S-7(5)). Informational findings are captured on the proof record and are not printed, so the record is where they are read.'
- '[contract] 1 register records declare no required state at all, so there is nothing about them for this proof to enforce and each is counted and skipped. This proof cannot tell a component that genuinely requires no state from a contract nobody filled in; a contract that disagrees with the code is `reconciliation`''s to find (VDS S-5(6)).'
