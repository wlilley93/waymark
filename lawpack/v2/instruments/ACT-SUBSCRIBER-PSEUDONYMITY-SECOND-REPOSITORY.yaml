id: ACT-SUBSCRIBER-PSEUDONYMITY-SECOND-REPOSITORY
title: The Subscriber Pseudonymity (Second Repository Accession) Act 2026
status: draft
prepared_at: "2026-08-10"
prepared_by: agent
made_by: sovereign_assent_required
purpose: >
  ENGROSSED FOR ASSENT; NOT MADE. Prepared by an agent and made only by the Sovereign,
  an accession under the publication-boundary scheme being reserved to assent.

  ACT-SUBSCRIBER-PSEUDONYMITY:s1 accessions SUB1 to the First Subscriber and SUB2 to the
  second repository so rendered by the estate schedule. The First Subscriber's estate
  contains a SECOND REPOSITORY of its own - distinct from the checkout SUB1 denotes and
  distinct from the repository SUB2 denotes - which holds filed orders, court records,
  breaches, decision logs, permits and submissions, all stating the First Subscriber's
  jurisdiction. That repository has NO accessioned pseudonym.

  The gap is not academic. A citation in the First Subscriber's county series is presently
  allocated to two live binding orders with unrelated holdings, one in each repository, and
  the question whether the second repository is a registered store of that jurisdiction at
  all is a jurisdiction question which ACT-002:s3 requires be routed to the Privy Council.
  That court sits canonically. A canon text may not name a subscriber by code
  (ACT-005:s1, ACT-007:s4), so the matter cannot be referred up while the repository it
  concerns cannot lawfully be named. This Act supplies the name and nothing else.

  It decides NOTHING about the citation, the two orders, or the standing of either
  repository. It declares no kernel_effect and contributes zero rows to the duty audit.
sections:
  - id: ACT-SUBSCRIBER-PSEUDONYMITY-SECOND-REPOSITORY:s1
    title: The accession
    text: >
      In this Act and in every canon text, REPO2-SUB1 means the First Subscriber's second
      repository: the repository, other than the checkout SUB1 denotes, which holds records
      stating the First Subscriber's jurisdiction. The rendering is qualifier-first, as
      CC-SUB1 is and as ACT 13's Restraint condition 2 requires, so that no inverted form
      enters the book. REPO2-SUB1 is hereby ACCESSIONED within the meaning of the
      publication-boundary scheme. Resolution is by the First Subscriber's private register
      at .vjs/private/pseudonym-register.md, to which the making under s3 adds one row; the
      register is never committed and never published.
  - id: ACT-SUBSCRIBER-PSEUDONYMITY-SECOND-REPOSITORY:s2
    title: What this Act does not do
    text: >
      This Act does not determine whether REPO2-SUB1 is a registered store of the First
      Subscriber's jurisdiction, whether records minted there bind, which of the two orders
      holds the contested citation, or the status of the other. Each is reserved to the
      Privy Council on referral. Nothing here is to be read as recognising REPO2-SUB1 as a
      store, or as denying it: an accession names a thing so that it may be litigated about,
      and naming is not standing.
  - id: ACT-SUBSCRIBER-PSEUDONYMITY-SECOND-REPOSITORY:s3
    title: Making
    text: >
      This Act is made on Sovereign Assent pinned to the engrossed digest recorded in the
      assent event. On making: one resolution row is added to the private register; and the
      referral of the jurisdiction question to the Privy Council may proceed, rendered in
      accessioned pseudonyms throughout.
notes_for_the_sovereign: >
  Three things to check before assenting, because an agent prepared this and an agent
  should not be trusted about them.

  ONE - the pseudonym. REPO2-SUB1 is proposed because it is structural and carries no
  product name, and because qualifier-first matches CC-SUB1. If you prefer a rendering that
  carries the repository's function, that is your call; the register row and this text must
  then match.

  TWO - the scope. s2 is drawn deliberately narrow. If you would rather the same instrument
  settle whether that repository is a store at all, it should not: that is the Privy
  Council's, and an Act that pre-empted it would decide the live matter by legislation.

  THREE - the premise. This Act assumes the second repository is the First Subscriber's and
  not a separate jurisdiction that never recorded its constitution. That reading is taken
  from the records themselves, which state the First Subscriber's jurisdiction on their
  face while carrying a differing repo code, and which do not agree with each other on that
  code. If the true position is that it is a distinct jurisdiction, this Act names it
  wrongly and should not be made in this form.
