# and per its D4. This instrument has NO force until the Sovereign's Assent - an
# external, antecedent, digest-pinned act that only the Principal qua Sovereign may
# perform (s.14: non-automatable, non-presumable, non-delegable). It bears NO
# sovereign_assent and MUST NOT be lodged into lawpack/v2/ until a recorded assent
# event exists (the rule learned in BREACH-2026-06-09; s.2 void-first-draft doctrine).
#
# ON ASSENT, commencement is mechanical: move this file to lawpack/v2/statutes/,
