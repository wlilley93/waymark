id: ACT-COMPUTER-FIRST-REALM
citation: "[2026] VJS-ACT 8"
title: Computer-First Realm Act 2026
status: in_force
assent_source: sovereign_assent
enacted_by: principal
purpose: >
  Founding constitutional Act of VJS V2; compact runtime (kernel) form of the
  assented Act. The canonical ceremonial text is the digest-pinned sealed copy
  at provenance/founding/bill-32-adopted-final-text.md
  (sha256:8e1d3f516cb2aca8e044d8c73bdc6ededa91a47ca86b729eece06f7eee6b9a0c);
  this record is its concordant compact form. Settled on [2026] REALM-PC 24 and
  [2026] REALM-SC 10 (which settled the assent floor given effect at s.23), drafted by
  the Standing Committee on the V2 Kernel Team's void first draft (REALM-SC 8),
  and assented by the Sovereign Founder on 2026-06-09. V2 COMMENCED 2026-06-09
  (COMMENCEMENT-V2-0001). The Act's own VJS-ACT ordinal is minted deterministically
  at commencement per its citation-scheme section; the earlier self-mint
  "[2026] VJS-ACT 8" was void and is not used. This Act incorporates and
  supersedes V1 material only as expressly stated; V1 is otherwise preserved as
  Gazette and Archive.

sections:
  - id: ACT-COMPUTER-FIRST-REALM:s2
    title: Constitutional status and the constitutional relay
    text: >
      The force of this Act comes from the constitutive act of the Realm's
      organs (the Committee's drafting and the Sovereign's Sovereign Assent on a
      Supreme Court settlement), never from the self-assertion of V2 or any
      agent. The agent-originated text was a void first draft cured by Assent.
    kernel_effect:
      defines:
        force_source: organ_constitutive_act
        v2_does_not_self_authorise: true
        void_first_draft_cured_by_assent: true
        settled_on:
          - "[2026] REALM-PC 24"
          - "[2026] REALM-SC 10"
          - "[2026] REALM-SC 8"

  - id: ACT-COMPUTER-FIRST-REALM:s3
    title: Commencement
    text: >
      Commencement is a strict external-then-compiled sequence: Sovereign Assent
      under the V1 route is the sole, wholly antecedent and external
      legitimating act; lawpack validation, entry and lock confirm form and
      digest-fidelity only. No commencement condition is satisfiable by the V2
      machinery alone. The Act commenced on 2026-06-09; the single commencement
      record (COMMENCEMENT-V2-0001) pins the assent event, the assented-text
      digest, the lawpack version, and the lock.
    kernel_effect:
      defines:
        commenced: "2026-06-09"
        royal_assent_antecedent_and_external: true
        no_condition_satisfiable_by_v2_machinery_alone: true
        commencement_record: COMMENCEMENT-V2-0001
        sole_constitutive_gate: royal_assent

  - id: ACT-COMPUTER-FIRST-REALM:s5
    title: Declaration of the computer-first Realm; form and concordance
    text: >
      VJS V2 is a computer-first legal system; its live law is compact,
      schema-valid, machine-checkable records operated by the kernel. A record
      with no kernel effect is excluded from the runtime authority graph. A
      material discrepancy between a section's ceremonial text and its kernel
      effect is a validation defect routed for correction; the kernel must not
      silently choose.
    kernel_effect:
      defines:
        declares_computer_first_realm: true
        canonical_runtime_surface: lawpack
        no_kernel_effect_excludes_from_graph: true
        requires_concordance: true
        discrepancy_policy: validation_defect
        kernel_must_not_silently_choose: true

  - id: ACT-COMPUTER-FIRST-REALM:s6
    title: Supersession of V1 as live runtime law
    text: >
      The V1 legal system is superseded as the live governing law of VJS. No V1
      authority binds V2 merely by existing in the archive; no V1 rule is
      imported by implication. Supersession is consolidation, not repudiation,
      and operates entry-by-entry (REALM-SC 7).
    kernel_effect:
      defines:
        supersedes_v1_live_law: true
        v1_not_runtime_authority_by_default: true
        consolidation_not_repudiation: true
      prohibits:
        - v1_import_by_implication

  - id: ACT-COMPUTER-FIRST-REALM:s7
    title: Preservation of V1 as Gazette and Archive
    text: >
      V1 is preserved as the VJS Gazette, Archive, historical record, doctrinal
      record and migration evidence, citable as archive authority, and honoured
      as the record that discovered the V2 settlement. It is not loaded as
      ordinary live agent context.
    kernel_effect:
      defines:
        preserve_v1_archive: true
        v1_not_loaded_as_default_context: true

  - id: ACT-COMPUTER-FIRST-REALM:s8
    title: V1 incorporation rule
    text: >
      V1 material has live V2 force only if expressly incorporated by a valid V2
      record stating the v1_source, v2_destination, operative rule, kernel
      effect, and supersession or variation. A general reference or a citation
      for history is not incorporation.
    kernel_effect:
      defines:
        incorporation_required: true
      prohibits:
        - general_reference_treated_as_incorporation

  - id: ACT-COMPUTER-FIRST-REALM:s9
    title: No V1 revival by silence
    text: >
      Silence, a gap, or an omission in V2 law does not revive V1 as binding
      law. Where V2 contains no applicable authority, the matter is a V2
      first-impression question. V1 may be consulted as archive, historical
      authority, persuasive reasoning, or migration evidence, but binds V2 only
      by express incorporation. This section is given continuing deterministic
      effect by INV-NO-V1-GAP-FILLER.
    kernel_effect:
      defines:
        v2_silence_does_not_revive_v1: true
        v2_silence_route: first_impression
        v1_archive_may_be_consulted: true
        incorporation_required_for_v1_force: true
        enforced_by: INV-NO-V1-GAP-FILLER
      prohibits:
        - treating_v1_as_binding_gap_filler

  - id: ACT-COMPUTER-FIRST-REALM:s10
    title: The V2 authority hierarchy
    text: >
      The hierarchy is: real-world-law warning boundary; V2 Constitution; V2
      constitutional Acts; V2 primary Acts; Kernel Regulations; Supreme Court
      Orders; Privy Council Orders; County Court repo Orders; local decision
      logs; incorporated V1 archive material. Lower cannot contradict higher; a
      local log cannot amend law.
    kernel_effect:
      defines:
        authority_hierarchy:
          - real_world_law_warning_boundary
          - v2_constitution
          - v2_constitutional_acts
          - v2_primary_acts
          - kernel_regulations
          - supreme_court_orders
          - privy_council_orders
          - county_court_repo_orders
          - local_decision_logs
          - incorporated_v1_archive_material
      prohibits:
        - lower_contradicts_higher
        - local_log_amends_law

  - id: ACT-COMPUTER-FIRST-REALM:s11
    title: The kernel as deterministic clerk
    text: >
      The kernel may load the lawpack, validate, resolve authority, route,
      identify court triggers, evaluate invariants, record permits and proofs,
      validate logs, and report boundary findings. It is clerk, not court. The
      governing test for engineering versus law is the source of the artefact's
      force (function versus promulgation) (REALM-SC 8).
    kernel_effect:
      defines:
        kernel_is_clerk: true
        governing_test: source_of_artefacts_force
      prohibits:
        - kernel_legislates
        - kernel_adjudicates_as_court
        - kernel_creates_force_by_computation
        - kernel_calls_model
        - kernel_uses_semantic_similarity_for_authority
        - kernel_treats_archive_as_live_without_incorporation

  - id: ACT-COMPUTER-FIRST-REALM:s14
    title: The constitutive gate, entrenched against the machine
    commentary: constitutional
    text: >
      The sole constitutive gate for a V2 primary or constitutional Act is the
      Sovereign's Sovereign Assent, which is non-automatable, non-presumable and
      non-delegable. The computational legislature may propose, draft, codify,
      consolidate and revise only; it is not sovereign, may not expand its own
      competence, may not amend the assent rule, and may not create force from
      its own output. This section is entrenched: amendable only by a
      Sovereign-assented constitutional Act citing it by number; any record
      purporting otherwise is void ab initio and a fatal validation defect.
    kernel_effect:
      defines:
        constitutive_gate: royal_assent
        assent_non_automatable: true
        assent_non_presumable: true
        assent_non_delegable: true
        legislature_not_sovereign: true
        entrenched_against_machine: true
        amendable_only_by: sovereign_assented_constitutional_act_citing_s14
        enforced_by: INV-ENTRENCHED-GATE-001
      prohibits:
        - legislature_self_extension
        - legislature_amends_assent_rule
        - legislature_creates_force_from_output
        - kernel_or_agent_amends_entrenched_gate

  - id: ACT-COMPUTER-FIRST-REALM:s15
    title: Apex-singleness and judicial independence
    commentary: constitutional
    text: >
      V2's judicature is the same one judiciary carried forward in continuity
      (REALM-SC 5, REALM-SC 6); V2 stands up no second or parallel apex.
      Apex-singleness may never be relaxed. Lexby acts as advocate, advisor,
      engineer and registrar only, never as the bench, and never judges a cause
      in which it is advocate. The kernel is clerk, not court. Entrenched as in
      s.14.
    kernel_effect:
      defines:
        single_apex_continuity: true
        apex_singleness_non_relaxable: true
        entrenched_against_machine: true
      prohibits:
        - second_or_parallel_apex
        - lexby_sits_as_bench
        - lexby_judges_own_cause
        - kernel_constitutes_or_counts_bench

  - id: ACT-COMPUTER-FIRST-REALM:s23
    title: Assent-source rule
    text: >
      A record claims binding V2 runtime force only if it declares an
      assent_source resolving to a specific Sovereign-assent event
      (sovereign_assent) or a standing-bounded route tracing to specific
      Sovereign assent (standing_bounded_assent). Absence, emptiness, an
      unrecognised form, or an unresolved trace each cause rejection. This is an
      affirmative allow-list that fails closed; the not-equal-to-self_authorised
      deny-list form is void as fail-open (s.23; [2026] REALM-SC 10).
      This section is given continuing deterministic effect by
      INV-ASSENT-SOURCE-001.
    kernel_effect:
      defines:
        assent_source_required: true
        allowed_assent_sources:
          - sovereign_assent
          - standing_bounded_assent
        fail_closed: true
        enforced_by: INV-ASSENT-SOURCE-001
      prohibits:
        - deny_list_assent_form
        - binding_force_without_traceable_assent_source

  - id: ACT-COMPUTER-FIRST-REALM:s16
    title: The single Gazette, two estates; the force-source rule
    text: >
      One VJS Gazette continues across V1 and V2 with two estates (V1 Archive,
      V2 Current). Publication does not create runtime force; V2's force derives
      from the lawpack and kernel-recognised status, never from publication. The
      estate boundary is operative by substance, not caption. Publication is not
      V1 enactment and not incorporation into V1.
    kernel_effect:
      defines:
        single_gazette: true
        estates:
          - v1_archive
          - v2_current
        estate_boundary_operative_by_substance: true
      prohibits:
        - publication_creates_runtime_force
        - publication_treated_as_v1_enactment
        - publication_treated_as_v1_incorporation

  - id: ACT-COMPUTER-FIRST-REALM:s29
    title: The constituted courts; bench composition and continuity
    text: >
      Upon satisfaction of the commencement conditions, the V2 courts are
      expressly constituted by a binding court-constitution order issued under
      the authority of this Act and ACT-002:s1. Each constituted court shall sit
      with the bench composition fixed by its constituting instrument: the County
      Court as a single judge, the Privy Council as an odd bench of 3, and the
      Supreme Court as an odd bench of 5, expandable to an odd bench of 9 for
      constitutional or foundational questions as the single central apex. The
      Court of Appeal tier persists in law under the Courts and Orders Act (ACT-002) and 2026-VJS-COURTS-CONSTITUTION-001 and may be
      administratively non-convened in the V2 MVP; once constituted or when an
      appeal arises, it shall sit as an odd bench of 3. No V2 court may issue a
      binding order until so constituted; until a bench is constituted, the matter
      remains under V1 jurisdiction. No even-numbered deciding bench is
      permissible. The singleness of the central apex may never be relaxed.
    kernel_effect:
      defines:
        courts_expressly_constituted_on_commencement: true
        bench_compositions:
          county_court: 1
          privy_council: 3
          supreme_court: 5
          supreme_court_expanded: 9
          court_of_appeal: 3
        central_apex_single: true
        apex_expandable_only_for:
          - constitutional_questions
          - foundational_questions
        court_of_appeal_tier_persists: true
        court_of_appeal_may_be_administratively_non_convened: true
      must:
        - express_constitution_by_binding_order_required
        - odd_bench_required
        - apex_singleness_non_relaxable
      must_not:
        - court_order_before_constitution
        - even_numbered_bench
        - relaxing_apex_singleness
