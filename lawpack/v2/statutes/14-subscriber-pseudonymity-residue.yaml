# THE LODGED (REGISTRATION) TEXT of the Subscriber Pseudonymity (Residue Corrections)
# Act 2026, lodged under [2026] VJS-CC-VJS 20 D8.
#
# THIS IS THE PROJECTION, NOT THE SIGNED INSTRUMENT. The Sovereign's assent pins
# sha256:cce7bce17fd6ef9bd98373e31ce13232f685f2c569a33d2e5a74bbc7c3585979, which is the
# digest of the ENGROSSED DRAFT at .vjs/submissions/draft/ACT-SUBSCRIBER-PSEUDONYMITY-
# RESIDUE.yaml. That draft is preserved verbatim and is the text the digest pins. This
# copy differs from it in exactly one field, `status`, which the draft necessarily
# carries as `draft` because no text can recite its own enactment. Correcting a
# projection is not editing a signed record ([2026] VJS-CC-VJS 20, supplemental, ratio 8).
#
# WHY IT IS HERE AT ALL. The Act was made at commit 42dec9a and amended two in-force
# statutes in place, leaving no record of its own making. Its id therefore resolved
# nowhere, and the two 002 warrants citing it under s5 produced a DANGLING_REFERENCE that
# shipped to every subscriber resolving this canon. D8 held the cure is lodgement, not
# striking the citation: the amended statutes now carry bytes whose provenance would
# otherwise be a commit message and nothing else.
id: ACT-SUBSCRIBER-PSEUDONYMITY-RESIDUE
assent_source: sovereign_assent
assent_instrument_digest: "sha256:cce7bce17fd6ef9bd98373e31ce13232f685f2c569a33d2e5a74bbc7c3585979"
citation: "[2026] VJS-ACT 14"
created_at: "2026-08-06"
enacted_by: principal
engrossed_text: .vjs/submissions/draft/ACT-SUBSCRIBER-PSEUDONYMITY-RESIDUE.yaml
assent_record: lawpack/v2/provenance/assent/2026-08-06-subscriber-pseudonymity-residue-assent.yaml
title: The Subscriber Pseudonymity (Residue Corrections) Act 2026
status: in_force
purpose: >
  The Subscriber Pseudonymity (Publication Corrections) Act 2026 swept registered
  tokens and said so exactly: its own residue recital records that
  subscriber-identifying names survive as substrings inside hyphenated compounds,
  approves no hyphenation technique, and routes the surviving compounds and the two
  warrant register records to the Commission's next certified schedule. That schedule
  is entered (COMMISSION-SCHEDULE-CANON-001, preparation annex), and this Act is the
  instrument it contemplates: prepared by the Commission under WARRANT-CANON-001,
  made only by the Sovereign, textual amendment of an assented statute being on no
  Commission's power list. The substitutions are stem renderings pinned by digest to
  prepared applied texts and never recited, since a recital would republish the very
  names this Act removes. The residue was measured 2026-08-05 with the publication
  tokeniser's own token grammar, and the count is scoped to what that recital
  routed: within the statute book, seven distinct compound tokens over seventeen
  lines, twenty-five occurrences in all, every one in the two Acts whose texts
  Schedule 1 re-pins. The committed corpus beyond the statute book carries more,
  recited and routed by s2; this Act sweeps the two amended texts and claims
  nothing wider. It declares no kernel_effect and contributes zero rows to the
  duty audit.
sections:
- id: ACT-SUBSCRIBER-PSEUDONYMITY-RESIDUE:s1
  title: The stem rendering rule and its accession
  text: >
    In this Act, the PRIVATE STEM means the First Subscriber's machine token,
    registered on the publication denylist and never printed; the ACCESSIONED STEM
    means the stem SUB1, taken in the letter case the surrounding compound carries.
    A STEM RENDERING of a compound public token is that token with the private stem
    replaced by the accessioned stem and every other character preserved. Each stem
    rendering is hereby ACCESSIONED within the meaning of the publication-boundary
    scheme, by rule rather than by enumeration, and the rule preserves every
    distinction: two compounds that differ anywhere outside the stem differ
    identically after rendering, so no two filesystem entities, series or records
    collapse into one pseudonym. Resolution restores the private stem via each
    jurisdiction's private register at .vjs/private/pseudonym-register.md, to which
    the making under s6 adds one resolution row; the register is never committed
    and never published.
- id: ACT-SUBSCRIBER-PSEUDONYMITY-RESIDUE:s2
  title: The substitutions, pinned and not recited
  text: >
    The texts of ACT-PROCEEDINGS-DISCIPLINE and ACT-RECTIFICATION-COMMISSION are
    amended by replacing each with its SECOND APPLIED TEXT: the instruments held at
    .vjs/submissions/draft/pseudonymity-applied-v2/, whose digests Schedule 1 pins.
    A second applied text differs from the text it replaces ONLY in the s1 stem
    renderings and, in ACT-RECTIFICATION-COMMISSION alone, the single address
    qualification s4 makes. This is MEASURED, not asserted: the line-by-line delta
    is exactly the measured residue lines, and the publication tokeniser finds zero
    tokens carrying the private stem in either second applied text, a strictly
    stronger measure than the registered-token measure the first applied texts
    satisfied. The pre-amendment texts remain fixed forever by the digests their
    assent events pin; nothing in this Act disturbs them as historical record.

    THE CLERK DELTA, recited so no reader believes the finding sets identical.
    Against the texts they replace, the clerk's findings on the second applied
    texts differ, on finding identity - code, severity and subject record - in
    exactly two ways. The blocking address error on the
    ACT-RECTIFICATION-COMMISSION estate schedule becomes the disclosed
    cross-repository form, which is the cure the certified schedule's preparation
    annex names. And one NEW disclosure arises on ACT-PROCEEDINGS-DISCIPLINE: one
    ordinal of the First Subscriber's V2 county series is cited in a rendering that
    no grounding-corpus document yet carries, so the clerk discloses it as
    cross-jurisdictional where it formerly resolved the native form; the disclosure
    is the gate working over a new accession, not a defect concealed. Two findings
    survive untouched because they are not pseudonymity defects and this Act's
    bound excludes them: the duplicated duty token in ACT-PROCEEDINGS-DISCIPLINE
    and the divergent court-records totals in the ACT-RECTIFICATION-COMMISSION
    estate schedule, both owed to the Commission's continuing classes and never to
    this Act. The remaining findings of both texts survive with their subject
    citations re-rendered by the s1 rule, identity preserved in every case; only
    the duty-token and count warnings survive byte-identical.

    THE REMAINING RESIDUE, recited and routed so this Act claims no more than it
    does. Beyond the statute book, the committed corpus carries the private stem
    in five further records: the two warrant register records, which s5 addresses
    by prepared successor forms, and three county judgment opinion files of the
    First Subscriber's V2 series, ordinals two, six and seven, whose contents and
    whose FILENAMES carry the stem, and a filename is outside any text rule's
    reach. Those three opinions, contents and filenames both; the divergence by
    which the two amended Acts address one continuity record under
    differently-qualified repository forms; and the clerk's address-finding
    channel, which prints an offending compound verbatim in the very message that
    reports it: each is routed to the Commission's next certified schedule under
    ACT-RECTIFICATION-COMMISSION:s4, and none is swept, cured or blessed by this
    Act.
- id: ACT-SUBSCRIBER-PSEUDONYMITY-RESIDUE:s3
  title: The V2 series rendering, an accession of a series
  text: >
    The rendering "[2026] VJS-CC-SUB1 n" in a canon text denotes ordinal n of the
    First Subscriber's V2 county series: the VJS-prefixed sibling, distinguished by
    exactly that prefix, of the continuity series whose CC-SUB1 rendering
    ACT-SUBSCRIBER-PSEUDONYMITY:s3 enacted. That enactment defined no rendering for
    the sibling series, so this section is the one genuine ACCESSION this Act
    performs beyond the s1 rule, recorded as such: an accession of a series, not
    merely a rendering sweep, and the one new clerk disclosure s2 recites is this
    accession working as designed. Of the five-component citation tuple
    ACT-PROCEEDINGS-DISCIPLINE Schedule 1 defines, only the public rendering of the
    REPO component changes, by the s1 rule; the rendering keeps the registered
    component order and parses under the registered form. No component of any tuple
    moves, no forwarding record arises under ACT-PROCEEDINGS-DISCIPLINE:s7, and the
    First Subscriber's own citator keeps its native rendering, which is its own
    affair.
- id: ACT-SUBSCRIBER-PSEUDONYMITY-RESIDUE:s4
  title: The address qualification
  text: >
    In the second applied text of ACT-RECTIFICATION-COMMISSION, the estate-schedule
    address that stood in slash form is colon-qualified: the repository qualifier
    is separated from the in-repository path by a colon, the form the clerk
    verifies as a cross-repository disclosure instead of failing as an unresolvable
    local file. This is the exact correction the certified schedule's preparation
    annex names. Said plainly, so no future reader mistakes it: the colon form
    removes the address from clerk resolution PERMANENTLY - the clerk verifies a
    cross-repository address by its form alone and resolves nothing behind it, so
    the resulting information finding is a disclosure, never a checked reference.
    The declaration is truthful: the record tree the address names exists in no
    part of this repository, and the pre-amendment error had already reported
    failure across every local resolution form. An address component in stem
    rendering denotes the record whose native name restores the private stem under
    s1; resolution belongs to the private register, and nothing about the record so
    addressed changes.
- id: ACT-SUBSCRIBER-PSEUDONYMITY-RESIDUE:s5
  title: Warrant re-registration, prepared and not made
  text: >
    Nothing in this Act, and nothing a Commission may do, edits a signed record:
    the two warrant registers and their verbatim signature events remain fixed
    forever by the digests their signatures pin. The Commission has PREPARED
    successor forms at .vjs/submissions/draft/pseudonymity-warrants/: a successor
    to the First Subscriber's warrant, expressed throughout in accessioned
    renderings, and a successor to the canon warrant. Both predecessors' working
    roots stood on operator-home literals and both successors re-express them over
    the defined terms; the First Subscriber's successor alone also carries, as
    prepared corrections citing SELF-FILE-2026-08-05-warrant-recital-defects.md,
    the disowned class label restructured to the certified-schedule form and the
    recharacterised address item; the canon successor enumerates its own three
    changes on its face. A successor takes effect ONLY by the Principal's fresh
    signature words pinning its digest; on that signature the predecessor stands
    superseded under ACT-004:s9 - supersession explicit, the old authority
    remaining visible and no longer binding - carried by the successor's pinned
    supersedes digest and enforced by the warrant register's ambiguity gate, with
    no line of the predecessor changed. Declining to sign leaves the predecessors
    in force and this Act's operative sections unaffected.
- id: ACT-SUBSCRIBER-PSEUDONYMITY-RESIDUE:s6
  title: Commencement, and who makes what
  text: >
    This Act commences on assent, and the s2 substitutions are MADE by its
    enactment: the Commission prepared, the Committee scrutinised and adopted, the
    Sovereign makes. The making is completed in one act with four closing
    verifications, none discretionary. First, the files lodged at
    lawpack/v2/statutes/ are re-hashed against the Schedule 1 pins before anything
    else proceeds. Second, the lawpack lock is regenerated in the same commit as
    the lodgement, so the lock drift is answered by the deliberate re-pin; the
    locking authority is whoever runs the invocation tool under the jurisdiction's
    existing principal, and the invocation record that tool mints alongside the
    lock is an inert side effect, recorded here so no reader mistakes it. Third,
    the Gazette is regenerated LIVE and its success recorded; the PUBLISHED BODIES
    means exactly the body texts the Gazette writes into its generated index and
    text store, and the zero-stem measurement over them is not a hand scan: it is
    the publication gate's own segment measure, which refuses to write a body
    carrying a registered term as a hyphen-bounded segment of any compound token,
    so the regeneration succeeding IS the measurement passing. Fourth, one
    resolution row for the s1 rule is entered in canon's private register, the
    only register this making reaches, a private act never committed; the row
    records the rule's side condition, that the rendering stays injective only
    while no native token carries the accessioned stem in stem position, so a
    future native collision is caught and never absorbed. Nothing in this Act
    amends any holding, disposal, count, measurement, floor or entrenchment, and
    it confers no power on anyone.
- id: ACT-SUBSCRIBER-PSEUDONYMITY-RESIDUE:s7
  title: Schedule 1 - the pinned second applied texts
  text: >
    The second applied text of ACT-PROCEEDINGS-DISCIPLINE is the instrument whose
    sha256 digest is 98f74ee81390af60c77fb99ae86b3e9a0e3d2238ca4962ac2a51b579cdd26937.
    The second applied text of ACT-RECTIFICATION-COMMISSION is the instrument whose
    sha256 digest is fe8a7bfeb2712856e058b78c17eb7a55a342997bbb493117fccccf0a268a7af1.
    Each is held at .vjs/submissions/draft/pseudonymity-applied-v2/ under the name
    of the Act it amends. A lodgement whose digest differs from the pin is not the
    amendment this Act makes.
