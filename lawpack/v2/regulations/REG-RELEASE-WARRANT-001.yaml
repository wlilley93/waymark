id: REG-RELEASE-WARRANT-001
citation: "[2026] VJS-REG 16"
assent_source: standing_bounded_assent
title: Automated Release Warrant Regulation
authority: ACT-CONSOLIDATION-FRAMEWORK:s7
status: in_force
text: >
  A release warrant is a deterministic, automatable check run before a public
  push, incorporating [2026] REALM-SI 7 as a V2 functional gate: it matches the
  target remote, ref, and SHA, runs the public/private boundary scan, and
  identifies the authorising instrument for any law-changing push. It is the
  pre_push function hook (REG-HOOKS-001), NOT a Sovereign assent. Sovereign Assent is
  the constitutive gate for LAW only and is not required again to publish law that
  is already assented. The only human element in a push is the Bill 14 / Bill 18
  irreversible-outward-act checkpoint, which may be a standing authorisation
  recorded once, together with possession of the push credentials; it is an
  operational sign-off, never a re-assent. A Privy Council post-push review
  follows every public push (incorporating [2026] REALM-PC 16 and [2026]
  REALM-PC 20). The warrant fails closed: a remote/ref/SHA mismatch, a
  boundary-scan hit, or a law-changing push with no identified authorising
  instrument blocks the push.
kernel_effect:
  defines:
    release_warrant: deterministic_automatable_pre_push_gate
    not_a_sovereign_assent: true
    royal_assent_is_for_law_only: true
    human_element: [irreversible_outward_checkpoint_may_be_standing, push_credentials]
  must:
    - match_remote_ref_and_sha
    - run_public_private_boundary_scan
    - identify_authorising_instrument_for_a_law_changing_push
    - privy_council_post_push_review
  must_not:
    - require_fresh_royal_assent_to_publish_already_assented_law
    - push_on_a_mismatch_or_a_boundary_scan_hit
