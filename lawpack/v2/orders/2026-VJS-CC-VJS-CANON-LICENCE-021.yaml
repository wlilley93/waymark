bench_size: 1
constituted_by: "2026-VJS-COURTS-CONSTITUTION-001 D1"
source_opinion: lawpack/v2/opinions/2026-VJS-CC-VJS-21-opinion.md
case_file: .vjs/submissions/draft/CASE-canon-licence-and-publication.md
case_file_digest: "sha256:8edd26b613b66ff2ae48dd41a015ce526794f0e6629964697d352d1264bcc377"
convened_at: CONVENING-county-2026-08-06-222539
submission: SUBMISSION-2026-08-06-222533
question: >
  Where the canon's LICENSE conflicts with binding [2026] VJS-PC 11 D2 and only the
  copyright holder may change a grant, what is the lawful disposal; may a gate hold such a
  breach at Warning while recorded; what does CC-VJS 20 D3 require where four
  digest-pinned engrossed texts cannot be both published and pseudonymised; and may the
  canon be published while D2's licence and publicity limbs are unresolved?
holding: >
  A LICENCE IS GRANTED BY THE HOLDER'S ACT, NOT BY A FILE. `LICENSE` is evidence of a
  grant and not the grant, so neither lexby nor this court may write into it a licence the
  holder has not granted, IN EITHER DIRECTION - restoring AGPL is not neutral merely
  because three other files recite it, since a recital is evidence too. The conflict is
  held open before the Principal and goes to them as a question, never as a fait accompli;
  the two reciting files must NOT be conformed to LICENSE, because their disagreement is
  the only surviving evidence that an unauthorised act occurred. WHILE UNPUBLISHED every
  edit is reversible; PUBLICATION is the act that binds, because the world reads LICENSE
  at face value and clones it. So publication may NOT proceed while the licence limb is
  unresolved - constitutive inertness answers whether publishing creates law (it does
  not), never whether an act a binding order governs may be done in breach of it. The bar
  is SELF-LIFTING: on the holder's express words, D2's publicity limb makes publication
  required, subject only to a clean boundary. On severity: where a defect's only lawful
  curer is the Sovereign, the kernel routes for correction rather than blocking, exactly
  as ACT-ASSENTED-RECORD-PROTECTION s.1/s.2 already provides, because a blocking severity
  on a Sovereign-reserved matter is the kernel coercing the Sovereign (ACT-001:s2/s3). The
  Warning is lawful on three conditions and the third does not yet exist: a breach
  self-file, naming the operative licence verbatim, AND an unconditional refusal standing
  across publication that no filing may downgrade. Until that refusal is built the
  downgrade is UNLAWFUL, because a filing that buys the ability to complete the breach is
  not a record of it. On D3: "publish the bytes" and "keep tracked" are ONE option, not
  two, and they fall together. Declared non-publication survives and is distinguishable
  from the cure CC-VJS 20 refused: that produced a Fatal in the subscriber's clone, this
  produces a disclosed absence, and the digest still travels so the text stays verifiable
  even where it is unreadable. The question was put too broadly: five clean texts re-seat
  into the lawpack, a sixth already dangling is restored from history, and only four are
  held by declaration - for which the untracking of .vjs/submissions is not an obstacle to
  the cure but the mechanism of it.
runtime_summary: >
  Never edit LICENSE to a licence the holder has not stated in express words, in either
  direction, and never make the other files agree with it - their disagreement is the
  evidence. Do not publish while the licence is unresolved; publish once it is stated. A
  finding only the Sovereign can cure routes for correction, but the outward act it
  governs is refused unconditionally and no filing downgrades that. Where records are
  pinned by digest, split them: publish every one you can, restore any that dangle, and
  declare the rest unpublished with a reason. A disclosed absence is not a dangling
  reference; a copy of a signed text is byte-exact and carries no header note.
