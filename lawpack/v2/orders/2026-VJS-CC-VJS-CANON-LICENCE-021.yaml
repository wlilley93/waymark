id: "2026-VJS-CC-VJS-CANON-LICENCE-021"
assent_source: standing_bounded_assent
citation: "[2026] VJS-CC-VJS 21"
title: >
  The canon's licence is the holder's to state and no one else's; a breach whose only
  lawful curer is the Sovereign routes for correction, but never across the outward act;
  five pinned texts re-seat, one is restored, four are held unpublished by declaration
court: county
