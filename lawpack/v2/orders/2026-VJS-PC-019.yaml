runtime_summary: >
  The Court of Appeal sits at the CANONICAL jurisdiction, not the subscriber. A subscribing
  jurisdiction (e.g. the subscriber) seats only its repo-local First Instance (its County Court line);
  everything above First Instance on a question of canon meaning or federation-wide effect refers up
  to vjs, which alone convenes and records appellate (VJS-CA) and apex (VJS-SC) benches. Rationale:
  one consistent federation jurisprudence, not N divergent local appeal lines (unity of citator and
  apex). A subscriber's repo-local County Court precedent is lawful but binds itself only. An
  up-referral must be fully anonymised (abstract question + redacted facts + pointer, no
  subscriber-specific facts) per ACT-005; the canonical ruling returns as an abstract central-series
  precedent the subscriber cites and may mirror read-only, never a repo-local CA-SUBSCRIBER. Mechanism:
  the subscriber files an anonymised referral; vjs convenes and drives server_of_law
  allocate/convene/record (citation kernel-minted). Kernel enforcement: the apex-routing gate must be
  extended to block any above-County court record staged by a non-apex jurisdiction (not only
  supreme/privy), and the Court enum must gain a CourtOfAppeal variant; the block routes up, never
  voids. Permission to appeal to the Supreme Court is granted on the routing ratio.
