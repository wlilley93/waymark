id: "2026-VJS-PC-019"
assent_source: standing_bounded_assent
citation: "[2026] VJS-PC 19"
title: Federation appellate-tier placement and up-referral procedure
court: privy_council
jurisdiction: vibe-justice-system
status: in_force
issue: where_the_court_of_appeal_sits_in_the_federation_whether_a_subscribing_jurisdiction_may_seat_its_own_intermediate_court_of_appeal_or_whether_every_tier_above_first_instance_refers_up_to_the_canonical_jurisdiction_and_the_consequential_procedure_for_anonymised_up_referral_abstract_precedent_citation_the_server_of_law_mechanism_and_the_kernel_enforcement
bench:
  - Reid
  - Wilberforce
  - Hoffmann
vote: >
  3-0 (Reid J. for the bench, Wilberforce J. and Hoffmann J. concurring). The Court of Appeal sits
  at the CANONICAL jurisdiction (Construction B). A subscriber seats only its First Instance (County
  Court) line; everything above First Instance on a question of canon meaning or federation-wide
  effect refers up. Construction A (a subscriber-seated Court of Appeal) is rejected: subscriber
  authority is positive-grant, not residual-liberty, and an under-inclusive kernel gate is a gap to
  close, not a jurisdiction to occupy. Permission to appeal to the Supreme Court GRANTED on the
  routing ratio (R1, R2, R7).
case_file_digest: "sha256:77b9346c881495088363e8272d75dc55d5cdbd032c9d2ba460eb0098e4112e19"
convened_at: "2026-06-26T12:00:00+00:00"
question: >
  A subscriber, a subscribing V2 jurisdiction on canonical lawpack vjs-v2, consulted the
  canonical jurisdiction on federation appellate procedure before recording an appeal. The canon
  settles that the apex (supreme/privy) is singular and canonical and that subscribers must refer up
  (REG-FEDERATION-COORDINATION-001; [2026] VJS-SC 4), and that the Court of Appeal persists in law as
  a tier but is administratively non-convened in the V2 MVP, to sit as an odd bench of 3 when an
  appeal arises ([2026] VJS-SC 2 D4; ACT-COMPUTER-FIRST-REALM s29). The canon is SILENT on whether
  that intermediate Court of Appeal sits at the subscriber level or the canonical level, and the
  kernel apex-routing gate (apex_routing_decision in crates/vjs-core/src/hook.rs) blocks only a
  court field containing "supreme" or "privy", while the Court enum (crates/vjs-core/src/types.rs)
  carries no CourtOfAppeal variant. The reference asks: (Q1) where the Court of Appeal sits; (Q2)
  whether the rationale is "for the benefit of all" - one consistent jurisprudence, not N divergent
  local appeal lines; (Q3) where the First Instance / appeal boundary lies and whether a subscriber's
  repo-local First Instance (the CC-SUBSCRIBER County Court line) is correct; (Q4) whether an up-referral
  must be fully anonymised (abstract question + redacted facts + pointer, no subscriber-specific
  facts) per ACT-005; (Q5) whether the canonical ruling returns as an abstract precedent the
  subscriber cites, never a repo-local CA-SUBSCRIBER; (Q6) the mechanism (server_of_law allocate/convene/
  record) and who convenes the canonical bench; and (Q7) how the answer is enforced at the kernel.
holding: >
  UNANIMOUS (3-0). Q1: the Court of Appeal sits at the CANONICAL jurisdiction. A subscriber seats only
  its First Instance (County Court) line; everything above First Instance on a question turning on the
  meaning of canonical law, or generalisable / federation-wide in effect, refers up to the canonical
  jurisdiction (vjs), which alone convenes and records appellate and apex benches. This follows from
  REG-FEDERATION-COORDINATION-001 ("one continued apex ... Every other (subscribing) jurisdiction must
  refer up"; it prohibits a root asserting an apex or final court function), from [2026] VJS-SC 4 (the
  apex is singular and canonical; a subscriber may refer up but may not hold its own apex sitting),
  and from [2026] VJS-PC 10 (every binding question on the MEANING of canonical law resolves to the
  one citation series and single apex; no parallel series, local apex, or per-domain citator). Only
  the County Court is expressly designated repo-local ([2026] VJS-SC 2 D1); the silence as to the
  Court of Appeal is filled by the unity-of-apex architecture, not against it. The rival construction
  - that the kernel gate naming only supreme/privy leaves a subscriber Court of Appeal unblocked - is
  rejected: that enumeration is the worst case the gate was built to catch, not an exhaustive licence;
  capability is not authority; and the controlling principle that taking an appeal creates no new
  tier, seat, apex, or citation series leaves the single apex undisturbed.


  Q2: CONFIRMED as design intent. An appellate ruling on a generalisable question binds and benefits
  the whole federation - one consistent jurisprudence - rather than N divergent local appeal lines,
  which would be the parallel series and per-domain citator forbidden by [2026] VJS-PC 10. Q3:
  CONFIRMED. A subscriber's repo-local First Instance (the County Court line) applying canon to local
  facts and binding repo-local precedent is lawful ([2026] VJS-SC 2 D1); the boundary sits at the top
  of First Instance, and the subscriber's repo-local precedent binds itself only, never a peer and
  never canon meaning. Q4: CONFIRMED. A subscriber's up-referral crossing into the canonical record
  must be fully anonymised - the abstract legal question, redacted facts, and a pointer, with no
  subscriber-specific facts (no repo paths, client facts, or concrete schema/verb identifiers) - per
  ACT-005, subject only to retaining facts material to the legal question. Q5: CONFIRMED. The
  canonical ruling returns as an abstract precedent in the one central series that the subscriber
  cites and may mirror read-only; it is never recorded as a repo-local appellate order. Q6: the
  subscriber files an anonymised referral; the canonical jurisdiction (vjs), not the subscriber,
  convenes the bench and drives server_of_law allocate (kernel-minted citation, never hand-picked,
  ACT-004), convene (bench size verified against [2026] VJS-SC 2; under-strength refused), and record
  (bench-integrity verified). Q7: the kernel today under-enforces the rule and must be conformed - the
  apex-routing gate must block any above-County court record staged by a non-apex jurisdiction, and
  the Court enum must gain a CourtOfAppeal variant, the block operating as a refer-up /
  route-for-correction and never a void. Permission to appeal to the Supreme Court is GRANTED on the
  routing ratio (Q1, Q2, Q7), the question being constitutional, first-impression, and
  federation-binding; the underlying merits are referred up for separate canonical disposition.
