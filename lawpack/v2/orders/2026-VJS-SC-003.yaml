id: "2026-VJS-SC-003"
assent_source: standing_bounded_assent
citation: "[2026] VJS-SC 3"
title: The source and rank of entrenchment - the s.5(a) gate, final appeal
court: supreme_court
jurisdiction: vibe-justice-system
status: binding
issue: source_and_rank_of_entrenchment
question: >
  On final appeal from [2026] VJS-PC 12: did the Privy Council have constitutional
  power to entrench the s.5(a) gate's never-void/never-block-an-assented-record
  property by court order, or is entrenchment a Sovereign/primary-law act (s.14)?
  What is the lawful source and rank of entrenchment in V2?
holding: >
  APPEAL ALLOWED, 9-0; the Privy Council's entrenchment limb is RECHARACTERISED.
  Entrenchment in V2 is a constitutive, constitutional-rank act whose SOLE lawful
  source is Sovereign Assent (s.14); no court, and no kernel, may originate or
  self-execute it. A court may condition the validity of subordinate machinery and
  may declare, as binding apex precedent, that the gate must never void or block an
  assented record (that flows from s.5, s.11, s.23 read with s.14, and binds today
  without entrenchment). But the further words "amendable only by Sovereign-assented
  primary law expressly citing s.5" purported to mint a new entrenchment clause -
  fixing the manner-and-form of future amendment - which is the defining content of
  entrenchment and reserved to Assent. That the court deferred amendment UPWARD does
  not cure it: an usurpation that flatters its victim is an usurpation still; the
  question is the act's rank and author, not its modesty. The limb is READ DOWN, not
  struck: it stands as a binding judicial declaration plus a standing reservation, and
  ripens into full constitutional entrenchment RANK only upon a Sovereign-assented Act
  expressly citing s.5. The Court INVITES, and does not command, that enactment.
  Reservation of the whole limb was rejected (it would leave assented records exposed
  in the interim); upholding as written was rejected (a court may not legislate rank).
