runtime_summary: >
  Final appeal, 9-0: entrenchment in V2 is constitutive and its sole source is
  Sovereign Assent (s.14); no court or kernel may mint it. The s.5(a) gate's
  never-void/never-block-an-assented-record protection binds NOW as apex precedent
  (from s.5/s.11/s.23), but the Privy Council's "amendable only by primary law citing
  s.5" entrenchment limb is read down: it acquires full constitutional rank only on a
  Sovereign-assented Act expressly citing s.5. The Court invites that enactment;
  Lexby may draft it only as a void first draft for the Sovereign's assent. Apex;
  no further appeal (s.15).
