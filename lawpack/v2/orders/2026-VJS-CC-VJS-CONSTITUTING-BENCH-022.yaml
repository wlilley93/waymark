id: "2026-VJS-CC-VJS-CONSTITUTING-BENCH-022"
assent_source: standing_bounded_assent
citation: "[2026] VJS-CC-VJS 22"
title: >
  The apex-bench rule is about a court issuing an order, and the instrument that
  constitutes the courts is not one; the carve-out cannot be borrowed because borrowing it
  would require being the constitution
court: county
jurisdiction: vibe-justice-system
