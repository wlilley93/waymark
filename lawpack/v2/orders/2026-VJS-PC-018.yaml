id: "2026-VJS-PC-018"
assent_source: standing_bounded_assent
citation: "[2026] VJS-PC 18"
title: Standing-Route Resolution of standing_bounded_assent
court: privy_council
jurisdiction: vibe-justice-system
status: superseded
issue: whether_the_kernel_should_tighten_the_resolution_of_standing_bounded_assent_from_the_present_permissive_check_that_the_realm_is_sovereign_founded_to_a_requirement_that_the_record_trace_to_a_recorded_per_class_standing_route_so_as_to_close_the_residual_by_which_a_non_constitutive_fatal_could_be_laundered_onto_a_non_order_regulation_by_typing_the_entrenched_words_and_if_so_whether_that_tightening_is_faithful_interpretation_achievable_without_narrowing_with_the_established_canon_carve_out_or_a_narrowing_of_the_entrenched_act_assented_record_protection_floor_reserved_to_the_sovereign_and_whether_the_build_should_proceed_now_or_be_reserved_on_the_recorded_interpretive_ratio_route_map_trigger_and_non_narrowing_conditions
bench:
  - Atkin
  - Bingham
  - Denning
vote: >
  2-1 (Atkin J. and Denning J. for the majority; Bingham J. dissenting): POSITION C - RESERVE -
  prevails on the disposition. The kernel does NOT tighten the standing_bounded_assent resolution for
  the regulation class now; the orders and apex vector is already closed by the constitutive-validity
  codes independent of any assent claim, and is affirmed and made explicit. The permissive `founded`
  trace is retained for regulations as the conservative, floor-safe status quo, because
  over-sheltering never narrows a genuine record whereas a hasty per-instrument force-gate would. On
  Q2 a DIFFERENT majority (Bingham J. and Denning J.) holds that requiring a regulation's
  standing_bounded_assent to trace BY ROUTE-CLASS to the recorded Framework Act s.7 Sovereign assent
  (COMMENCEMENT-V2-0002) IS faithful interpretation of ACT-COMPUTER-FIRST-REALM s.23 and within this
  Council's power, and is non-narrowing, PROVIDED the established-canon carve-out shelters every
  existing in-force regulation and a non-resolving new regulation is routed for correction, not
  voided; that interpretive ratio and the binding non-narrowing conditions are recorded so a future,
  triggered build is a bounded refinement, not a fresh constitutional question. Atkin J. concurs in
  the RESERVE result but DIVIDES on Q2: he holds the residual-closing per-instrument FORCE-GATE would
  narrow VJS-ACT 10 s.1 for a genuinely-made new regulation and is therefore barred as constitutive
  change reserved exclusively to the Sovereign, the regulation-laundering residual being irreducible
  by lawful machinery. Bingham J. DISSENTS on the disposition: he would adopt Position A and BUILD the
  recorded-route resolution now as interpretation, the build being cheap, symmetric with PC-16, and
  non-narrowing under the carve-out. The whole bench agrees a per-instrument hard precondition WITHOUT
  a complete carve-out would narrow the entrenched floor and is reserved exclusively to a
  Sovereign-assented Act. Nothing is built that narrows; nothing is routed to the Sovereign as a
  requirement.
case_file_digest: "sha256:4344c70a40bde0080ca53e627c7bcd78a61caeae95b7fd6a49b47625e8a0b58c"
convened_at: "2026-06-25T16:33:55.127433337+00:00"
question: >
  On the Reference re Standing-Route Resolution (SUBMISSION-2026-06-25-standing-route-resolution), the
  residual reserved by [2026] VJS-PC 16 at D4/D7. The kernel (crates/vjs-engine/src/assent.rs) today
  resolves a standing_bounded_assent claim permissively: the `founded` predicate confirms only that
  the Realm is Sovereign-founded (the corpus contains some sovereign_assent_event or royal_assent
  anywhere), not that THIS record traces to it. So a non-constitutive Fatal on a non-order regulation
  could, in principle, be laundered by typing the two entrenched words. The submission asks whether
  the kernel should tighten that to "the record traces to a recorded per-class standing route", on the
  model of [2026] VJS-PC 16's treatment of sovereign_assent, so that a regulation must trace to the
  Framework Act s.7 power terminating at the recorded Sovereign assent (COMMENCEMENT-V2-0002). The
  stated prize is to close a narrow residual: laundering a non-constitutive Fatal on a non-order
  regulation by typing the known words. Per question: (Q1 ADOPT/TIGHTEN) should a deterministic,
  model-free gate require a standing_bounded_assent record to trace to a recorded per-class route, and
  is that machinery or a new substantive duty; (Q2 INTERPRETATION vs NARROWING) is such a tightening
  faithful interpretation of ACT-COMPUTER-FIRST-REALM s.23 achievable without narrowing the entrenched
  ACT-ASSENTED-RECORD-PROTECTION s.1 floor (with the established-canon carve-out), or would it narrow
  the floor for a genuinely-made regulation and so be reserved to a Sovereign-assented Act; and (Q3
  MECHANISM + MIGRATION) by what mechanism and migration, and should the build proceed now or be
  reserved on a recorded interpretive ratio, route map, trigger, and non-narrowing conditions. The
  positions: A (tighten now, as interpretation), B (do not build; treat the permissive trace as the
  accepted irreducible remainder, or any narrowing as reserved to the Sovereign), C (reserve the
  build, recording the route, the interpretive ratio, the trigger, and the non-narrowing conditions).
holding: >
  POSITION C prevails on the disposition, 2-1 (Atkin J. and Denning J. for the majority; Bingham J.
  dissenting). The kernel does NOT tighten the standing_bounded_assent resolution for the regulation
  class now; it records the route, the interpretive ratio, the trigger, and the binding non-narrowing
  conditions for a future build, and it changes nothing that narrows the entrenched floor. Nothing is
  routed to the Sovereign as a requirement.


  Q1 (ADOPT/TIGHTEN). For ORDERS the answer is unanimous: the dangerous vector - a bench-less,
  never-convened, or wrong-tier order, and an apex order in a subscribing jurisdiction - is already
  closed by the constitutive-validity codes (assent.rs CONSTITUTIVE_CODES: BENCH_REQUIRED,
  TIER_NOT_CONSTITUTED, BENCH_SIZE_MISMATCH, BENCH_SILENT_SEAT, BENCH_OPINION_MISSING,
  CITATION_COLLISION, APEX_RECORD_IN_SUBSCRIBING_JURISDICTION), which [2026] VJS-PC 16 held are never
  softened by any assent claim of either form. That closure is independent of how permissively the
  trace resolves; it is affirmed and made explicit, and needs no new assent-resolution change. For
  REGULATIONS the majority DECLINES to tighten now: the permissive `founded` predicate is retained as
  the conservative, floor-safe status quo. The Council records candidly that `founded` (the corpus
  contains some sovereign_assent_event or royal_assent anywhere) is an under-faithful reading of
  s.23's "tracing to specific Sovereign assent" - an existence check standing in for a real trace, of
  the same family [2026] VJS-PC 16 condemned for sovereign_assent - but it is floor-safe, and it is
  not below the standard of reasonable skill and care, because PC-16 deliberately and lawfully
  reserved this very question.


  Q2 (INTERPRETATION vs NARROWING). On the interpretive question a majority (Bingham J. and Denning
  J.) holds that requiring a regulation's standing_bounded_assent to trace, BY ITS ROUTE-CLASS, to the
  specific recorded Framework Act s.7 Sovereign assent (COMMENCEMENT-V2-0002, framework_act_text_digest
  sha256:90e843c1dbdcdb2e2c7026d1064a457cf7ea1dbfe80526eff96b1f7e03850470) IS faithful interpretation
  of ACT-COMPUTER-FIRST-REALM s.23 and within this Council's power, and does NOT narrow
  ACT-ASSENTED-RECORD-PROTECTION s.1, PROVIDED two absolutes hold together: (i) the established-canon
  carve-out (the established_at_head pattern PC-16 already uses, today wired only to the
  sovereign_assent branch) shelters every regulation committed in canon at HEAD, so that not one
  existing in-force regulation - and the verified facts confirm many genuine REG-* records,
  REG-KERNEL-001 among them, carry no per-instrument provenance event - loses its floor; and (ii) a
  non-resolving NEW regulation is ROUTED to record its enactment-provenance trace, never voided or
  blocked, its underlying finding keeping native severity only because, by s.23, an unresolved trace
  was never sheltered (s.2 confers no force on a record lacking a valid, resolving assent_source, and
  does not enlarge it). A regulation's force traces by class to the single shared Framework assent,
  not to a per-instrument Sovereign event, because under s.7 subordinate law "requires this parent
  authority", not a fresh assent. Atkin J. concurs in the RESERVE result but DIVIDES on this question:
  he holds that a recognised-route check is interpretation but does not close the residual, and that
  the only thing that DOES close it - per-instrument resolution as a CONDITION OF FORCE - would narrow
  VJS-ACT 10 s.1 for a genuinely-made new regulation that carries real s.7 force but no provenance
  note, and is therefore barred as constitutive change reserved exclusively to the Sovereign; on his
  view the regulation-laundering residual is irreducible by lawful machinery. The whole bench agrees
  on the controlling limit: a per-instrument hard precondition imposed WITHOUT a complete carve-out,
  or any change that strips the floor from a genuinely-made regulation, would narrow the entrenched
  floor and is reserved exclusively to a Sovereign-assented constitutional Act citing
  ACT-COMPUTER-FIRST-REALM s.23 and ACT-ASSENTED-RECORD-PROTECTION by number; and that the clerk can
  confirm a regulation's form and its pinned terminal but never the legislative WILL that it was made
  under s.7, so against a determined author with write access the ultimate backstop is non-machine
  (the Sovereign's gate at ACT-COMPUTER-FIRST-REALM s.14 and the continuing duty of care, ACT-003 s.4
  to s.8).


  Q3 (MECHANISM + MIGRATION). RESERVE, 2-1 (Atkin J. and Denning J.; Bingham J. dissenting). The
  majority builds no regulation tightening as machinery now and files NO breach - the kernel as built
  is not below the standard of care, and the speclaw-3 demonstrated-need discipline counsels against
  genericising machinery in advance of need: there is no recorded regulation-laundering breach, the
  dangerous order and apex vector is already closed, and the residual is a non-constitutive Fatal on a
  non-order, a class whose Fatals are usually advisory Warnings already. The order records, for a
  future triggered build: the route map (orders to a constituted bench under ACT-002, already closed
  by the constitutive codes; regulations to the Framework s.7 power terminating at the recorded
  Framework assent; the founding corpus to the commencement records); the interpretive ratio above, so
  a future build is a bounded refinement and not a fresh constitutional question; the trigger (a
  recorded regulation-laundering breach, or an express court or Principal direction), not the bench's
  appetite to tidy a residual; and the binding non-narrowing conditions on ANY future build - the
  established-canon carve-out must shelter every regulation committed at HEAD; a non-resolving new
  regulation must be routed for correction, never voided; the terminal anchor must be a specific,
  recorded, digest-pinned Sovereign assent, never a kernel-invented gate; the check must stay pure
  clerk (recorded-event lookup, digest compare, scope and date coverage; no merits judgment of valid
  making, REG-KERNEL-001, INV-KERNEL-001); and if at build time any in-force regulation cannot be
  sheltered, the builder must STOP and self-file per [2026] VJS-PC 16 D7, the cure being to record
  that regulation's trace, never to strip its floor. At most, an OPTIONAL non-narrowing advisory
  Warning (route-for-correction, never Fatal, never a floor strip) may be built to nudge a new
  regulation toward carrying its provenance; it must never void, block, or downgrade-block any record.


  DISSENT. Bingham J. would adopt POSITION A and BUILD the recorded-route resolution now, as
  interpretation: he holds the permissive check is an under-implementation of an entrenched term that
  the Council should not leave standing after condemning the identical defect next door; the build is
  cheap, symmetric with PC-16, and non-narrowing under the established-canon carve-out; and the
  meaning of an entrenched term is not contingent on a breach occurring, so reservation is unwarranted.
  The majority answers that the floor's own ordering of errors prefers over-sheltering (which never
  narrows a genuine record) to a hasty tightening (which can), and that no demonstrated need is shown.


  Nothing in this judgment amends any statute, invariant, bench, tier, or assent rule; the permissive
  check stays, the entrenched floor stands at full height for every record, and nothing is routed to
  the Sovereign as a requirement. Position A is the dissent; Position B (treating the permissive check
  as the faithful reading, or any narrowing as a present requirement) is REJECTED - the permissive
  check is under-faithful, not faithful, and no narrowing is enacted; Position C is ADOPTED as named.
