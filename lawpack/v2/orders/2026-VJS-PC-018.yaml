runtime_summary: >
  The kernel today resolves a standing_bounded_assent claim permissively: assent.rs's `founded` check
  confirms only that the Realm is Sovereign-founded (some sovereign_assent_event exists somewhere),
  not that THIS record traces to it. So a non-constitutive Fatal on a non-order regulation could be
  laundered by typing the entrenched words. The Reference - the residual PC-16 reserved at D4/D7 -
  asks whether to tighten that to "the record traces to a recorded per-class standing route". The
  Council, 2-1 (Atkin J. and Denning J. for the majority; Bingham J. dissenting), adopts POSITION C -
  RESERVE.

  (Q1 ADOPT) For ORDERS the answer is unanimous: a bench-less, never-convened, or wrong-tier order,
  and an apex order in a subscribing jurisdiction, are barred by the
  constitutive-validity codes, never softened by any assent claim. That vector is closed independent
  of the trace; it is affirmed, no new gate needed. For REGULATIONS the majority DECLINES to tighten
  now. The permissive `founded` check is recorded candidly as under-faithful to s.23's "tracing" verb,
  but it is floor-safe and is kept on that footing.

  (Q2 INTERPRETATION vs NARROWING) A majority (Bingham and Denning) holds that requiring a regulation
  to trace BY ROUTE-CLASS to the recorded Framework Act s.7 Sovereign assent (COMMENCEMENT-V2-0002) IS
  faithful interpretation of s.23 and non-narrowing, PROVIDED (i) the established-canon carve-out
  shelters every regulation already in canon - many genuine ones, REG-KERNEL-001 included, carry no
  provenance note - and (ii) a non-resolving NEW regulation is routed for correction, never voided.
  Atkin J. divides here: he holds the residual-closing per-instrument FORCE-GATE would narrow the
  floor for a genuinely-made new regulation and is barred as constitutive change reserved to the
  Sovereign, the residual being irreducible by lawful machinery. The whole bench agrees a hard
  precondition WITHOUT a complete carve-out narrows the floor and is reserved to a Sovereign-assented
  Act, and that the clerk can never confirm the legislative WILL behind a regulation, so the ultimate
  backstop is non-machine (the Sovereign's gate at s.14 and the duty of care).

  (Q3 MECHANISM + MIGRATION) RESERVE. The majority builds no regulation tightening now and files no
  breach: there is no recorded laundering breach, the dangerous vector is closed, and the residual is
  tiny (regulation Fatals are usually advisory). The order records the route map, the interpretive
  ratio (so a future build is a bounded refinement), the trigger (a recorded breach or an express
  court or Principal direction), and binding non-narrowing conditions on any future build: the
  carve-out must shelter every existing regulation; a non-resolving new one must be routed, not
  voided; the anchor must be a recorded digest-pinned Sovereign assent; the check must stay pure
  clerk; and a builder who cannot shelter an in-force regulation must STOP and self-file (PC-16 D7).
  At most an OPTIONAL advisory Warning may nudge new regulations toward provenance; it may never void,
  block, or strip a floor. Bingham J. dissents: he would BUILD now (Position A). Nothing entrenched is
  amended; the floor stands at full height; nothing is routed to the Sovereign as a requirement.
