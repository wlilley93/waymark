  - id: D4
    actor: standing_committee
    must: draft_reg_repos_house_001_under_s7_extending_reg_repos_register_001_build_sequenced_after_permit_enforcement
    when: after_order
forbidden:
  - repos_house_or_any_office_conferring_or_deciding_legal_force_boundness_validity_or_canonicity
  - publishing_private_repo_facts_in_the_public_register
  - requiring_a_ministry_or_v1_v2_tree_layout_or_giving_v1_names_legal_or_path_effect
  - human_attestation_of_a_certification_field_that_must_be_a_kernel_output
exceptions:
