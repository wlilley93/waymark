runtime_summary: >
  Repos House is a declarative, non-sovereign, two-layer jurisdiction registry;
  certification restates deterministic kernel output, never an attestation;
  invocation binds, the registry only records; it extends REG-REPOS-REGISTER-001.
  MoJ/MBES are carried forward as Court Registry + Gazette Clerk and Toolchain +
  Skills/Agent Registry; policy arms become Policy Proposal records routed by the
  existing lawmaking route; V1 names are no-effect aliases. The model is settled
  by ruling; REG-REPOS-HOUSE-001 is drafted now and sequenced after permit
