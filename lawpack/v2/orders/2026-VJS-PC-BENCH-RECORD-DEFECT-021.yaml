runtime_summary: |
  On referral from [2026] VJS-CC-VJS 11. A defect in the RECORD of a bench is not a defect in the bench. BENCH_OPINION_MISSING is evidential and routed for correction; TIER_NOT_CONSTITUTED and BENCH_SIZE_MISMATCH stay constitutive and void. PC-16 closed LAUNDERING (an assent claim softening a known defect) and none of the thirteen did that. The gate's blindness does not change what the record is but is decisive as to remedy: the estate asserted an enforcement surface it did not have (hooks listed with pinned digests, files absent, gitignored and per-clone). Competence without the Sovereign turns on DIRECTION: narrowing an entrenched protection is reserved, ENLARGING it is not. The thirteen are BINDING AND FLAGGED on a dated ratcheting register that may only shrink (D2, D3). BENCH_SILENT_SEAT measures BREVITY not participation (a short concurrence is not silence) and must be corrected to accept an express concurrence before it is relied on for anything (D4); what follows once corrected is expressly left open. Recusals: the PC-8 and PC-19 benches are all disqualified, no judge sitting on whether their own silence voided their own order.
