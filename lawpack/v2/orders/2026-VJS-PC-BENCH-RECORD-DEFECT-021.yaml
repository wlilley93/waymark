id: 2026-VJS-PC-BENCH-RECORD-DEFECT-021
court: privy_council
jurisdiction: vibe-justice-system
repo_code: null
status: binding
issue: whether_a_constitutive_bench_defect_undetectable_by_any_running_gate_voids_its_order
holding: |
  ROUTE FOR CORRECTION. The bench code covers four defects that are not of one kind. TIER_NOT_CONSTITUTED and BENCH_SIZE_MISMATCH go to THE BENCH: if the tier was not constituted or the wrong number sat, no court issued anything and there is nothing for an assent claim to protect. PC-16 is right about those and is not disturbed. BENCH_OPINION_MISSING goes to THE RECORD OF THE BENCH: the court was the right court, the bench was the constituted odd size, the named seats are the seats, and what is absent is the document evidencing what each said. That is an evidential gap, not a constitutional one. To collapse the two is to hold that a court which sat properly ceases retrospectively to have been a court because a file is missing. PC-16 closed a different mischief: LAUNDERING, a party with a defect it knew of typing an assent claim to soften a hard gate. None of the thirteen did that. None asserts a bench it did not have or an opinion that does not exist. A ratio is bounded by its mischief, and applying PC-16's words past the act they were directed at would be using the authority past its ratio. On the gate's blindness: it does not change what the record IS, and an instrument's coverage can never be a source of validity. But it is decisive as to REMEDY. validate --staged was the only instrument that ever ran this check, it evaluates staged files alone, and the pre-commit hook that invokes it is gitignored, regenerated per clone, and was absent from the clone that made these records, while the committed install manifest listed it by name with a pinned digest. The estate asserted an enforcement surface it did not have. Where the duty-holder's own instrument never asked for the thing and the record-maker made no false claim, the answer is to ask for it now. This Board is competent without troubling the Sovereign because of the DIRECTION of travel. PC-16 carved an exception OUT of the entrenched assented-record floor; this reads that carve-out more narrowly, so MORE records enjoy the floor's protection. Narrowing an entrenched protection is reserved to the Sovereign; ENLARGING it is not. The general rule of construction follows: where a court is uncertain how far an exception to an entrenched protection extends, it construes the exception narrowly, because leaving the protection too wide is correctable later by a court and voiding records is not correctable at all once relied upon. On BENCH_SILENT_SEAT the Board is unanimous that the check as written measures BREVITY, not participation: it sizes the largest block of text a name owns, and a judge who writes "I agree and have nothing to add" has not been silent. Concurrence without separate reasons is ordinary and often the most disciplined form of agreement, and a rule that a short concurrence voids an order would require every judge to pad. The check therefore reports a broader result than it computed (the CC-VJS 11 vice) and cannot ground a void. Bingham would hold a seat that neither writes nor expressly concurs constitutively defective; Denning dissents from deciding it on evidence the Board has just held insufficient; Atkin does not reach it. That question is NOT the ratio and is expressly left open. CORRECTION RECORDED POST-JUDGMENT, PRE-PUBLICATION: the Board described the check as measuring BREVITY. That understated it. On implementing D4 both flagged seats were found to have written FULL CONCURRING OPINIONS ("Opinion of Tindale (concurring)", "Opinion of Wilberforce J. (concurring)"). They were flagged because the heuristic ends a seat's owned block at the next occurrence of any OTHER seat's name, and each opened by crediting a colleague ("I join Marchmont", "I concur in full with Reid J."), thereby handing their whole opinion to that colleague. The check penalised COURTESY, not brevity, and hardest against the collegial style good judgments use. Both findings were false positives and both orders are clear. This strengthens the ratio rather than disturbing it, and vindicates Denning: had Bingham's proposed rule been taken as ratio it would have rested on two findings that were not findings at all.
