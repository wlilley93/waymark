question: |
  Are thirteen binding orders declaring a bench with no source_opinion void ab initio under [2026] VJS-PC 16, or routed for correction, given the only gate able to detect it could never run over them?
title: A defect in the RECORD of a bench is not a defect in the bench; the thirteen are binding and flagged
