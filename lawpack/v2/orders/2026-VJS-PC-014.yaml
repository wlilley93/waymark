runtime_summary: >
  PC-13 reserved the master "single front door" rule until there was a complete map
  of which duties have a kernel gate and which do not. That map now exists (264
  duties, 22 wired, 242 unwired, produced through the kernel), so this Council
  enacts the rule now - but narrowly. The rule is subordinate machinery under s7: it
  amends no statute, court, tier, or the assent rule; it just enforces a duty that
  already exists - no governed record (law, ruling, citation, order, permit) may come
  into being except through route->court->record. Crucially, the "void it" edge bites
  ONLY on creating one of those records at the write moment, BEFORE assent. It does
  NOT touch the 242 unwired duties (most are declarative, one-time, or agent-judgement
  duties no deterministic gate should or can enforce) - they have no record-creation
  event for it to bite on. The instant a record carries a valid Sovereign or
  standing-bounded assent_source, the edge softens to "route for correction" and may
  never block or void it. The MCP "server of law" is adopted as the well-lit front
  door (and its missing convene/record/allocate verbs are to be added), but the rule
  rests NO guarantee on MCP, because an agent can always write a file directly. The
  real enforcer is the absolute-path commit hook that calls the kernel on whatever is
  staged, no matter which path the bytes took - that is the wall; MCP is the door. All
  checking logic stays in the kernel; hooks and the MCP adapter stay thin. All three
  justices noted that the case file's pinned hash (42cdb3f6...) does not match its
  actual bytes (4304d766...) and direct re-pinning to the decided bytes - itself a
  small live proof of why the front door is needed.
