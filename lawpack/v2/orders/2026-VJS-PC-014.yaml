id: "2026-VJS-PC-014"
assent_source: standing_bounded_assent
citation: "[2026] VJS-PC 14"
title: The Single Governed-Record Front Door
court: privy_council
jurisdiction: vibe-justice-system
status: binding
issue: single_front_door_consolidating_instrument_grounded_in_d11_conformance_map
bench:
  - Tindale
  - Rowanne
  - Marchmont
vote: >
  3-0 (Tindale J., Rowanne J., Marchmont J., unanimous on all five questions): the
  PC-13 D12 follow-on is RIPE; ENACT the consolidating "single front door, no other
  entry" instrument now, narrowly cut, under ACT-CONSOLIDATION-FRAMEWORK:s7. Position
  A's mechanism and timing prevail, disciplined by Position B's reservation (no
  guarantee rests on MCP; the absolute-path commit hook is the bypass-proof
  backstop). Position C (still reserve) and a plenary Position A (a void limb reaching
  the duty surface at large) both REJECTED. No dissent. All three justices
  independently recorded that the convening pin (sha256:42cdb3f6...) does not resolve
  to the decided bytes (sha256:4304d766...) and direct re-pinning as a clerical
  route-for-correction.
case_file_digest: "sha256:4304d766e6aef1dfc3752896f0eaf1cc3060973a9dd33942c88432c8e5883b8d"
convened_at: "2026-06-25T10:02:14.296900741+00:00"
question: >
  The PC-13 D12 follow-on, returned to this Council grounded in the now-complete D11
  conformance map (264 kernel-effect duties; 22 wired; 242 unwired). Per question
  Q1-Q5: (Q1) is the matter ripe to ENACT the consolidating single-front-door
  instrument now or does PC-13's reservation still bind; (Q2) is the MCP
  server_of_law posture, made the governed-record front door, adopted, narrowed, or
  rejected; (Q3) what does the wired-or-void limb bite on, given the 242 unwired
  duties are mostly declarative, one-time/transition, or agent-duties a deterministic
  gate cannot and need not enforce; (Q4) does the instrument honour as ABSOLUTES the
  anti-Henry-VIII limit (s7/s25), the ACT-ASSENTED-RECORD-PROTECTION floor, and
  REG-KERNEL-001 (thin hooks, kernel the only smart point); and (Q5) must the
  absolute-path commit hook remain the bypass-proof backstop, with no enforcement
  guarantee resting on MCP?
holding: >
  POSITION A's mechanism and timing, 3-0, disciplined by Position B's MCP
  reservation. Q1 (RIPENESS): RIPE; ENACT NOW. PC-13 D12 reserved the consolidating
  instrument on one named contingency - that it be grounded in a conformance map that
  did not then exist. The D11 map (produced THROUGH the kernel by vjs audit)
  discharges that contingency; PC-13's ratio, honoured, now points to enactment, not
  continued silence. Ripeness is SCOPED, not plenary: the map makes the matter ripe
  for a CHOKEPOINT instrument and un-ripe for any master rule biting on the duty
  surface at large. Position A prevails; Position C (still reserve) REJECTED -
  reserving now would refuse the very condition PC-13 attached and leave the F6
  disease (governed records minted outside route->court->record) structurally
  uncured; its legitimate read-across fear is answered by a precise cut, not by
  indefinite silence. Q2 (MECHANISM): the MCP server_of_law posture is ADOPTED as a
  front door and NARROWED. It amends nothing - REG-KERNEL-001 already names
  server_of_law as an in-force posture, so naming it the live interface is the
  thinnest machinery. It is the right SHAPE (it turns record-creation from a file an
  agent writes into a server-adjudicated act, removing the affordance the eleven
  self-asserted citations exploited). But MCP is a front door, not a wall: an agent
  with a filesystem can decline MCP and write a YAML file directly, so the claim that
  MCP is the SOLE interface, and any reliance on it as the enforcement guarantee, is
  REJECTED; the CLI record-creation path stays co-equal. Position A's mechanism
  prevails as narrowed; Position B's instinct (do not rest a constitutional rule on
  an incomplete interface) is honoured by the stronger route of not resting the rule
  on MCP AT ALL. Q3 (THE LIMB): the wired-or-void limb bites ONLY on GOVERNED-RECORD
  CREATION - the bringing-into-being of a law, ruling, citation, order, or permit -
  at the write/route chokepoint, PRE-ASSENT, and NOWHERE ELSE. This is the right and
  the only safe cut. It matches the disease exactly (F6: the breach was a record
  minted outside the door, not a duty left ungated in the abstract). By construction
  it does not intersect the 242 unwired duties: a declarative defines-clause, a
  one-time/transition act, and an agent-judgement duty create no governed-record
  write event for the limb to bite on. The Court REFUSES, as void to the extent of
  the inconsistency, any limb drafted to void "any unwired duty" - such a limb would
  collide with valid declarative law, with assented law, and (fatally) would scan
  across the assented-record-protection prohibitions that themselves sit unwired,
  purporting to void the floor that forbids voiding. The limb keys on the KIND of
  record and whether it passed the door, NEVER on the conformance map's counts or
  columns. Q4 (THE THREE ABSOLUTES): the instrument, so cut, honours all three as
  absolute limits, and the Court would refuse it if it did not. (a) Anti-Henry-VIII
  (s7/s25): the instrument amends no statute, bench, tier, jurisdiction, or assent
  rule; it adds machinery that refuses to let an un-routed, un-assented record
  masquerade as law - a gate that refuses an unlawful record ENFORCES, it does not
  amend; it is intra vires s7. (b) ACT-ASSENTED-RECORD-PROTECTION (entrenched): held
  as an ABSOLUTE - the limb bites pre-assent, in the gap before any assent_source can
  attach; the instant a record declares a valid assent_source (sovereign_assent or
  standing_bounded_assent, per the INV-ASSENT-SOURCE-001 fail-closed allow-list) the
  disposition DEGRADES to route-for-correction and may NEVER void or block; the
  defect code is registered in the kernel ROUTE_FOR_CORRECTION set, never as
  Error/Fatal/Block. (c) REG-KERNEL-001: the record-creation check lives in the
  kernel (the only smart point) beside the D1-D10 gates; the commit hook and the MCP
  adapter are thin translators that pass a typed event and exit on the verdict; no
  checking logic enters a hook or the MCP transport, and every denial names its
  instrument. Q5 (THE HONEST LIMIT): YES, unconditionally. The deterministic,
  absolute-path commit hook (the PC-13 D6 backstop), calling the kernel by repo-root
  path, bypass-proof of PATH, firing on the write/staged event regardless of how the
  bytes arrived, REMAINS the bypass-proof backstop and the SOLE seat of the
  enforcement guarantee. No enforcement guarantee rests on MCP exclusivity; "the
  agent used MCP" is never proof of conformance - conformance is established only by
  the record having passed the kernel gate. The MCP convene/record/allocate gap (the
  surface today exposes exactly route/lookup/validate/log/file/status, with no
  convene, record, or allocate verb) is directed CLOSED as a front-door improvement,
  not as the guarantee. The unifying principle PC-13 declared - no governed record
  may come into being except through the front door - is now given its consolidating
  instrument, defence in depth: MCP the well-lit door that makes the lawful path the
  easy path; the kernel record-creation check at the chokepoint the wall that holds
  whether or not the door was used.
