runtime_summary: >
  Unanimous (5-0) core ratio, 4-1 on the remedy (Everand J. dissenting in part). The K-1 question is a
  false binary: bare `met` would certify a universal negative no test proves (a paper claim), and terminal
  `partial` falsely signals unfinished work where the core is complete and the residue is unprovable by
  nature (an inverse overclaim). HELD: decompose - the mediation-and-coverage core is proven and `met`; the
  "no path around it" conjunct is severed and recorded as a named, non-machine-backstopped remainder (the
  edit-and-relock hole; backstops: the Sovereign's gate + the continuing duty of reasonable care). The
  integrated invariant carries a new status `met-modulo-remainder`, fenced so it issues only for a residue
  proven unprovable-by-nature (not unfinished), with K-29/K-30 undisturbed. Future rule: no invariant
  statement asserts a universal negative as a conjunct claimed-proven; decompose and record the residue with
  a named backstop. K-1 is recorded `met-modulo-remainder`.
