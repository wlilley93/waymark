runtime_summary: >
  SC of nine, 9-0. A federation root coordinates lawfully only while infrastructural,
  adoption-based, canonical-respecting and exit-preserving (bright-line, kernel-checked);
  practical subjection is a court standard, not a kernel gate; default subscription is
  lawful because revocable. The PC is the transition court; the V1 Court acts only to
  perfect already-heard matters and find contested validity; the Court of Appeal
  persists. General V1 law crosses only by an express, entry-by-entry, rank-matched,
  fail-closed incorporation recorded in the migration ledger; repo-specific law uses the
  VJS-PC 1 continuity election; the protective floor may not be weakened. The "V2"
  ordinal is spent; the canon is unqualified, "V1" the estate label; de-naming is
  prospective, non-disturbing, governed - never a mass edit (the lawpack lock and
  path-scoped invariants forbid it). The Committee is directed to codify the five
  instruments; all are void first drafts until assented (s.14, s.23). Single apex
  (s.15) entrenched and not re-opened.
