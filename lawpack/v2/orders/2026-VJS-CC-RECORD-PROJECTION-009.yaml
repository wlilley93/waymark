question: |
  Are the two files that share an order id and citation across .vjs/orders and .vjs/court/orders one record in two projections or two records, and may check_citation_uniqueness widen to all governed-record roots before that is settled?
title: One record in two projections; the allocator and the uniqueness guard must read the same register
