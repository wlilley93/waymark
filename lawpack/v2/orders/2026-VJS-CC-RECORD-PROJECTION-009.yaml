runtime_summary: |
  One record, two projections. .vjs/court/orders is authoritative; .vjs/orders is the kernel-store projection (a proper content subset once nulls and timestamp encoding are normalised, generated by Store::write_order, and lossy on title/question until the 2026-07-27 serde repair). Both are legitimate: nothing resolves court/orders at runtime, so the pair is the arrangement, not the bug. The ratio: the citation ALLOCATOR and the citation UNIQUENESS GUARD are two halves of one rule and must read the SAME register. The guard must widen to front_door::governed_record_roots (D1) and must collapse by record id first, since two files sharing an id are one claim (D2), proven red both ways (D3). PC-13 D2 uniqueness reaches .vjs, not lawpack alone. Leave both pairs in place (D5).
