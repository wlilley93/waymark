id: 2026-VJS-CC-RECORD-PROJECTION-009
court: county
jurisdiction: vibe-justice-system
repo_code: null
status: binding
issue: projection_vs_record_and_the_uniqueness_register
holding: |
  ONE record in two projections, and the court/orders file is the authoritative one. The court verified the pairs itself rather than on the reference's assertion. Once null-valued keys are dropped and the timestamps normalised (one file quotes them, the other does not, so a naive parse reports a difference that is an encoding artefact, and directives[0] differs only by a null `when` key), the .vjs/orders file contains NOTHING the .vjs/court/orders file lacks, while the court file carries `title` and `question` with real values. Content-wise the orders copy is a PROPER SUBSET. It is also produced mechanically: its key order is exactly the field order of the `Order` struct and `Store::write_order` serialises that struct into .vjs/orders. A file whose content is wholly contained in another, and which is generated by serialising a struct parsed FROM that other, is a projection and not a second claim on the citation. Reading B (two records) would have the realm void or renumber one of a pair on the strength of a difference that is entirely an artefact of how a struct round-trips, which is the mischief the derive-from-the-record ratio already forbids: do not store a derived thing beside the record and then treat it as an independent authority. That the projection was LOSSY is not a reason to promote it; it is the proof it is derived. `title` and `question` were dropped on parse until the 2026-07-27 serde-flatten repair, so the kernel-store projection silently discarded the operative context of every order it wrote, and the richer file is necessarily the source. Both files are nonetheless legitimate and neither is surplus, because nothing resolves .vjs/court/orders at runtime: `overlay_filed_orders` reads .vjs/orders only. The authoritative record and the runtime projection are two jobs, and the pair is the correct arrangement, not the defect. On Q3 and Q4 the court states the ratio the reference did not reach. The allocator and the uniqueness guard are two halves of ONE rule and must read the SAME register. A guard narrower than the allocator passes collisions the allocator can mint; a guard wider than the allocator fails on records the allocator cannot see. Today they disagree in both directions: the allocator reads all three governed-record roots and the guard reads lawpack/v2 alone, where it can see neither copy of either pair. So the guard MAY and MUST widen, but only bound to the same `front_door::governed_record_roots` the allocator uses, and only after collapsing by record `id`, because two files sharing an id are one claim. [2026] VJS-PC 13 D2's uniqueness directive reaches .vjs: `is_governed_record` counts both roots, and a uniqueness duty that stopped at the lawpack would leave every County order in the estate outside the rule it exists to enforce.
