runtime_summary: >
  An adversarial audit proved a forgery: a staged record that merely TYPES
  "assent_source: sovereign_assent" while pointing at no real assent event got every Fatal
  finding downgraded to a Warning and committed, and a bench-less, never-convened "Supreme
  Court order" slipped through this way. The Council, 3-0, holds the cure is faithful
  INTERPRETATION, not an amendment, so it BUILDS the fix now and routes nothing to the Sovereign
  for assent. (Q1 NATURE) "Valid assent_source" already means an assent that RESOLVES to a real,
  digest-matched Sovereign-assent event whose scope and date cover the record, not just a string
  on the allow-list. The floor (VJS-ACT 10 s.1) protects a record "within the meaning of s.23,"
  and s.23 says a valid source is one "resolving to a specific Sovereign-assent event" and that
  "an unresolved trace ... cause[s] rejection." The kernel checked only the spelling and skipped
  resolution - its own code comment even recites the resolution rule it then fails to perform.
  The bug is an under-implementation of an existing entrenched word. (Q2 MECHANISM) The kernel
  must run a deterministic, model-free check: the source is on the allow-list AND points at
  exactly one real assent event under the digest-pinned provenance tree whose digest matches
  byte-for-byte AND that event covers the record by scope (the existing EntityScope::covers test)
  and date. Anything unresolved, mismatched, or out of scope is NO valid assent_source and stays
  Fatal. (Q3 THE FLOOR)
  Requiring resolution does NOT break the floor's never-void/never-block guarantee. s.2 says
  the Act "confers no force on any record that lacks a valid assent_source ... it does not
  enlarge it." A forgery was never inside the shelter, so leaving it Fatal voids nothing - a
  false signature is no signature. The opposite reading would let any author immunise any record
  by typing two words, sheltering the very forgery the floor exists to exclude. This
  is interpretation within the Council's power: it changes no entrenched word and strips
  protection from no real assent (every genuine assent in canon resolves and keeps its
  route-for-correction), so it is NOT routed to the Sovereign; a confirming amendment is even
  rejected, because asking for it would imply the meaning was contingent on it. The Sovereign
  keeps the prerogative to put it beyond argument by an Act, as NOTICE only. (Q4 RESIDUALS) The
  agent self-issuing its own "vjs route" permits is AFFIRMED as by-design (the permit records
  that the actor took the front door, not that an authority approved), tightened so it binds to
  its own scope/digest and cannot launder reserved force. The self-satisfiable kernel-edit
  (weaken a gate, rebuild, the weakened binary blesses it) is a real defect, tightened by
  digest-pinning the gate code and surfacing a loud Fatal when it is edited; the Council records
  candidly that an author with full write access is beyond any in-binary check, leaving the
  breach duty and the Sovereign's gate as the backstop. The void apex "order" is void on both
  grounds and routed for correction; the breach is self-filed; the remedy is to make the work
  good.
