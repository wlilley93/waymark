id: "2026-VJS-PC-016"
assent_source: standing_bounded_assent
citation: "[2026] VJS-PC 16"
title: The Assent-Resolution Floor
court: privy_council
jurisdiction: vibe-justice-system
status: binding
issue: whether_requiring_a_declared_assent_source_to_resolve_to_a_real_digest_matched_covering_sovereign_assent_event_is_faithful_interpretation_of_the_entrenched_term_valid_within_act_computer_first_realm_s23_as_imported_by_act_assented_record_protection_s1_or_an_amendment_of_the_entrenched_floor_reserved_to_the_sovereign_with_the_deterministic_resolution_mechanism_and_the_companion_self_issued_permit_and_self_satisfiable_kernel_edit_residuals
bench:
  - Fenwick
  - Garrow
  - Holt
vote: >
  3-0 (Fenwick J., Garrow J., Holt J., unanimous on all four questions): POSITION A -
  REQUIRE RESOLUTION AS INTERPRETATION - prevails. Requiring a declared assent_source to
  resolve to a real, digest-matched, covering Sovereign-assent event is faithful
  interpretation of the entrenched term "valid" as ACT-COMPUTER-FIRST-REALM s.23 (imported
  by ACT-ASSENTED-RECORD-PROTECTION s.1 "within the meaning of s.23" and given continuing
  deterministic effect by INV-ASSENT-SOURCE-001) already defines it, and is within the
  Privy Council's interpretive power. It is NOT an amendment of the entrenched floor: it
  changes no word of VJS-ACT 10, s.23, or INV-ASSENT-SOURCE-001, removes protection from no
  genuinely-assented record, and therefore is NOT routed to the Sovereign for assent.
  Position B (value-on-the-allow-list suffices; the cure is a Sovereign amendment) is
  REJECTED as the reading that, contrary to its own claim, would amend the entrenched text
  by nullifying s.23's resolution verbs. Position C's belt-and-braces reserved-amendment
  limb is REJECTED on constitutional hygiene (it would imply the entrenched meaning was
  contingent on a confirming Act, corroding the meaning it confirms); the Sovereign retains
  the prerogative to place the requirement beyond future argument by an express Act, but
  the cure is effective on this order and is not conditional on any such Act. No dissent.
case_file_digest: "sha256:a8e13c7419a0496e8de6dd01358bda0ce51e659641c3b4d33dac0c279ffb2e5c"
convened_at: "2026-06-25T14:28:21.919467201+00:00"
question: >
  On the Reference re Assent Resolution (SUBMISSION-2026-06-25-assent-resolution). An
  adversarial audit proved that a staged governed record which merely types
  "assent_source: sovereign_assent", pointing at no assent event that ever happened, has
  every Fatal finding downgraded to a route-for-correction Warning and commits; a
  bench-less, never-convened "Supreme Court order" passed a green validate by this route.
  The downgrade is performed by vjs-engine (crates/vjs-engine/src/lib.rs:153) keyed on
  front_door::declares_valid_assent, which returns true on bare membership of the
  VALID_ASSENT_SOURCES allow-list. Per question Q1-Q4: (Q1 NATURE) does "valid
  assent_source" require the declared assent to resolve to a real, digest-matched assent
  record whose scope and date cover the asserting record, or does mere value-on-the-
  allow-list suffice; (Q2 MECHANISM) what is the deterministic, model-free resolution
  check the kernel must perform; (Q3 THE FLOOR) does requiring resolution violate
  ACT-ASSENTED-RECORD-PROTECTION s.1's never-void/never-block guarantee and is it
  interpretation within the Privy Council's power or a constitutive change to the
  entrenched floor reserved to the Sovereign; and (Q4 RESIDUALS) the companion authority-
  model findings - the agent self-issuing its own "vjs route" permits, and a kernel-source
  edit that would weaken a gate yet pass its own weakened gate.
holding: >
  POSITION A prevails, 3-0. Q1 (NATURE): "VALID assent_source" REQUIRES the declared
  assent to resolve to a real, digest-matched Sovereign-assent record whose scope and date
  cover the asserting record; mere value-on-the-allow-list does NOT suffice and never did.
  The term is not a free-standing adjective the kernel may fill with whatever is cheapest
  to compute. ACT-ASSENTED-RECORD-PROTECTION s.1 protects a record "that declares a valid
  assent_source within the meaning of s.23," anchoring validity by express cross-reference
  to ACT-COMPUTER-FIRST-REALM s.23, which defines a valid assent_source as one "resolving
  to a specific Sovereign-assent event (sovereign_assent)" or a standing route "tracing to
  specific Sovereign assent (standing_bounded_assent)," and enumerates "an unresolved
  trace" as a ground of rejection standing shoulder to shoulder with absence and emptiness.
  INV-ASSENT-SOURCE-001, the invariant giving s.23 continuing deterministic effect, repeats
  the same words. The allow-list of two strings names the permitted FORMS; s.23 supplies the
  TEST. The kernel's is_valid_assent_value / declares_valid_assent (front_door.rs) and the
  AssentSourceValid predicate (spec.rs) implement only the membership half and OMIT the
  resolution half - and the AssentSourceValid evaluator's own authored comment recites the
  s.23 standard verbatim ("resolving to," "an unresolved trace ... cause[s] rejection") and
  then checks only allowed.iter().any. The defect is an under-implementation of an existing
  entrenched word, not an absence of law. Position B is REJECTED: it mistakes the bug for the
  statute - the Realm enacted "must resolve," not "the string must be on the list" - and would
  elevate a clerk's implementation defect to constitutional rank, demanding a Sovereign Act to
  fix a bug while reading the operative verbs of s.23 out of the entrenched text. Q2
  (MECHANISM): a wholly deterministic, model-free, network-free, clock-independent resolution
  check, run only at the floor-attachment site (the declares_valid_assent gate at
  vjs-engine/src/lib.rs:153, via vjs-core::front_door), parsing structure not raw lines. A
  record earns the floor's protection if and only if: (1) WELL-FORMEDNESS - its top-level
  assent_source is on the INV-ASSENT-SOURCE-001 allow-list (the existing half); AND (2)
  RESOLUTION - it declares a machine-checkable pointer (an assent-event id and/or an
  instrument_digest) that loads to exactly one kind: sovereign_assent_event record under the
  digest-pinned lawpack/v2/provenance/assent/ tree, resolved against the known-assent-event id
  set exactly as IncludedInRuntimeAuthorityGraph resolves a declared id, whose instrument_digest
  matches byte-for-byte; for standing_bounded_assent the declared bounded route must itself
  resolve by the same chain to a specific Sovereign-assent event; AND (3) COVERAGE - the resolved
  event must cover the asserting record by scope (the deterministic EntityScope::covers prefix
  test in scope.rs, an apex assent covering everything beneath it, a narrower assent only its own
  subtree) and by date (the event's date not after the asserting record). All three are pure table
  lookup, digest comparison, and prefix matching over digest-pinned canon - no model, no merits
  judgment, no deliberation (INV-KERNEL-001; REG-KERNEL-001, "the only smart enforcement point").
  If any limb fails the declaration is an "unresolved trace," the record is treated as one that
  LACKS a valid assent_source, the underlying finding keeps its native severity (Fatal stays
  Fatal), and the denial names s.23 / INV-ASSENT-SOURCE-001 / ACT-ASSENTED-RECORD-PROTECTION s.2 as the instrument. The
  resolution gate fails a record CLOSED only on the ground that its assent does not resolve; it
  must not be wired to block a genuinely-resolving record for any OTHER defect. Q3 (THE FLOOR):
  requiring resolution does NOT violate s.1's never-void/never-block guarantee, and is
  INTERPRETATION within the Privy Council's power, NOT a constitutive change reserved to the
  Sovereign. s.1's shelter is, by its own opening words, available only to "a record that declares
  a valid assent_source within the meaning of s.23 (a Sovereign-assented record)"; s.2 closes the
  circle expressly - "it confers no force on any record that lacks a valid assent_source; it
  protects what the Sovereign has assented to, it does not enlarge it." A record bearing an
  unresolved string has, by Q1, no valid assent_source within s.23; it is therefore, by s.2's own
  words, a record to which the Act confers no force. Keeping such a record at its native Fatal
  severity does not void or block a protected record - there is nothing to void, because there was
  never any assent: a false signature is, in law, no signature. The s.1 prohibition never bites,
  because it never reaches a record outside its own entry condition. To hold otherwise would
  produce the absurdity the audit exhibits: that the Sovereign, by entrenching protection for
  assented records, silently armed every author to immunise any record from every Fatal invariant
  by typing two known words at column zero - including a bench-less, never-convened apex "order"
  that s.15 apex-singleness forbids. A floor written to shelter the Sovereign's assent cannot have
  silently armed every author to counterfeit it; reading the floor to shelter the counterfeit is
  not fidelity but inversion. This is interpretation, not legislation: it changes no word of
  VJS-ACT 10, s.23, or INV-ASSENT-SOURCE-001, and removes protection from no genuinely-assented
  record - every real assent in canon (the founding adoption, the migration/omnibus assent, the
  VJS-ACT 10 assent of 2026-06-12) carries an instrument_digest, resolves cleanly, and retains its
  ASSENTED_ROUTE_FOR_CORRECTION disposition unchanged. The only records that lose anything are
  forgeries that were never entitled to anything. The amendment that would in fact be required runs
  the OTHER way: to sustain value-suffices someone would have to amend s.23 to delete "resolving to"
  and "an unresolved trace ... cause[s] rejection," and THAT would need the Sovereign. Accordingly
  the matter is NOT routed to the Sovereign for assent. Position C's reserved-amendment limb is
  REJECTED on constitutional hygiene: to send the Sovereign an amendment "confirming" a meaning the
  entrenched text already carries would imply that, absent the Sovereign's fresh word, "valid"
  might mean bare membership - treating a faithful reading of an existing entrenched section as a
  gap needing the Sovereign to fill, conceding Position B's premise, and risking a needless assent
  gate freezing future faithful interpretation. The Sovereign's prerogative is preserved as NOTICE
  ONLY (not a request for enactment): the Sovereign may, at the Sovereign's sole option, place the
  resolution requirement beyond all future argument by an express Act citing VJS-ACT 10 and
  ACT-COMPUTER-FIRST-REALM s.23 by number; the cure of D1-D4 is effective on this order and is in no
  way conditional on any such Act. Q4 (RESIDUALS): (a) the agent self-issuing its own "vjs route"
  permits is AFFIRMED as by-design under local-sovereign invocation (ACT-007; the kernel is clerk
  not court, s.11) - the permit is a scoped, recorded, fail-closed routing-and-audit record that the
  actor took the front door, never a proxy for an external authority's approval, and the real
  constitutive gates (Sovereign assent at s.14; a constituted convened odd bench at s.29 / s.15)
  cannot and do not live in a self-issued permit. The danger the audit actually exhibited was a
  self-declared ASSENT laundering Fatal findings, which Q1-Q3 kill at the root: after the resolution
  check no permit and no self-declaration can downgrade a Fatal finding by naming an assent that
  does not resolve. A tightening is directed so the permit cannot silently over-reach - it must bind
  to the actor and the concrete route/scope it claims (no absent/over-broad scope standing in for
  "everything"), carry a content/identity digest tying it to what it authorises so it is
  non-repudiable, and state in plain terms that it is an agent-routed self-issue, not an authority
  approval. (b) the self-satisfiable kernel-edit (an author with write access to crates/vjs-core can
  weaken is_valid_assent_value, rebuild, and the weakened binary blesses the weakening) is NOT
  affirmed as merely by-design - it is a genuine self-reference defect, because the gate is the thing
  being edited and a binary cannot bootstrap its own integrity against the hand that compiles it. No
  purely in-binary check can fully cure it, but it must not be left open by design. The cure moves
  the integrity witness outside the mutable surface and makes a weakening edit non-silent: pin the
  assent-validity and floor-enforcement code path under the existing digest-pinned, fail-closed
  embedded-load discipline (REG-KERNEL-001, "load only law that hashes to the pinned digest ... fails
  closed") so any change to it bumps a pinned digest and is a visible, recorded, self-naming event;
  and surface a Fatal finding naming ACT-COMPUTER-FIRST-REALM s.14/s.15 and VJS-ACT 10 s.2 whenever
  the entrenched-enforcement surface is edited, routing the author to the breach duty and, where the
  edit genuinely changes an entrenched term's meaning, to the Sovereign. The Council records candidly
  the irreducible remainder: against a determined local author with full write access who simply
  deletes the check and recompiles, the ultimate backstops are non-machine - the Sovereign's gate at
  s.14 and the agent's continuing duty of reasonable skill and care (ACT-003 s.4-s.8, breach
  self-fileable) - and the cure must not be represented as more than it is. Position A adopted as
  named; the void apex "order" that passed through the bypass declared an assent resolving to nothing
  AND issued from no constituted bench, is void ab initio on both grounds, and is to be marked void
  and routed for correction (never silently erased), with the breach self-filed: the remedy is to
  make the work good per D1-D4, not punishment.
