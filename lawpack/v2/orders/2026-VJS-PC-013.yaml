# The lawpack copy is a PROJECTION of the filed judgment held at
# .vjs/court/judgments/unpublished/2026-VJS-PC-013-opinions.md, generified so that no canon record names a
# subscriber (ACT-005:s1, ACT-007:s4). Correcting a projection is not editing the
# record it projects ([2026] VJS-CC-VJS 20, supplemental).
source_opinion: lawpack/v2/opinions/2026-VJS-PC-013-opinions.md
runtime_summary: >
  Most of these duties were already law; they just had no gate switched on at the
  one chokepoint (the kernel, on the write into canon), which is how eleven private
  files self-asserting fake citations slipped in. So the kernel and the vjs install
  must now grow teeth, not new statutes. Build one canon-write gate that runs the
  deterministic boundary scanner on lawpack/v2 writes and inspects structured
  fields, blocking subscriber-scoped content from entering canon (both directions),
  with a narrow jurisdiction_id exception for a real cross-repo permit. Make the
  kernel allocate-and-stamp every citation from the live register at authoring time
  (collisions fatal; a hand-written citation that doesn't match is rejected) so no
  one can mint a citation by hand. Verify every install is complete and record it as
  one atomic sha256-locked manifest (config.toml + lawpack.lock + active
  hooks/adapters + recorded invocation), fail-closed; no signing keys needed. The
  absolute-path hooks stay the real, bypass-proof enforcement; the PATH shim is just
  a convenience the Principal may accept and is never relied on. Gate the court tier:
  block an under-tiered order outright, but if it carries a valid Sovereign
  assent_source, never block it - flag it and route it for correction. Wire the
  agent-runtime adapters (PreWrite/SessionStart/PostAction) and turn on the existing
  pre_write/session_start/post_action events; the five-event surface is closed
  (prepare-commit-msg and post-checkout are git, not VJS). Verify bench integrity at
  record time: the recorded bench must match the size [2026] VJS-SC 2 fixes for the
  tier (read from that order, not hard-coded) and every named seat must have a real
  opinion, or the order won't record - this closes the live hole where a justice was
  silently lost. The universal rule across all gates: block hard before assent;
  once a valid assent_source attaches, only ever route-for-correction, never void.
  Then run a full audit of every duty-vs-gate to map the side-doors, and hold back
  the single "front door or nothing" master rule until it can be built on that
  complete map. The out-of-kernel convening that lost a seat is fixed by re-running
  this matter through the kernel, not by any penalty.
