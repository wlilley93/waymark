id: "2026-VJS-PC-013"
assent_source: standing_bounded_assent
citation: "[2026] VJS-PC 13"
title: Teeth For The Front Door
court: privy_council
jurisdiction: vibe-justice-system
status: binding
issue: kernel_enforcement_gaps_canon_write_chokepoint
bench:
  - Tindale
  - Rowanne
  - Marchmont
vote: >
  3-0 (Tindale J., Rowanne J., Marchmont J., unanimous on all nine questions):
  Position A. Direct the machinery/wiring fixes now (each gate giving teeth to an
  existing duty under ACT-CONSOLIDATION-FRAMEWORK:s7, each carrying the
  assent-conditioned Block-or-route verdict ACT-ASSENTED-RECORD-PROTECTION requires), dispose the Q4 and
  Q8 first-impression points and the Q5 design fork, mandate the full-spectrum
  conformance audit, and RESERVE the consolidating single-front-door instrument
  to a grounded follow-on. No dissent.
case_file_digest: "sha256:6c6597a679e798be72bc48a6fb3d4031549248f9b19f97e7786937b666ce5601"
convened_at: "2026-06-24T22:41:30.298124629+00:00"
question: >
  The case file diagnoses eight enforcement gaps where an enacted substantive
  duty has no deterministic kernel gate at the canon-write chokepoint (the vector
  by which eleven subscriber-scoped files self-asserted [2026] VJS-DEC 15-22 into
  canon), plus a ninth question on whether to consolidate. Per question Q1-Q9:
  which gaps are enforcement of existing law to be directed as machinery under
  ACT-CONSOLIDATION-FRAMEWORK:s7; which are decisive engineering calls needing no
  ruling; how are the Q4 first-impression points (atomic install manifest; PATH
  shim) disposed; how does the Q5 tier-floor gate reconcile block-vs-warn with the
  ACT-ASSENTED-RECORD-PROTECTION assented-record floor; what bench-integrity verification (Q8) is owed;
  and should the consolidating "single front door, no other entry" instrument be
  enacted now or reserved (Q9)?
holding: >
  POSITION A, 3-0. The disease across Q1-Q8 is one: an enacted, in-force (and in
  its public/private and assent limbs entrenched) substantive duty with no
  deterministic gate at the chokepoint - law without teeth, not lawlessness. The
  cure is machinery under ACT-CONSOLIDATION-FRAMEWORK:s7 giving teeth to existing
  law, not fresh legislation; the Court REFUSES to re-legislate any settled duty.
  Two hard constraints bind every gate: the anti-Henry-VIII limit (s7/s25 - no
  gate may amend a statute, bench, tier, jurisdiction, or the assent rule; a gate
  that merely refuses an unlawful write enforces, it does not amend), and the
  ACT-ASSENTED-RECORD-PROTECTION floor (a record declaring a valid assent_source may never be voided or
  blocked, only surfaced/flagged/routed-for-correction; s2 confers no protection
  on a record lacking a valid assent_source). The governing discipline is
  therefore: GATE HARD PRE-ASSENT; DOWNGRADE TO ROUTE-FOR-CORRECTION ONCE A VALID
  ASSENT_SOURCE ATTACHES. Q1 (canonicity gate): enforcement of existing law
  (ACT-005:s1/s3/s5/s7), directed as machinery (D1). Q2 (citation allocation):
  enforcement of ACT-004:s8, directed as machinery; allocation runs at authoring,
  before assent, so the fatal-collision policy never meets an assented record
  (D2). Q3 (jurisdiction-scope twin): the same defect as Q1 from the federation
  side; CONSOLIDATED into one canon-write gate (not two), enforcing ACT-007:s4 /
  REG-FEDERATION-COORDINATION-001 with a thin jurisdiction_id exception for a true
  cross-repo permit (folded into D1, D3). Q4(a) install-completeness invariant:
  enforcement of REG-INVOCATION-001, ACT-007:s1 and the ratio of [2026] VJS-PC 6,
  directed as machinery (D4). Q4(b) atomic locked manifest [FIRST IMPRESSION,
  DISPOSED]: REG-BUNDLE-001's atomic verify reaches only cross-repo bundles, so
  the per-repo install manifest is an open FORM question; the Court directs it as
  s7 form-machinery mirroring the REG-ACCESSION-001/REG-BUNDLE-001 lock pattern,
  repo-scoped, enumerating EXACTLY the REG-INVOCATION-001 surface (config.toml +
  lawpack.lock digest + active hooks/adapters + recorded invocation) and no more;
  NO external signing-key dependency is mandated (sha256 lock suffices) (D5).
  Q4(c) PATH shim [FIRST IMPRESSION; PRINCIPAL-DEPENDENCY]: wholly unlegislated and
  mutates host state OUTSIDE the governed repo; the absolute-path hooks are and
  remain the bypass-proof enforcement backstop and discharge the duty; the
  PATH-visible shim is RECOMMENDED, opt-in, offered for the Principal's
  authorisation, never a fail-closed condition; the Court REFUSES to mandate it and
  records that nothing in this order requires the Principal to alter their host
  environment (D6). Q5 (tier-floor; block-vs-warn under ACT-ASSENTED-RECORD-PROTECTION): enforcement of
  ACT-002:s2/s3/s4, directed as machinery, BIFURCATED by assent state - HARD-BLOCK
  a non-assented order below tier (an order from an unconstituted court is not
  validly constituted); ROUTE-FOR-CORRECTION ONLY, never block or void, where a
  valid assent_source is present; a directive to void/block an assented record for
  a tier defect is void pro tanto under ACT-ASSENTED-RECORD-PROTECTION/s25 (D7). Q6 (front-door adapters):
  a decisive engineering call under REG-INVOCATION-001 install_enforcement_hooks
  and REG-HOOKS-001's thin-adapter rule (no fresh ruling needed); directed
  expressly for clarity and to bind it to the manifest (D8). Q7 (hook
  completeness): wire the existing pre_write (priority), session_start, post_action
  events as machinery; AFFIRMED that "prepare-commit-msg" and "post-checkout" are
  non-VJS git names outside REG-HOOKS-001's closed five-event surface and must NOT
  be added (D9). Q8 (bench-integrity verification) [FIRST IMPRESSION on form;
  failed LIVE in this matter's preparation when a justice-seat was silently lost to
  a capacity error]: enforcement of the extant constitution ([2026] VJS-SC 2 and
  REG-COURT-RECORD-001, which records but does not verify); a fail-closed
  VERIFICATION gate is the right and sufficient floor; it reads bench sizes BY
  REFERENCE from [2026] VJS-SC 2 (never restates or hard-codes them, so it cannot
  amend the constitution) and refuses an order unless the recorded bench size
  equals the constituted odd size for the tier AND every counted seat is matched by
  a present, non-empty opinion in source_opinion (a named-but-silent seat fails);
  the fuller convene-first/heartbeat state machine is RESERVED to the audit track,
  not mandated now (D10). The Court records Lexby's self-file of the out-of-kernel
  convening as a falling-below remedied RESTORATIVELY by re-running this matter
  through the kernel (ACT-CONSOLIDATION-FRAMEWORK:s21, fourth limb), with no
  punishment. Q9: POSITION A confirmed; POSITION B (omnibus consolidating rule now)
  REJECTED because enacting the master wired-or-void rule on a partial door-census
  would commit the very sin this matter prosecutes - law asserted ahead of its
  ground truth - and a void-rule switched on before the gates exist would collide
  with ACT-ASSENTED-RECORD-PROTECTION wherever an assented record is implicated; POSITION C (fix only
  Q1/Q2/Q8) REJECTED as under-reaching, leaving Q4-Q7 enacted-but-unwired duties as
  undefended side-doors. The Court MANDATES a full-spectrum conformance audit
  enumerating every substantive duty (must / must_not / prohibits) in every
  in-force instrument and recording, deterministically, whether each is bound to a
  kernel gate, producing a conformance map of unwired duties, itself produced
  THROUGH the kernel (D11); and RESERVES (enacting nothing today) the consolidating
  "single front door, no other entry" instrument to a follow-on grounded in that
  map, returned to this Council or higher, made under s7 (anti-Henry-VIII), with
  its wired-or-void limb biting at the write/route chokepoint pre-assent and
  degrading to route-for-correction for any assented record (D12). The unifying
  principle - no governed record (law, ruling, citation, order) may come into being
  except through the front door; any other entry is structurally a breach - is
  DECLARED correct and already latent in enacted law (REG-KERNEL-001's single smart
  enforcement point; REG-SELF-CONVENE-001's fail-closed route gate; DEC-AGENT-001).
  Teeth and audit now; the master lock withheld until it can be cut to fit every
  door at once.
