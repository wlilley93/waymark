issue: governance.s23-sc10-location
question: >
  Whether section 23 case-law and REALM-SC 10 may be back-filled into the V1 archival estate as
  verified transcription and derived minute only, carrying no live authority?
holding: >
  V2 Privy Council, 3-0, on a hybrid split by instrument. The V1 case-law assent floor (s.23) and
  [2026] REALM-SC 10 are treated as good law and reproduced operatively in the
  assented Bill 32 Part 12 + the V2 provenance, but absent from the V1 tree. The
  record is made whole by back-filling into the V1 archival estate: a V1 case-law
  s.23 article by word-for-word transcription verified against the assented
  digest sha256:8e1d3f51, any unverifiable wording left a cited gap; and a
  [2026] REALM-SC 10 DERIVED MINUTE only (record_kind derived_minute,
  native_judgment false) reproducing the disposition, handover order, result and
  cited ratios - never an authored native judgment, which would fabricate the
  founding record. Both carry estate markers (estate v1_archive, status
  archival_source_only, live_authority false) and a lineage edge to the V2
  provenance; a citation to either is a source edge, not an authority edge. The
  write is the registrar's, as the Principal's warranted V1-estate act folded
  into the governed staged consolidation; the kernel performs no part. The
  Framework Act Schedule-3 stay lifts on digest-verified completion.
directives:
  - id: D1
    actor: registrar
    must: transcribe_case_law_s23_into_v1_verified_against_the_assented_digest
