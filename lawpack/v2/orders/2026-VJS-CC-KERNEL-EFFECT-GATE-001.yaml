runtime_summary: >
  The s.5(a) kernel-effect gate is machinery with conditions: it gives deterministic
  effect to s.5's own exclusion of inert records, but must ROUTE FOR CORRECTION (never
  silently void) a record whose kernel_effect uses an unevaluable verb, flagging an
  assented one as a registry-coverage gap cured by extending the registry. Parses
  structure only, no model, leaves limb (b) at the agent rung. 1-0; permission to
  appeal to the Privy Council granted on the dividing-line and assent-floor points.
