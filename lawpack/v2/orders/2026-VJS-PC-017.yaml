runtime_summary: >
  The bench-integrity gate checks only that an order came from a real, odd, fully-seated bench; it
  never reads the LAW the order cites. So an order whose holding, a directive, or a forbidden
  clause leans on an authority that does not exist - a hallucinated "s.99", a phantom "[2026]
  VJS-PC 99" - passes validate and enters canon, although our doctrine says a ruling made in
  ignorance of binding law is per incuriam and void. The integrating writer caught exactly this by
  hand when recording [2026] VJS-PC 16. The Council, 3-0, ADOPTS a deterministic, model-free gate
  that grounds the EXISTENCE of an order's operative citations, but makes it CORRECTABLE, not
  constitutive (Position B). (Q1 ADOPT) Checking whether a cited authority and section resolve to a
  real, defined object is a table lookup - structural, not merits - and gives teeth to a duty that
  already exists. It is machinery under ACT-CONSOLIDATION-FRAMEWORK s.7 and amends nothing. Per
  incuriam has three limbs - the authority must EXIST, be stated FAITHFULLY, and be MATERIAL - and
  the clerk can answer only the first; fidelity and materiality are merits reserved to a court
  (REG-KERNEL-001). (Q2 DISPOSITION) An unresolved operative citation is Fatal but CORRECTABLE.
  Position A (void ab initio, constitutive) is REJECTED twice over: presuming voidness is a
  conclusion of law about whether the ratio DEPENDS on the bad citation, which only a court may
  reach; and treating it as constitutive would let the machine BLOCK a Sovereign-assented order for
  a content defect, narrowing the entrenched ACT-ASSENTED-RECORD-PROTECTION floor - beyond the
  power of machinery (s.7/s.25). Constitutive defects go to a record's IDENTITY (bench, tier, apex,
  unique citation name); a hallucinated citation goes to its CONTENT. So: a non-assented order fails
  CLOSED (the gate declines to file it); an assented, resolving order is SURFACED and ROUTED FOR
  CORRECTION, never voided or blocked. The clerk says "this cites X, which resolves to nothing; fix
  it", never "this order is void." (Q3 SCOPE) The gate runs on operative parts only - holding,
  directives, forbidden - at SECTION granularity (both the instrument and the named section must be
  defined), grounding case citations against the citator too. Three carve-outs must not trip it: a
  NEGATED mention; the order's own FORWARD SELF-REFERENCE; and a defined-but-SUPERSEDED instrument.
  The hard line: "never existed" resolves to nothing and fails closed; "real but repealed" EXISTED
  and is legitimate - in-force status is advisory only, never a block. (Q4 SEVERITY) The new code
  ORDER_CITATION_UNRESOLVED is Fatal but NOT in CONSTITUTIVE_CODES, so the assent floor downgrades
  it for a resolving order. The lawpack-wide DANGLING_REFERENCE stays a Warning, its line-wrap false
  positive (the partial-id head fragment of REG-FEDERATION-COORDINATION-001 fragment) fixed by scanning PARSED scalars and matching whole
  tokens; the two share one matcher and de-duplicate. The Council records candidly that the gate
  grounds the holding but not the lossy snake_case directive tokens; the cure is an optional
  structured cites/authorities list of AuthorityId, mirroring supersedes. Nothing is routed to the
  Sovereign; the floor is untouched by design.
