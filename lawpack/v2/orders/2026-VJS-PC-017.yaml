id: "2026-VJS-PC-017"
assent_source: standing_bounded_assent
citation: "[2026] VJS-PC 17"
title: Citation-Grounding of an Order's Operative Authorities
court: privy_council
jurisdiction: vibe-justice-system
status: binding
issue: whether_the_kernel_should_deterministically_ground_the_authorities_an_order_cites_in_its_operative_parts_and_if_so_whether_an_unresolved_operative_citation_is_a_constitutive_never_softened_void_ab_initio_defect_or_a_correctable_route_for_correction_defect_at_what_scope_and_section_granularity_with_what_carve_outs_distinguishing_a_section_that_never_existed_from_a_real_section_later_superseded_and_at_what_severity_reconciled_with_the_existing_dangling_reference_check_and_its_line_wrap_partial_id_false_positive
bench:
  - Mansfield
  - Coke
  - Bracton
vote: >
  3-0 (Mansfield J., Coke J., Bracton J., unanimous on all four questions): POSITION B -
  BUILD IT, CORRECTABLE - prevails. The kernel should ground the EXISTENCE of the authorities an
  order cites in its operative parts deterministically and model-free, as machinery that gives the
  per-incuriam doctrine teeth (ACT-CONSOLIDATION-FRAMEWORK s.7), but an unresolved operative
  citation is a Fatal-but-CORRECTABLE defect, NOT a constitutive one. Position A (build it,
  constitutive, void ab initio, never softened by assent) is REJECTED on two independent grounds:
  it would have the clerk presume the per-incuriam VOIDNESS conclusion, a merits judgment reserved
  to a court on appeal (REG-KERNEL-001, clerk not court); and it would block or void a
  Sovereign-assented order for a non-record-hood content defect, narrowing the entrenched
  ACT-ASSENTED-RECORD-PROTECTION s.1 floor by machinery, ultra vires ACT-CONSOLIDATION-FRAMEWORK
  s.7 and s.25 and beyond the power of any machinery this reference may authorise. Position C (do
  not build; the existing Warning plus a duty to read carefully suffices) is REJECTED on the
  merits - that is the very regime that failed and had to be rescued by hand when [2026] VJS-PC 16
  was recorded - but its concerns about over-reach and parser edge-cases are ADOPTED as binding
  conditions, answered by the operative-only scope, the section-granular whole-token matcher, the
  three carve-outs, and the existence-fails-closed / in-force-advisory split rather than by
  declining the gate. No dissent.
case_file_digest: "sha256:14e26b93381cbb82ed6f17b64f7220b3d3fd714ad35fb9bee1575b25dd42470b"
convened_at: "2026-06-25T15:43:55.099768252+00:00"
question: >
  On the Reference re Citation-Grounding (SUBMISSION-2026-06-25-citation-grounding). The
  bench-integrity gate (crates/vjs-core/src/bench.rs::verify_bench) checks only that an order
  issued from a constituted odd bench whose every counted seat carries a present opinion; it never
  reads the law the order CITES. So an order whose holding, a directive, or a forbidden clause
  leans on an authority that resolves to no defined instrument in canon - a hallucinated "s.99", a
  mis-cited Act, a phantom "[2026] VJS-PC 99" - passes validate and enters canon, although the
  Vibe Procedure Rules hold that a ruling made in ignorance of binding law is per incuriam and
  void. The integrating writer caught exactly this by hand when recording [2026] VJS-PC 16,
  manually confirming ACT-COMPUTER-FIRST-REALM s.23 existed and said what the bench claimed. The
  existing LawpackValidator::check_referential_integrity emits only a non-blocking lawpack-wide
  DANGLING_REFERENCE Warning over raw physical lines, whose id regex both misses citation-form
  references entirely and false-positives on a YAML soft-wrapped id (the partial-id head fragment of REG-FEDERATION-COORDINATION-001
  fragment). Per question Q1-Q4: (Q1 ADOPT) should a deterministic, model-free gate require the
  authorities an order cites in its operative parts to resolve to real, defined objects in canon,
  and is that machinery or a new substantive duty; (Q2 DISPOSITION) is an unresolved operative
  citation a constitutive, never-softened, void-ab-initio defect (Position A) or a correctable,
  route-for-correction defect (Position B); (Q3 SCOPE) what fields, granularity, and carve-outs
  govern the gate, and how does it distinguish a section that never existed from a real section
  later superseded; and (Q4 SEVERITY) at what severity does the gate fire, and how is it
  reconciled with the existing DANGLING_REFERENCE check and its line-wrap false positive. The
  positions: A (build it, constitutive), B (build it, correctable), C (do not build).
holding: >
  POSITION B prevails, 3-0 (Mansfield J., Coke J., Bracton J., unanimous). Q1 (ADOPT): the kernel
  SHOULD ground the authorities an order cites in its operative parts, and doing so is MACHINERY,
  not a new substantive duty. A deterministic, model-free, network-free gate that asks of each
  authority, section, and case-citation token in an order's operative parts only the structural
  question "does this resolve to an object the digest-pinned canon actually defines" is a pure
  table lookup of the same character as the bench-size, citation-uniqueness, and assent-resolution
  lookups the kernel already performs. It gives teeth to a duty that already exists - the
  per-incuriam rule of the Vibe Procedure Rules, that a ruling made in ignorance of binding law is
  void, presumes the cited law is real - and it amends no Act, no bench, no tier, and no assent
  rule, so it is within ACT-CONSOLIDATION-FRAMEWORK s.7 (the anti-Henry-VIII machinery power), the
  same posture REG-KERNEL-001 describes for itself. The gate is cut at one joint and no further:
  per incuriam has three limbs - the cited authority must EXIST, the order must state it
  FAITHFULLY, and the mis-statement must be MATERIAL to the result - and a deterministic clerk can
  answer only the first. "Does ACT-X s.23 exist and is it defined" is a lookup; "does s.23 say what
  the bench claims" is reading; "would the error have changed the holding" is judging the
  reasoning. The last two are the per-incuriam MERITS, reserved to the bench's duty of care and to
  a court on appeal, and forbidden to the clerk by REG-KERNEL-001. The gate reaches the EXISTENCE
  limb only. Within Q1 the Council sharpens a distinction the submission's "real, defined,
  in-force" framing blurs: EXISTENCE is structural and clerk-safe; IN-FORCE status is not the hard
  test, because an order legitimately cites a superseded enactment to overrule, distinguish, or
  narrate it, and policing whether reliance on historical law is apt is merits. Existence fails
  closed; in-force status drives, at most, a non-blocking advisory. Q2 (DISPOSITION): an unresolved
  operative citation is a Fatal but CORRECTABLE defect, NOT a constitutive one - Position B, by
  name; Position A is REJECTED on two independent grounds. First, the clerk limit: detecting that a
  cited id does not resolve is structural, but concluding that the order is therefore per incuriam
  and VOID is a conclusion of law that depends on whether the holding DEPENDS on the bad citation.
  A bench may cite five authorities, four sound and one mistyped, the ratio standing on the four;
  the phantom may sit in surplusage; "s.99" may be a slip for "s.9" (ACT-002 s.9 calls clerical
  citation errors expressly correctable). The clerk cannot tell load-bearing from surplusage
  without weighing the reasoning, which is the merits judgment REG-KERNEL-001 reserves to the bench
  and a court on appeal. To presume voidness from the bare structural signal is to have the clerk
  decide the very question - did the error infect the result - that defines an appellate function.
  Second, and decisively, the entrenched floor: every member of CONSTITUTIVE_CODES (BENCH_REQUIRED,
  TIER_NOT_CONSTITUTED, BENCH_SIZE_MISMATCH, BENCH_SILENT_SEAT, BENCH_OPINION_MISSING,
  CITATION_COLLISION, APEX_RECORD_IN_SUBSCRIBING_JURISDICTION) goes to whether the thing IS an
  order at all - its bench, its tier, its apex-singleness, its unique citation NAME in the
  register - a defect in the record's own IDENTITY, automatic and merits-free. A hallucinated
  citation INSIDE the holding is a defect in the CONTENT of what the order points at; the order
  issued from a real bench, carries a real opinion, bears every required field. Identity is
  constitutive; reliance is merits. The instructive contrast is CITATION_COLLISION, which IS
  constitutive because two records claiming one citation is incoherent independent of any
  reasoning - a defect in the order's NAME, not in what it names. The assent floor confirms it: the
  constitutive family is the only class that overrides Sovereign assent, because assent to a
  non-thing is incoherent ("a false signature is no signature", [2026] VJS-PC 16). The membership
  test is whether the Sovereign could coherently have assented to THIS as an order of its kind; for
  a real, convened, odd bench that issued a real opinion and cited a hallucinated section in a
  directive, the answer is yes - the Sovereign can assent to a genuine court's genuine order that
  contains a citation error, and the error is then corrected. The defect lives in the order's
  content, exactly the domain ACT-ASSENTED-RECORD-PROTECTION s.1 was entrenched to protect by
  routing for correction and never voiding. To fold citation-grounding into the constitutive family
  would let the machine block an assented order over a content defect - the machine enlarging its
  own override power beyond identity defects, ultra vires the ACT-CONSOLIDATION-FRAMEWORK s.7 / s.25
  anti-Henry-VIII limit and a breach of the entrenched floor, beyond the power of any machinery this
  reference may authorise. If the Realm ever wishes to make a phantom citation a record-killing,
  assent-proof defect, that is reserved to a Sovereign-assented Act citing VJS-ACT 10 by number,
  which this judgment neither makes nor pre-empts. The disposition therefore bifurcates exactly as
  the ordinary downgradeable Fatals do: a non-assented order, or one whose declared assent does not
  resolve under [2026] VJS-PC 16, fails CLOSED - the write-gate declines to FILE a record citing an
  authority the canon does not contain (ordinary gatekeeping, not a pronouncement of voidness); an
  order whose assent resolves (the ordinary binding order carries standing_bounded_assent) has the
  finding SURFACED and is ROUTED FOR CORRECTION, never voided or blocked
  (ACT-ASSENTED-RECORD-PROTECTION s.1). The clerk's verdict reads "this operative part cites X,
  which resolves to no defined instrument in canon; correct the citation and re-record", never
  "this order is void." That branding is for a court on appeal (ACT-002 s.9). Q3 (SCOPE): the gate
  runs on the OPERATIVE parts only - the holding, each directive's must text, and forbidden, all of
  which bind under ACT-002 s.7 - and NOT on the issue, vote, runtime_summary, question,
  source_opinion, or case_file_digest, which are recital or explanation where a stray or historical
  reference is not load-bearing. Granularity is the SECTION: normalize ":sN", " s.N", and " s N" to
  one canonical key and require BOTH the instrument AND the named section to be defined, so a real
  Act cited at a section it does not contain is unresolved - defined_ids already carries both
  statute and section ids. The gate grounds case-citation tokens ("[YYYY] VJS-SERIES N" and the
  subscriber form) against the live citator register as well as instrument ids, because the
  phantom-precedent risk is as real as the phantom-section risk. Three carve-outs must NOT trip the
  gate: (a) a NEGATED mention ("no", "not", "never", "without", "absent", "no such" governing the
  token) is a statement about absence, not reliance - generalised from the existing ends_with("no")
  heuristic and detected robustly on the token boundary, resolving ambiguity toward the carve-out
  because the dangerous error is a false positive that blocks a valid order; (b) the order's own
  FORWARD SELF-REFERENCE - at write time the staged order is not yet in committed canon, so its own
  id and own allocated citation are seeded into the resolved set and always resolve; (c) a
  defined-but-SUPERSEDED-historical instrument. On (c) the hard distinction the reference asks for:
  "cites a section that NEVER EXISTED" resolves to nothing and fails closed (non-assented) or routes
  for correction (assented) - it is the hallucination the gate exists to stop; "cites a REAL
  section later repealed or superseded" resolves to a defined object whose status is Superseded,
  Overruled, Revoked, or Spent - it EXISTED, and citing the authority that governed at the material
  time or that the order distinguishes is ordinary legal work and must NOT fail closed. The
  fail-close trigger is "resolves to nothing", never "resolves to something no longer in force"; the
  latter earns at most a non-blocking advisory, because deciding it was relied on as live authority
  is a merits read out of the clerk's reach. This is how Q1's "in-force" requirement is honoured:
  existence is hard, in-force is advisory. Q4 (SEVERITY): the new gate and the existing Warning
  coexist by scope, severity, and de-duplication. The lawpack-wide DANGLING_REFERENCE stays a
  non-blocking corpus-drift Warning whose remedy is lawmaking, hardened at the root against its
  line-wrap false positive by scanning PARSED scalar values (folded scalars reassembled), not raw
  content.lines(), and matching ids on whole, maximal token boundaries (the names_token discipline
  of assent.rs, where '-' is an id character) so a soft-wrapped id can never present a head fragment
  as a phantom. The new order gate emits a DISTINCT code, ORDER_CITATION_UNRESOLVED, at Fatal
  severity, scoped to a staged order's operative parts, registered NOT in CONSTITUTIVE_CODES so the
  assent floor downgrades it for a resolving order. The two checks share ONE id-extraction and
  whole-token matcher (single source of truth); the order gate OWNS the operative region of order
  files and de-duplicates: a DANGLING_REFERENCE for an (order-file, id) pair already adjudicated by
  the order gate is suppressed, so each defect is reported exactly once at its correct severity. The
  Council records candidly the gate's bounded reach, as [2026] VJS-PC 16 recorded its remainder: it
  enforces only the EXISTENCE limb, never the FIDELITY or MATERIALITY limbs, which are merits. And
  it records the authoring-convention gap - directive citations are presently lossy snake_case
  tokens ("act_010_s2" does not mechanically resolve to ACT-ASSENTED-RECORD-PROTECTION s.2) that no
  deterministic clerk can ground - so the gate reliably grounds the holding and any
  canonically-cited operative text but not the snake_case directive bodies, a known recorded gap,
  not a silent one. The cure is to move operative citations to a machine-resolvable form; the
  preferred mechanism, directed because it is additive, reversible, and already proven, is an
  optional structured cites/authorities list of AuthorityId on the order, mirroring supersedes and
  its ORPHAN_SUPERSESSION check, with prose kept for humans, so the teeth extend to directives. The
  cure must not be represented as more than it is. Position A is REJECTED on the merits and as
  beyond the power of machinery; Position C is REJECTED on the merits but its concerns are adopted
  as binding conditions; Position B is ADOPTED as named.
