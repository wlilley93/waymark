runtime_summary: >
  Apex ratification (5-0), re-homed to canon from a mis-filed repo-level record. ACT-003 s10/s11 - a repeatedly-
  or conduct-unsatisfiable enforcement gate is auto-justiciable: route to court on the agent's own motion, pause
  re-firing (the guarded action stays blocked), never loop, never fabricate a pass, never self-authorise a
  reserved act; before re-firing consult the recorded dispositions, which shelter a gate only when verifiable
  assent-grade + dated + scoped-to-matter-and-state + not-stale + court-found, and NEVER on a printed-RESULT
  contradiction. The Supreme Court is singular and canonical; subscribing jurisdictions refer up. Statute
  codification awaits Sovereign Assent. Binding apex caselaw now.
