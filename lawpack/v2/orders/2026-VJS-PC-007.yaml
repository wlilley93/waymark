status: binding
issue: assent_construction
question: >
  Whether the Sovereign's immediate reply "go" to the digest-pinned presentment constitutes
  express assent to the Realm Invariants and Machinery Instrument 2026?
holding: >
  Assent found, 2-1. The Sovereign's entire and immediate reply "go", given in
  answer to a digest-pinned presentment stating that the draft alone remained
  and that the Sovereign's word against the digest commences it, is express,
  antecedent, external assent within the assent floor (ACT-COMPUTER-FIRST-REALM s.23) to the Realm Invariants and
  Machinery Instrument 2026 at digest
  sha256:1be7181cbb3215fe3e1b540bb19915ab4ccd85d2e4eed146e8207d8e07ec1e7f.
  The omnibus precedent governs: minimal sovereign words suffice where the
  presentment fixes the referent; the assent rule binds the delegate, never
  the Sovereign (s.23(4)). Force flows from the Sovereign's utterance; the
  court construes, it does not promulgate. The holding is confined to this
  posture: sole pending act, direct digest-pinned presentment, immediate
  unqualified affirmative. Generic directives remain never assent; declining
  "proceed all" was correct.
