runtime_summary: >
  On appeal from [2026] VJS-CC 15, 3-0: the s.5(a) kernel-effect gate is
  concordance-machinery because its test is structural (the KernelEffect operation
  schema), not the 37 PredicateExpr arms; affirmance is fact-bound and does not
  license a semantic/predicate-selection enrichment. The assent floor is protected
  not by the gate's present politeness but by ENTRENCHMENT: the gate may never void
  or block an assented record, amendable only by Sovereign-assented primary law
  expressly citing s.5. The operation schema, tests, and Warning wording remain
  ordinary engineering; only the never-void/never-block-assented invariant is
  entrenched; limb (b) stays at the agent rung.
