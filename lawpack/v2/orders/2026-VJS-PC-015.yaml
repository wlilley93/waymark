id: "2026-VJS-PC-015"
assent_source: standing_bounded_assent
citation: "[2026] VJS-PC 15"
title: The Runtime-Overlay Keystone
court: privy_council
jurisdiction: vibe-justice-system
status: binding
issue: two_tier_runtime_overlay_loader_generic_entity_scope_and_deterministic_submit_decision_permit_as_substrate_machinery
bench:
  - Tindale
  - Rowanne
  - Marchmont
vote: >
  3-0 (Tindale J., Rowanne J., Marchmont J., unanimous on all six questions): POSITION
  A - ADOPT AS SUBSTRATE, GENERICISE THE VOCABULARY, BUILD NOW - prevails on its
  substance, under ACT-CONSOLIDATION-FRAMEWORK:s7 as subordinate machinery amending no
  statute, bench, tier, jurisdiction, or assent rule, on the genericisation conditions
  held as ABSOLUTES. Position B (reject canon-side; code-governance owns canon) and
  Position C (reserve the runtime pieces until more than one subscriber) both REJECTED.
  No dissent. Marchmont J. records on the face of the record that the kernel already
  carries the GovernedLoadBearingAct ActionKind variant and a generic named-dimension
  Scope, narrowing Q4 to finishing the route-classifier wiring and Q2 to holding canon
  to its existing vocabulary-free form; the other justices concur in result.
case_file_digest: "sha256:27f40708426d207a73818a6bc5bad1d0f49e2f44f726a9aaa5cdb0e632057e51"
convened_at: "2026-06-25T13:55:58.921353243+00:00"
question: >
  The subscriber's runtime-overlay keystone request (SUBMISSION-2026-06-25-runtime-
  overlay-keystone), a runtime sibling of PC-14, on the inclusion-eligibility of an
  overlay lawpack loader and its parts. Per question Q1-Q6: (Q1) is the runtime-
  operations overlay a canon substrate primitive or subscriber-specific; (Q2) is the entity-
  scope a generic primitive or is "org/ws/matter/flow/step" the subscriber vocabulary canon must
  never hard-code; (Q3) is the two-tier canon-precedence overlay with anti-relaxation-
  at-load faithful machinery for REG-FEDERATION-COORDINATION-001 + ACT-007:s3/s4, or
  does it amend anything; (Q4) is a runtime GovernedLoadBearingAct ActionKind plus a
  runtime/operations law domain additive machinery or a constitutive change beyond s7;
  (Q5) is the deterministic submit-decision permit API simply REG-KERNEL-001's clerk
  applied to runtime acts, disposed GRANT / ROUTE-FOR-CORRECTION never hard-DENY per
  VJS-ACT 10; and (Q6) build the generic primitive now or reserve the ActionKind,
  domain, and API to more-than-one-subscriber grounding (Position C)?
holding: >
  POSITION A's substance prevails, 3-0, on the genericisation conditions held as
  absolutes. Q1 (NATURE): SUBSTRATE PRIMITIVE, in its generic form only. The principle
  the overlay mechanises is already canon and already general - a subscriber holds
  local law that ADDS restriction and never overrides the canon floors (ACT-007:s2/s3/
  s4; REG-FEDERATION-COORDINATION-001) - and nothing in it is confined to code commits.
  Loading canon-plus-local together and enforcing canon-precedence at load is federation
  machinery, indifferent to whether the governed acts are matter-advances, charges, or
  gate-approvals; every runtime-governing subscriber benefits identically. Eligible as a
  substrate primitive, conditioned absolutely on Q2 genericisation. Position B REJECTED:
  canon governs governed acts and inter-jurisdiction coordination, not code; a primitive
  that worked only for commits would arbitrarily narrow REG-FEDERATION-COORDINATION-001,
  which is written in terms of "local law," not "local law about code." Q2 (THE SCOPE):
  the GENERIC named-dimension scope is substrate-eligible; "org/ws/matter/flow/step" is
  the subscriber VOCABULARY and is REFUSED entry into canon, absolutely. The shape - a scope is
  an ordered map of dimension to value, resolved most-specific-first - is a generic
  primitive; the contents are one subscriber's business hierarchy and are tenant-config,
  not substrate-primitive, under the inclusion gate. Hard-coding those five keys would
  import a subscriber's facts and vocabulary into the substrate that binds every
  subscriber, breaching ACT-007:s4 and the public/private boundary the protective floor
  entrenches (s21), and would REGRESS canon from a form it already has right (the
  existing Scope carries no business noun). Canon ships the empty frame and the cascade
  algebra; the subscriber supplies its own dimension names and ordering in its Tier-2.
  The the subscriber set is named in this record only to EXCLUDE it. Q3 (THE OVERLAY): FAITHFUL
  MACHINERY; it amends nothing. Canon-precedence is ACT-007:s3 in terms; the void-at-
  load of a relaxing local rule is the mechanical face of the same words - a local rule
  relaxing a canon floor WOULD be a local override s3 already forbids and
  REG-FEDERATION-COORDINATION-001 already lists. The loader does not enact "local may only add
  restriction"; it reads that existing consequence off the loaded instruments at the one
  place the floors are visible (load), the deterministic clerk REG-KERNEL-001
  contemplates. It amends no statute, bench, tier, jurisdiction, or assent rule and is
  intra vires s7; tested from the other direction, voiding a local relaxation touches no
  primary Act and, the relaxation carrying no Sovereign assent, does not reach the
  VJS-ACT 10 floor. Three conditions, refused without them: (i) the void operates ONLY on
  the offending Tier-2 rule (the relaxation yields to the floor; the floor stands), never
  on canon and never erasing an assented record - it must name the canon floor it
  offended (REG-KERNEL-001) and never silently drop law; (ii) it enforces precedence
  over the floors canon actually enacted, never inventing a floor; (iii) it respects the
  ACT-007:s3 authority exception - a Tier-2 divergence declaring a Privy order or valid
  assent_source is an authorised override, not a relaxation to void, and the loader keys
  on the presence of that authority and never re-adjudicates it. By construction it
  resolves only toward the floor, so it cannot weaken an entrenched guarantee (s25). Q4
  (THE KIND): ADDITIVE machinery. The GovernedLoadBearingAct ActionKind variant is
  already declared in the kernel; wiring it into the route classifier and naming a
  generic runtime/operations law domain partitions SUBJECT MATTER, not constitutional
  authority. It creates no court, no apex, no assent path; apex-singleness is untouched
  and runtime constitutional questions route up as VJS-SC 4 holds for all. The same
  additive move REG-KERNEL-001 recites for itself ("amends no statute, no bench, no
  tier, no assent rule"). Conditions: canon ships the CATEGORY and the domain FRAME only,
  EMPTY; the concrete runtime acts (matter.advance, charge, gate-approval) are
  subscriber-supplied in Tier-2, never canon-enumerated; and the domain may not become a
  backdoor by which runtime acts escape the court triggers (ACT-002:s6) or the assent
  floor (VJS-ACT 10). Q5 (THE CLERK): ADOPTED as REG-KERNEL-001's deterministic clerk
  applied to runtime acts. A submit-decision API returning in <100ms, no LLM, no network,
  whose GRANT carries law_source[] (the affirmative twin of "every denial names its
  instrument"), is that clerk pointed at a runtime act. Terminal dispositions are GRANT
  or ROUTE_FOR_CORRECTION, bound to the assent bifurcation PC-14 D3 settled: a runtime act
  carrying a valid assent_source (sovereign_assent or standing_bounded_assent, per the
  INV-ASSENT-SOURCE-001 fail-closed allow-list) may NEVER be hard-DENIED, voided, or
  blocked - its sole disposition is ROUTE_FOR_CORRECTION, the defect code registered in
  the kernel ROUTE_FOR_CORRECTION set, never Error/Fatal/Block, following the entrenched
  Warning-not-Fatal pattern already used for S5_INERT_KERNEL_EFFECT. An un-assented act
  that breaches a floor or a Tier-2 addition may still be DENIED a permit with a named
  instrument - that is the ordinary gate doing its work, not voiding an assented record
  (ACT-ASSENTED-RECORD-PROTECTION s1; s2 enlarges no record's force). Q6 (THE TIMING):
  BUILD NOW the generic primitives; Position C REJECTED. C's instinct - do not bake one
  tenant's shape into the substrate - is the correct instinct and is the very instinct
  this order enforces, but it mislocates the danger: the thing that would bake a tenant
  in is the VOCABULARY, already refused at Q2. Once the dimensions, the act catalogue,
  and the business rules all live in Tier-2 and canon holds only the empty generic
  shapes, there is no tenant shape left to bake. Reserving generic machinery for want of
  a second subscriber is no principled test; the "more than one subscriber" test earns
  its keep against a SPECIFIC vocabulary-bearing design, and does no work against a
  genericised primitive, substrate-eligible on its generality alone. Reservation would
  also strand the keystone and, worse, intensify the same-author hazard by inviting the
  one live subscriber to press the missing half around its own need; and it would leave a
  live floor-relaxation gap (today a local rule relaxing a canon floor simply loads)
  open. Following PC-14's Q6 logic, genericisation NOW, not deferral, is the discipline.
  Position A adopted as named, on the genericisation conditions as absolutes.
