runtime_summary: >
  A subscriber asked canon to build a keystone: an overlay lawpack loader that
  lets its own local law (Tier-2) extend the canon floors (Tier-1) over runtime business
  decisions - advancing a matter, charging an invoice, approving a gate - not just code
  commits. The Council, 3-0, ADOPTS it as substrate machinery and BUILDS NOW, on one
  hard condition: genericise the vocabulary. (Q1) The thing being built is federation
  plumbing the law already requires - local law adds restriction and never overrides the
  canon floors - and that is general, not the subscriber's; it is a substrate primitive. (Q2) The
  SHAPE of a scope (a map of named dimensions, resolved most-specific-first) is generic
  and allowed; the CONTENTS "org/ws/matter/flow/step" are the subscriber's business hierarchy and
  are REFUSED into canon - that vocabulary lives only in the subscriber's own tree, and is named
  here only to exclude it. (Q3) The two-tier loader that loads canon plus local together,
  lets canon always win, and VOIDS-at-load any local rule that tries to relax a canon
  floor amends nothing - it just gives teeth at load to a rule (ACT-007:s3) that already
  exists; it voids only the offending local rule, names the floor it broke, and respects
  the existing exception where a Privy order or assent authorises a divergence. (Q4) A
  runtime act-kind (already half-present in the kernel) plus a generic runtime/operations
  domain are additive - they sort subject matter, create no new court, apex, or assent
  path; canon ships the empty category, the subscriber fills in its concrete acts. (Q5)
  The submit-decision permit is the kernel's deterministic clerk pointed at runtime acts
  - under 100ms, no model, the GRANT naming the law that permitted it - and it can only
  GRANT or ROUTE-FOR-CORRECTION: an act carrying a valid Sovereign or standing-bounded
  assent may never be blocked or voided (only routed for correction), while an
  un-assented act that breaks a floor can still be refused a permit. (Q6) Build now;
  reserving generic machinery for a second customer is the wrong test, because once the
  vocabulary is gone there is no tenant shape left to bake in, and waiting would leave a
  real gap (today a local rule relaxing a floor simply loads) open. Position B (canon is
  only for code) and Position C (wait) are both rejected. The whole keystone lands as
  subordinate machinery under s7 and amends no statute, court, tier, jurisdiction, or the
  assent rule.
