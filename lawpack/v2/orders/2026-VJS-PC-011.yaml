runtime_summary: >
  Don't merge it all into one repo. Keep the law (the canon) its own public repo -
  it's shared and others pin it. The private product side can have a "house", but
  the real fix is a single lockfile that lists every piece and its hash so the
  whole thing rebuilds from one file. Keep kern and vjs-core separate. Any actual
  repo move comes back to court with the live subscriber in the room.
  Rests on ACT-007, [2026] VJS-PC 10 and [2026] VJS-PC 8; the no-live-egress
  floor is carried as a V2 directive, the V1 archive persuasive only.
