  - co_mingling_agpl_canon_source_with_mit_product_source_in_one_published_repo
  - force_merging_kern_and_vjs_core_under_cover_of_a_restructure
  - forcing_a_subscriber_to_vendor_a_giant_tree_to_obtain_one_pinned_piece
  - introducing_a_live_egress_dependency_on_the_canon_for_any_subscriber
