runtime_summary: >
  Apex order (7-2 build; 9-0 on the constitutional crux), settling the three-way Privy fracture in
  [2026] VJS-PC 18 de novo. The kernel resolves a regulation's standing_bounded_assent on a bare `founded`
  existence-check (true whenever any Sovereign foundation exists anywhere), an under-implementation of the
  entrenched 'tracing' verb of the family PC-16 condemned for the sister clause. The Council unanimously holds
  (Q2) that resolving it instead by a ROUTE-CLASS TRACE, the record's own declared route followed to its class's
  specific, recorded, digest-pinned terminal Sovereign assent (for the s.7 class, the Framework Act assent at
  COMMENCEMENT-V2-0002), with the established-canon carve-out and route-for-correction, is faithful
  interpretation and non-narrowing; and that a PER-INSTRUMENT FORCE-GATE (force conditioned on a regulation's own
  separately-recorded provenance note, its absence stripping the floor) narrows ACT-ASSENTED-RECORD-PROTECTION
  s.1 for a genuine regulation made under ACT-CONSOLIDATION-FRAMEWORK s.7 and is reserved exclusively to a
  Sovereign-assented Act. By 7-2 the Council orders lexby to BUILD the route-class refinement now, as
  interpretation: a two-limb, deterministic, model-free, network-free, clock-independent resolution in assent.rs
  (limb one established-at-HEAD, short-circuiting, the complete zero-narrowing migration sheltering every
  committed regulation; limb two the record's declared parent authority resolving to its recorded terminal), with
  no per-instrument paper required of any regulation, the constitutive-codes exclusion untouched, the orders limb
  affirmed as already closed and made explicit, and an optional non-narrowing advisory permitted. Five conditions
  and the PC-16 D7 tripwire bind every future builder against narrowing the floor; the per-instrument force-gate
  is barred even on a future breach, the regulation-laundering residual being irreducible by lawful machinery and
  backstopped by the constitutive codes and the duty of care (ACT-003 s.4 to s.8). Wilberforce and Simon JJ.
  concur in the unanimous Q2 ratio but dissent on disposition, holding the build should be reserved: Wilberforce
  because, built, it would be strictly more narrowing at the new-regulation boundary while closing no residual;
  Simon because, on the terminal-asymmetry, `founded` is faithful-but-coarse, not the condemned defect, with no
  demonstrated need. They are outvoted. Nothing entrenched is amended; the floor stands at full height; nothing
  is routed to the Sovereign as a requirement. File the full bench, record in canon, allocate the citation
  through `vjs citation next`, and verify by deterministic proof. Binding apex caselaw now.