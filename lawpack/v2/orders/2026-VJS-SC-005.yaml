  Hoffmann, Steyn, Scarman, Radcliffe, Devlin JJ.); Wilberforce and Simon JJ. dissent on disposition, holding the
  build should be RESERVED and the permissive `founded` check retained. UNANIMOUS 9-0 on Q2: a route-class trace
  check, with the established-canon carve-out and route-for-correction, is faithful interpretation of s.23 within
