question: >
  On the Principal's leapfrog certificate from the fractured Privy Council ([2026] VJS-PC 18): (Q1, ADOPT or
  TIGHTEN) should the kernel keep resolving a regulation's standing_bounded_assent on the bare `founded`
  existence-check, or tighten it to a recorded-route resolution? (Q2, the constitutional crux) is such a
  tightening faithful INTERPRETATION of ACT-COMPUTER-FIRST-REALM s.23, or does it NARROW the entrenched
  ACT-ASSENTED-RECORD-PROTECTION s.1 floor and so belong to the Sovereign? (Q3, MECHANISM and MIGRATION) if a
  tightening is available, by what deterministic mechanism, on what migration, and under what conditions, so that
  no genuine regulation loses its floor?
holding: >
  BUILD THE ROUTE-CLASS REFINEMENT NOW, 7-2 on disposition, UNANIMOUS 9-0 on the constitutional crux. A full
  constitutional bench of nine sat (s.22(2)) and judgment is delivered IN FULL, every justice's opinion filed
  verbatim as the source_opinion of record (s.18). This order settles the three-way Privy fracture in
  [2026] VJS-PC 18 de novo and binds canon as the apex ratio.
  Q2 (INTERPRETATION vs NARROWING), UNANIMOUS 9-0: resolving a regulation's standing_bounded_assent by a
  ROUTE-CLASS TRACE, the record's own declared route followed to its class's specific, recorded, digest-pinned
  terminal Sovereign assent (for the ACT-CONSOLIDATION-FRAMEWORK s.7 class, the Framework Act assent at
  COMMENCEMENT-V2-0002, framework_act_text_digest sha256:90e843c1...), paired with the established-canon
  carve-out and route-for-correction, is FAITHFUL INTERPRETATION of ACT-COMPUTER-FIRST-REALM s.23, within this
  Council's interpretive power, and NON-NARROWING. A PER-INSTRUMENT FORCE-GATE, conditioning a regulation's force
  on its own separately-recorded enactment-provenance note so the note's absence strips the floor or holds a
  non-constitutive Fatal at Fatal for a regulation validly made under s.7, invents a gating fact s.7 does not
  impose and NARROWS ACT-ASSENTED-RECORD-PROTECTION s.1 for a genuine record; it is RESERVED EXCLUSIVELY to a
  Sovereign-assented constitutional Act. The two machines were fused below; separated, the route-class limb is
  interpretation and the force-gate limb is narrowing, and the apparent Privy contradiction dissolves.
  Q1 (ADOPT/TIGHTEN): for ORDERS, AFFIRM (unanimous), the bench-less or never-convened-order vector is already
  closed at the constitutive rung by the constitutive-validity codes (BENCH_REQUIRED, TIER_NOT_CONSTITUTED,
  BENCH_SIZE_MISMATCH, BENCH_SILENT_SEAT, BENCH_OPINION_MISSING, CITATION_COLLISION,
  APEX_RECORD_IN_SUBSCRIBING_JURISDICTION), never softened by any assent claim and proven end-to-end; make it
  explicit, add no order-specific gate. For REGULATIONS, TIGHTEN (7-2): the bare `founded` predicate is an
  under-implementation of the entrenched 'tracing' verb, of the family PC-16 condemned next door, and is replaced
  now by the route-class resolution, built as interpretation.
  Q3 (MECHANISM/MIGRATION), majority 7-2: build the two-limb, deterministic, model-free, network-free,
  clock-independent resolution now: limb one established-at-HEAD, short-circuiting, the complete zero-narrowing
  migration for the entire committed corpus (a true recorded trace to the founding commencement, not a
  grandfather clause); limb two the record's declared parent authority resolving to its recorded terminal, with
  NO per-instrument paper required of any regulation; bound by the five non-narrowing conditions and the PC-16 D7
  tripwire on every future builder.
  MAJORITY (BUILD NOW): Reid, Diplock, Hoffmann, Steyn, Scarman, Radcliffe, Devlin JJ. CONCURRENCES on emphasis:
  Diplock and Reid JJ. stress that the s.7 terminal is SHARED and recorded, so a genuine new regulation resolves
  by class-membership alone with no per-instrument paper; Reid, Hoffmann, Radcliffe and Devlin JJ. record that
  the regulation-laundering residual is IRREDUCIBLE by lawful machinery (the route-class check raises the forgery
  bar but a forger may name a real parent or point at the public Framework digest), backstopped by the
  constitutive codes and the duty of care (ACT-003 s.4 to s.8, breach self-fileable); Steyn and Scarman JJ.
  additionally hold that a non-resolving NEW regulation keeps native severity only because, by s.2, the floor
  never attached, and is routed for correction, never voided or blocked.
  DISSENT ON DISPOSITION (RESERVE), Wilberforce and Simon JJ., who CONCUR in the unanimous Q2 ratio but would
  build nothing now. Wilberforce J. holds that, built, the route-class check would be strictly MORE narrowing
  than the status quo at the new-regulation boundary (22 of 28 committed standing regulations carry no
  per-instrument note, the realm's normal practice) while closing no residual, so the floor-faithful direction of
  error is to over-shelter and retain the permissive `founded` check. Simon J. holds the `founded` predicate is
  faithful-but-coarse and NOT the defect PC-16 condemned, because for the regulation class the terminal is single
  and recorded (terminal-asymmetry), there is no demonstrated need, and floor-error-ordering favours the status
  quo; he would reserve and record the binding ratio only. Both dissenters would bind the same non-narrowing
  conditions on any future build. They are OUTVOTED on disposition; the unanimous Q2 ratio and the 7-2 build
  disposition bind canon. The entrenched floor stands at full height for every resolving record; nothing
  entrenched is amended; nothing is routed to the Sovereign as a requirement of this cure.
