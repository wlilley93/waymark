jurisdiction:
  # ACT 12 s2: exactly ONE jurisdiction, named by repository.
  jurisdiction_id: vjs
  repository: wlilley93/vibe-justice-system
  working_root: .
eligibility:
  acceded: >
    Canon is the enacting jurisdiction: ACT 12 is in force in its own lawpack on
    Sovereign Assent of 2026-08-05 (commit 5e2c80c). Nothing further is required.
commencement:
  warrant: on the Principal's signature below
  ss3_ss4_gates: >
    ACT 12 ss3-4 commence on the day the gates binding them are in force, and in
    CANON they are NOT YET: canon's kernel carries neither the conformance ratchet
    nor the s5 preserve-check runner (both exist in a subscribing jurisdiction's
    vendored kernel and stand offered upstream under the 2026-08-05 upstream-offer
    obligation, expiring 2026-08-19). The Commission under this warrant therefore
    holds its s3 audit and s4(a)/s4(f) powers IN ABEYANCE until the gates land here,
    and its FIRST work is exactly that landing (schedule below). Commencement is a
    measured fact, checked against canon's own tree, never assumed from the
    subscriber's.
expiry: "2026-11-03"  # 90 days from signature target date; s2 caps at 90.
classes_authorised: [4a, 4b, 4c, 4d, 4e, 4f, 4g]
seats:
  # Tiered per the Principal's practice direction of 2026-08-05 (filed at
  # .vjs/submissions/filed/2026-08-05-practice-direction-mechanical-certification-and-tiered-benches.md).
  - portfolio: restraint
    tier: strong
  - portfolio: codification
    tier: economical
  - portfolio: guardrail
    tier: strong
  - portfolio: operability
    tier: economical
concurrency:
  register: lawpack/v2/provenance/warrants/
certified_rectification_schedule:
  # The initial worklist; the first three items are the commencement preconditions.
  - class: 4e_binding
    item: >
      Land the offered kernel gates upstream in canon: the shared door and its O5
      unreadable-orders refusal at every entry point, the argv fail-closed process
      boundary, the publication-denylist limbs, the conformance ratchet, the
      s5 preserve-check runner, and the Clerk Gate (draft check / certify). This
      discharges the 2026-08-05 upstream-offer obligation before its 2026-08-19
      expiry and is the precondition for this warrant's own ss3-4 commencement.
  - class: 4e_binding
    item: >
      Arm canon's conformance ratchet at its measured number in the same commit the
      audit machinery lands (the banking rule).
  - class: 4e_binding
    item: >
      The route self-permit defect from the 2026-08-05 sweep: canon's route allows
      an irreversible act to mint its own permit. The cure is a gate, prepared by
      the Commission and made by the competent authority.
  - class: 4b_identity
    item: >
      Canon's citation-estate registration under ACT-PROCEEDINGS-DISCIPLINE s7 and
      Schedule 1: series, estates, render conventions, forwarding records,
      tombstones.
  - class: 4c_indexing
    item: >
      The stale file:line addresses in the enacted Acts' own texts, as found by the
      Clerk Gate once it lands here; corrections prepared by the Commission, made by
      the competent authority (s6).
  - class: 4f_subscriber_paths
    item: >
      The Gazette publication blockage, MEASURED 2026-08-05: `vjs gazette` refuses to
      publish because the enacted ACT 11/ACT 12 texts carry terms the publication
      boundary denylist will not publish (BREACH-2026-06-10 limb, fail-closed; the
      refusal deliberately does not name the term). The enacted Acts therefore stand
      in force but ungazetted, and the drift-mode gazette test stands red as the
      honest record of that state. The Commission PREPARES the s6 corrections to the
      subscriber-path recitals; the competent authority MAKES them; the Gazette then
      publishes and the test goes green by cure, never by force.
