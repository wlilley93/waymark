id: WARRANT-SUB1-002
kind: commission_warrant
status: draft
# Successor form prepared under ACT-SUBSCRIBER-PSEUDONYMITY-RESIDUE s5. It takes
# effect ONLY on the Principal's fresh signature words pinning this instrument's
# digest; until then the predecessor warrant remains in force and unedited.
supersedes: >
  WARRANT-SUB1-001, the predecessor's accessioned rendering (its native id restores
  the private stem under the s1 stem rule; resolution via the private register).
  The predecessor register record and its verbatim signature event remain fixed
  forever by the digests the signature pins; supersession operates under ACT-004:s9
  (supersession explicit; the old authority remains visible and no longer binding),
  carried by the pinned supersedes_digest below and enforced by the warrant
  register's ambiguity gate, never by editing the predecessor.
# ACT-004:s9 made computable: the sha256 the predecessor's signature pinned. The
# register's reading rule ranks records by this pin, not by prose.
supersedes_digest: "sha256:34007cdc3e5789331523761ffcfe891b688b307065a985840029242dff87096b"
statute: ACT-RECTIFICATION-COMMISSION
prepared_by: lexby (the Commission constituted under WARRANT-CANON-001)
prepared_at: "2026-08-05"
jurisdiction:
  # ACT 12 s2: exactly ONE jurisdiction, named by repository. The accessioned
  # rendering NAMES the repository: a pseudonym denotes its referent in every
  # canon text (ACT-SUBSCRIBER-PSEUDONYMITY s1); resolution is the private
  # register's affair, never this record's.
  jurisdiction_id: sub1
  # The s1 stem RENDERING of the predecessor's owner-and-repository pair: the owner
  # handle is publishable and stays; only the stem re-renders. A rendering names the
  # repository ACT 12 s2 requires; a replacement would not.
  repository: wlilley93/sub1-kernel
  working_root: ESTATE ROOT/sub1-prod/sub1-kernel
eligibility:
  # s2: no warrant issues for a jurisdiction that has not acceded by its own
  # deliberate act; eligibility is the accession and nothing else.
  acceded: >
    Acceded 2026-08-05 by its own pin bump: the subscriber's mirror commit 89137f6c
    carried ACT 11 and ACT 12 into its lawpack/v2, the lawpack lock was deliberately
    re-pinned, and the conformance ratchet fired on the arrival and was answered in
    the same commit. The accession is the subscriber's act, not canon's.
commencement:
  warrant: on the Principal's signature below
  ss3_ss4_gates: >
    Measured in the jurisdiction 2026-08-05 at the predecessor's issue: the
    conformance ratchet armed and the s5 preserve-check runner shipping, so ss3-4
    commencement there is a measured fact on signature, not an assertion. The
    measurement is the predecessor's; this re-issue changes renderings, not facts,
    and re-takes nothing.
expiry: "2026-11-03"  # the predecessor's own term; a re-issue extends nothing.
classes_authorised: [4a, 4b, 4c, 4d, 4e, 4f, 4g]
seats:
  # Tiered per the Principal's practice direction of 2026-08-05 (filed at
  # .vjs/submissions/filed/2026-08-05-practice-direction-mechanical-certification-and-tiered-benches.md):
  # verification seats on the economical model tier, judgment seats on the strong model.
  - portfolio: restraint
    tier: strong
  - portfolio: codification
    tier: economical
  - portfolio: guardrail
    tier: strong
  - portfolio: operability
    tier: economical
concurrency:
  # On signature this record REPLACES its predecessor in the count: still two of
  # the maximum three concurrent, beside the canon warrant.
  register: lawpack/v2/provenance/warrants/
certified_rectification_schedule:
  # The predecessor's worklist, carried with the two prepared corrections of
  # SELF-FILE-2026-08-05-warrant-recital-defects.md: the class label that does not
  # exist is not repeated (its item moves to the preparation annex below), and the
  # stale-address item is recharacterised (the cited line is VALID in canon and
  # stale only in the jurisdiction's diverged vendored tree).
  - class: 4a_form
    item: >
      The FORM subset of the 2026-08-05 kernel sweep findings
      (docs/2026-08-05-kernel-sweep-findings.md in the jurisdiction), each repair
      proved by `vjs preserve-check` per s5.
  - class: 4c_indexing
    item: >
      The address in the jurisdiction's enacted ACT 12 mirror citing the Order
      struct at a line its own diverged vendored tree no longer matches. The cite
      is VALID in canon (the recharacterisation the self-file records); the
      correction belongs to the jurisdiction's mirror alone. The Commission
      PREPARES the correction; the competent authority MAKES it (s5).
  - class: 4c_indexing
    item: >
      The vendored ACT-CONSOLIDATION-FRAMEWORK mirror carries a section subset
      whose s7 references s12, which the partial mirror does not carry - a
      mirror-identity defect for the s15 store-by-store measurement.
  - class: 4b_identity
    item: >
      Citation-estate registration and the structured-tuple migration under
      ACT-PROCEEDINGS-DISCIPLINE s7 and Schedule 1, including tombstones for
      condemned or ambiguous ordinals.
  - class: 4c_indexing
    item: >
      Registration of the .justice continuity store under
      ACT-PROCEEDINGS-DISCIPLINE s13, so the store register equals the governed
      record roots. ENTERED AND GATED 2026-08-05 in the jurisdiction; recorded
      here as done and kept for the record.
  - class: 4e_binding
    item: >
      s4(e) reclassification triage of the unwired-duty residue at its ratchet
      recital, in judged tranches. Reclassification occurs in the audit and the
      report, never in the instrument.
preparation_annex:
  # Expressly NOT s4 powers; prepared for the competent authority. The
  # predecessor recited this item under a class label its preparer has disowned.
  - item: >
      The subscriber-path route-for-correction warnings standing on enacted
      texts: the Commission prepares the corrections; the court or Sovereign
      makes them (s5). In canon this work is carried by the applied-text
      Acts; in the jurisdiction it continues over its own mirrors.
# This engrossed draft carries no signature block, exactly as the predecessor
# engrossments did: the digest the Principal's words pin is the sha256 of this
# whole file. The signature block is added on the REGISTERED copy at
# registration, where the digest is re-measured against this file and must
# MATCH before anything proceeds.
