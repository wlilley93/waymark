form: >
  Express assent found by the Privy Council (2-1, Justice C dissenting) in the
  Sovereign's entire and immediate reply "go" to the registrar's digest-pinned
  presentment, which stated that the draft alone remained outstanding and that
  the Sovereign's word against the digest would commence it. The holding is
  confined to that posture: a sole pending act, a direct digest-pinned
  presentment, and an immediate unqualified affirmative. Generic directives
  remain never assent; the registrar's refusal of "proceed all" was correct.
effects:
  - lodges: REG-REALM-INVARIANTS-001 (verbatim from the filed draft)
  - consolidates: the kernel machinery (invariants, obligations, rules, specs) as schedules read within the instrument
  - registers: legislation and case law only in the Gazette thereafter
  - unchanged: the kernel's loading and enforcement of every scheduled record, in force, severity, and effect
