- id: BILL-27
  title: '[2026] VJS Constitution and Machinery Act'
  kind: act
  court: ''
  estate: v1
  status: assented
  summary: Constitutional framework for VJS machinery, super-repo, County Courts, data boundaries, public/private
    separation.
  points:
  - s. 7 defines system-data-only record boundary for County Courts
  - s. 8(4) makes .gitignore presumptive evidence of private data (REALM-PC 14)
