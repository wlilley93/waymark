- id: REALM-SC-11
  title: The Server-of-Law and the Embeddable Governance Client
  citation: '[2026] REALM-SC 11'
  kind: judgment
  court: sc
  estate: v1
  status: good-law
  date: '2026-06-10'
  path: Judicature/.justice/judgments/supreme-court/2026-realm-sc-11.md
  url: https://github.com/wlilley93/agent-universe/blob/master/Judicature/.justice/judgments/supreme-court/2026-realm-sc-11.md
  summary: 'Full court (leapfrog): an embeddable, corporate-re-skinned client that renders the same canonical
    governance from a central server of law is a lawful presentation DIVISION over the one spine, not
    a forbidden parallel COURT, only on six cumulative conditions. Re-naming canonical governance is permitted;
    re-housing substantive law, citator, bench, or apex inside the product is forbidden. Public-only record:
    the confidential client matter is withheld; persuasive in V2, not binding unless incorporated.'
  points:
  - Enacts CASE-LAW s.24 (ordinary, declaratory; unanimous it is ordinary not constitutional) - persuasive
    only in V2.
  - 'Condition 1 - Unity and currency of law: applies the canonical CASE-LAW, VPR, bench and duty unaltered,
    mints no local statute, and renders the central text LIVE as the apex enacts it - never a vendored,
    pinned, or stale local copy (else it mints a subscribed local jurisdiction under s.9).'
  - 'Condition 2 - Unity of citator and apex: every binding decision resolves to the one central citation
    series and single central apex; no parallel series or local apex.'
  - 'Condition 3 - The synthesiser bar: the client constitutes no deciding bench of its own; it only displays
    rulings handed down by a properly constituted central bench.'
  - 'Condition 4 - Delivery not law-making: the client force is engineering (rendering), deriving wholly
    from the canonical organ, never from promulgation by the client (source-of-force test, REALM-SC 8).'
  - 'Condition 5 - Candour of provenance: the re-skinned nomenclature is disclosed to the user as descriptive
    presentation of canonical VJS governance, not an independent locally-sovereign body.'
  - 'Condition 6 (7:2) - External-law floor / non-impersonation: the client must not wear the appearance
    of a regulated real-world legal authority it does not hold (grounded in REALM-SC 9); a floor of substance,
    not a script of UI wording.'
  - Ownership of the renderer is not ownership of the law; the vendor controls when canonical law is displayed,
    never what it is.
  cites:
  - REALM-SC-5
  - REALM-SC-8
  - REALM-SC-9
  - REALM-PC-14
  - REALM-PC-15
  source_md: archive/text/REALM-SC-11.md
  question: Is an embeddable governance client rendering canonical law from a central server a lawful
    presentation-layer division or a forbidden parallel court?
