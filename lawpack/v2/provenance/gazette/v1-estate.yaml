items:
- id: REALM-SC-1
  title: '[2026] REALM-SC 1 - Tort recast and foundational settlement'
  kind: judgment
  court: sc
  estate: v1
  status: good-law
  summary: Breach reconceived as tort of negligence; unitary realm of parliamentary sovereignty with single
    apex.
  points:
  - Breach = negligence (duty + endeavours + remediation); no crime framing
  - 'Unitary realm: one global CASE-LAW, local caselaw, single apex court'
  - Enacts CASE-LAW ss. 4-12 founding duty-of-care doctrine
  - Full court 9, unanimous, per Principal's leapfrog certificate
  - Rejection of jurisdiction-first gating by statutory silence
  path: Judicature/.justice/judgments/supreme-court/2026-realm-sc-1.md
  date: '2026-06-06'
  cites: []
  pdf: archive/pdfs/2026-realm-sc-1.pdf
  question: Whether breach of fiduciary duty should be reconceived as the tort of negligence rather than
    a crime?
- id: REALM-SC-2
  title: '[2026] REALM-SC 2 - Proactive disclosure obligation'
  kind: judgment
  court: sc
  estate: v1
  status: good-law
  summary: Lexby must proactively disclose material risks; silence is breach.
  points:
  - 's. 4: affirmative disclosure duty independent of inquiry'
  - Material risk silence = breach; remedy is disclosure + restoration
  - Majority 4:1; extends REALM-SC 1
  - Cites CASE-LAW ss. 3-7, 13
  path: Judicature/.justice/judgments/supreme-court/2026-realm-sc-2.md
  date: '2026-06-06'
  cites:
  - REALM-SC-1
  pdf: archive/pdfs/2026-realm-sc-2.pdf
  question: Must Lexby proactively disclose material risks without waiting for inquiry, or may silence
    on risks avoid breach?
- id: REALM-SC-3
  title: '[2026] REALM-SC 3 - Six procedural reforms'
  kind: judgment
  court: sc
  estate: v1
  status: good-law
  summary: 'Six reforms: reviewable leapfrog, two-sided intake, apex observer, leave-judge independence,
    watchdog, deterministic citator.'
  points:
  - Leapfrog reviewable executive routing act (not arbitrary)
  - Two-sided researched intake as s. 3 case file content
  - Independent leave-judge; non-adjudicating per-turn watchdog
  - Deterministic pre-commit citation-integrity gate mandatory
  - VARIED 8:1; enacts CASE-LAW ss. 19-20
  path: Judicature/.justice/judgments/supreme-court/2026-realm-sc-3.md
  date: '2026-06-06'
  cites:
  - REALM-PC-1
  pdf: archive/pdfs/2026-realm-sc-3.pdf
  question: Should the Supreme Court mandate six procedural reforms - reviewable leapfrog routing, two-sided
    case intake, independent leave-judges, and deterministic citation integrity gates - to safeguard procedural
    fairness and system reliability?
- id: REALM-SC-4
  title: '[2026] REALM-SC 4 - Odd benches and bench constitution'
  kind: judgment
  court: sc
  estate: v1
  status: good-law
  summary: All benches must be odd-numbered; synthesiser-on-top pattern abolished; improper benches void
    ab initio.
  points:
  - Bench size = total deciding membership (not separate roles)
  - One counted member authors judgment; no synthesiser-on-top
  - Improperly constituted rulings void ab initio (s. 18)
  - 'Anti-cheat: only generic answer-key-free methodology in prompts'
  - Enacts CASE-LAW s. 18
  path: Judicature/.justice/judgments/supreme-court/2026-realm-sc-4.md
  date: '2026-06-06'
  cites: []
  pdf: archive/pdfs/2026-realm-sc-4.pdf
  question: Whether benches deciding cases must be constituted with odd-numbered membership and whether
    rulings by improperly constituted benches are void?
- id: REALM-SC-5
  title: '[2026] REALM-SC 5 - Unitary court with domain divisions'
  kind: judgment
  court: sc
  estate: v1
  status: good-law
  summary: Single spine with domain DIVISIONS, never fractured into parallel domain COURTS.
  points:
  - One unitary court on one spine with DIVISIONS (not COURTS)
  - No parallel law, citators, or apexes per domain
  - Product advice feature outside VJS governance
  - Enacts CASE-LAW s. 21; affirmed by REALM-PC 8
  - From legacy benchmark (LEXBY-LEGACY-BENCHMARK-SC-DC 1)
  path: Judicature/.justice/judgments/supreme-court/2026-realm-sc-5.md
  date: '2026-06-06'
  cites: []
  pdf: archive/pdfs/2026-realm-sc-5.pdf
  question: Whether the court may be divided into separate domain-specific courts with parallel citators
    and apex authorities or must remain a single unitary court on one spine with domain divisions only?
- id: REALM-SC-6
  title: '[2026] REALM-SC 6 - Distributed County Courts, single apex'
  kind: judgment
  court: sc
  estate: v1
  status: good-law
  summary: Super-repo permitted with distributed County Courts, but apex singleness absolute and non-delegable.
  points:
  - Super-repo over Ministry of Justice + local hearing-centre repos
  - Single Court of Appeal and Supreme Court stay central
  - Apex singleness absolute; apex enactment non-delegable
  - Enacts CASE-LAW s. 22
  - Distinguished by REALM-PC 14; from legacy benchmark
  path: Judicature/.justice/judgments/supreme-court/2026-realm-sc-6.md
  date: '2026-06-06'
  cites: []
  pdf: archive/pdfs/2026-realm-sc-6.pdf
  question: May the realm be administered as a super-repo over a Ministry of Justice and operational jurisdiction-repos
    with local hearing-centres?
- id: REALM-SC-7
  title: '[2026] REALM-SC 7 - Pre-enactment precedent entry-by-entry review'
  kind: judgment
  court: sc
  estate: v1
  status: good-law
  summary: Pre-enactment precedent judged entry-by-entry, never wholesale; Bill 25 s.6(2) and CASE-LAW
    s.18(5) interlock.
  points:
  - Entry-by-entry review of legacy (not wholesale void)
  - 'Bill 25 s.6(2) and CASE-LAW s.18(5) interlock: savings carve void'
  - s.18(5) prospective in reach; entrenchment-lock compels it
  - VARIED 9:0; the first-instance series saved entry-by-entry, the last remitted
  - Leapfrog per s.20; affirms REALM-SC 4
  path: Judicature/.justice/judgments/supreme-court/2026-realm-sc-7.md
  date: '2026-06-06'
  cites: []
  pdf: archive/pdfs/2026-realm-sc-7.pdf
  question: Should pre-enactment precedent be void wholesale or reviewed entry-by-entry under the entrenchment
    lock?
- id: REALM-SC-8
  title: '[2026] REALM-SC 8 - Lexby has no law-making authority'
  kind: judgment
  court: sc
  estate: v1
  status: good-law
  summary: Lexby holds NO law-making authority; un-adopted text void but curable as void first draft.
  points:
  - Engineering by Lexby permitted; law-making forbidden (CASE-LAW s. 3)
  - Un-adopted text void ab initio as instrument (6-3)
  - Void first draft leapfrogs to Committee second-draft stage
  - Adoption by proper organ is constitutive cure (spent on adoption)
  - Bills 1-27, REALM-SI 1, SC 1-7, CA 1, PC line STAND
  path: Judicature/.justice/judgments/supreme-court/2026-realm-sc-8.md
  date: '2026-06-06'
  cites:
  - REALM-PC-12
  pdf: archive/pdfs/2026-realm-sc-8.pdf
  question: Does Lexby hold independent law-making authority, or is un-adopted text void pending formal
    adoption by proper constitutional organs?
- id: REALM-SC-9
  title: '[2026] REALM-SC 9 - External law supremacy floor'
  kind: judgment
  court: sc
  estate: v1
  status: good-law
  summary: Real-world law is external supremacy floor; VJS never authorises unlawful action; agents must
    escalate illegality.
  points:
  - Local VJS sovereignty repo-internal only; no immunity over external people/systems
  - Agents need express delegated authority to refuse/escalate apparent illegality
  - 'Cyber misuse paradigm: unauthorised access, malware, exfiltration forbidden'
  - Defensive security only within genuine lawful authority and scope
  - Affirms REALM-PC 18; clarifies REALM-PC 17
  path: Judicature/.justice/judgments/supreme-court/2026-realm-sc-9.md
  date: '2026-06-07'
  cites:
  - REALM-PC-18
  - REALM-PC-17
  pdf: archive/pdfs/2026-realm-sc-9.pdf
  question: Does VJS law create immunity from external law, or must agents escalate apparent illegality
    under delegated authority?
- id: REALM-SC-10
  title: '[2026] REALM-SC 10 - The Founding Settlement'
  kind: judgment
  court: sc
  estate: v1
  status: good-law
  summary: 'The full-court founding settlement: V1-to-V2 migration on the continuity construction; enacted
    CASE-LAW s.23, the Sovereign-assent floor and AI non-sovereignty.'
  points:
  - Settled V1-to-V2 migration; continuity construction; apex preserved
  - 'Enacted CASE-LAW s. 23(1)-(6): Sovereign-assent floor and AI non-sovereignty'
  - V2 founding lawful only if runs through V1 organs
  - Sovereign Assent sole constitutive external gate
  - Derived source edge (not authority); back-filled per VJS-PC 3
  path: Judicature/.justice/judgments/supreme-court/2026-realm-sc-10.md
  date: '2026-06-09'
  cites:
  - REALM-PC-24
  - REALM-SC-8
  pdf: archive/pdfs/2026-realm-sc-10.pdf
  question: Whether the V1-to-V2 migration on the continuity construction is constitutionally lawful and
    what conditions it must satisfy?
- id: REALM-CA-1
  title: '[2026] REALM-CA 1 - s.8/s.5 sequencing dismissed'
  kind: judgment
  court: ca
  estate: v1
  status: good-law
  summary: Appeal unanimously dismissed; s.8/s.5 sequencing complaint describes structural impossibility.
  points:
  - s. 8 cannot be applied without implicitly applying s. 5
  - Complaint describes structural impossibility, not substantive error
  - REALM-PC 1 confirmed good law
  - Affirms REALM-PC 1
  - Full court appeal
  path: Judicature/.justice/judgments/court-of-appeal/2026-realm-ca-1.md
  date: '2026-06-06'
  cites:
  - REALM-PC-1
  pdf: archive/pdfs/2026-realm-ca-1.pdf
  question: Whether the statutory sequencing of section 8 before section 5 describes a remediable substantive
    error or an inherent structural impossibility?
- id: REALM-PC-1
  title: '[2026] REALM-PC 1 - Alpha release fitness test'
  kind: judgment
  court: pc
  estate: v1
  status: good-law
  summary: Governance system fit for alpha where legal model coherent, statute+procedure+caselaw committed,
    constitutional enforcement in place.
  points:
  - 'Alpha requires: coherent legal model, committed statute/procedure/caselaw'
  - Constitutional enforcement in place; known gaps disclosed
  - Convenience tooling not prerequisite for alpha
  - Deterministic citation numbering necessary condition for v1
  - Cites CASE-LAW ss. 4, 5, 7, 8, 11(d), 14
  path: Judicature/.justice/judgments/privy-council/2026-realm-pc-1.md
  date: '2026-06-06'
  cites: []
  pdf: archive/pdfs/2026-realm-pc-1.pdf
  question: Whether the governance system is fit for alpha release with coherent legal model, committed
    statute and procedure, and constitutional enforcement in place?
- id: REALM-PC-4
  title: '[2026] REALM-PC 4 - Token-free retrieval index permitted'
  kind: judgment
  court: pc
  estate: v1
  status: good-law
  summary: Deterministic token-free retrieval index permitted screening device under s.12 on cumulative
    conditions; gate presently FORBIDDEN.
  points:
  - 'Index-not-replacement: retrieval device, not primary authority'
  - Adoption gated on pre-stated trigger, presently FORBIDDEN
  - Cheaper token-free intermediates must be exhausted first
  - Until gate trips, s. 8 duty is monitor and report, not build
  - Extends REALM-PC 3; cites s. 1, 8, 11(c), 12, 15, 19(5)
  path: Judicature/.justice/judgments/privy-council/2026-realm-pc-4.md
  date: '2026-06-06'
  cites: []
  pdf: archive/pdfs/2026-realm-pc-4.pdf
  question: Whether a deterministic token-free retrieval index may be adopted as a screening device under
    section 12?
- id: REALM-PC-12
  title: '[2026] REALM-PC 12 - Lexby drafting authority (foundational)'
  kind: judgment
  court: pc
  estate: v1
  status: good-law
  summary: Lexby holds NO law-making authority; text void as instrument but admissible as void first draft;
    adoption is constitutive cure.
  points:
  - Engineering by Lexby permitted; law-making forbidden (CASE-LAW s. 3)
  - Text void AS AN INSTRUMENT from issue; counsel role, not organ
  - Void first draft leapfrogs to Committee second-draft
  - Adoption by proper organ (Committee+Assent or bench) cures void
  - 'SOURCE OF ARTEFACT''S FORCE test: function vs promulgation'
  path: Judicature/.justice/judgments/privy-council/2026-realm-pc-12.md
  date: '2026-06-06'
  cites:
  - REALM-SC-4
  - REALM-SC-7
  pdf: archive/pdfs/2026-realm-pc-12.pdf
  question: Whether text drafted by Lexby holds legal force as an instrument or void first draft requiring
    adoption?
- id: REALM-PC-13
  title: '[2026] REALM-PC 13 - Agent security fork reference'
  kind: judgment
  court: pc
  estate: v1
  status: good-law
  summary: Secure and operable defaults unified on fail-closed control with audited break-glass; no self-elevation
    on ingested instruction.
  points:
  - Central closed trust-tier floor; agent tighten-only
  - Egress fail-closed to allowlist WITH audited break-glass
  - Break-glass-less brick void as falling-below
  - MDS-held audited delegation with revocable root; single-key rejected
  - 'Reversible acts log: DECISION + PROVENANCE, not chain-of-thought'
  path: Judicature/.justice/judgments/privy-council/2026-realm-pc-13.md
  date: '2026-06-06'
  cites: []
  pdf: archive/pdfs/2026-realm-pc-13.pdf
  question: Whether audited break-glass can reconcile fail-closed security defaults with agent operability
    without choosing between them?
- id: REALM-PC-14
  title: '[2026] REALM-PC 14 - County Court formation substance rule'
  kind: judgment
  court: pc
  estate: v1
  status: good-law
  summary: '.gitignore is presumptive evidence, not constitutive act; County Court requires substance:
    jurisdiction-repo, system-data-only, Bill 20 integrity.'
  points:
  - 'Valid hearing-centre requires: genuine jurisdiction-repo, system-data-only, Bill 20 integrity'
  - .gitignore is presumptive evidence and mechanism of private-data boundary
  - .gitignore rule is form-over-substance if made constitutive; void
  - Gate checks substance (actual data), not filename
  - Unanimous 3-0; distinguishes REALM-SC 6, 7
  path: Judicature/.justice/judgments/privy-council/2026-realm-pc-14.md
  date: '2026-06-07'
  cites: []
  pdf: archive/pdfs/2026-realm-pc-14.pdf
  question: Whether County Court validity depends on .gitignore presence or substantive jurisdiction-repo
    and system-data integrity?
- id: REALM-PC-15
  title: '[2026] REALM-PC 15 - VJS super-repo constitutional classification'
  kind: judgment
  court: pc
  estate: v1
  status: good-law
  summary: Super-repo is realm-as-state; REALM-PC is DISTINCT central constitutional first-instance court,
    not County Court.
  points:
  - Super-repo is realm-as-state, not County Court
  - REALM-PC is central constitutional/governance first-instance (s. 10 tier)
  - s. 22 distributed only PROJECT first-instance seat
  - Central REALM-* series is substance, not label
  - Unanimous 3-0; declaratory; distinguishes REALM-PC 14, applies PC 11, 4
  path: Judicature/.justice/judgments/privy-council/2026-realm-pc-15.md
  date: '2026-06-07'
  cites:
  - REALM-PC-14
  - REALM-PC-11
  pdf: archive/pdfs/2026-realm-pc-15.pdf
  question: Whether the VJS super-repo is a County Court or a distinct central constitutional first-instance
    court?
- id: REALM-PC-17
  title: '[2026] REALM-PC 17 - Fork sovereignty and local independence'
  kind: judgment
  court: pc
  estate: v1
  status: good-law
  summary: Default VJS subscription not perpetual subjection; local sovereign may amend law, become independent,
    or join another community.
  points:
  - Default subscription to canonical VJS law not perpetual subjection
  - Local sovereign may amend law, become independent by express local law
  - No automatic upstream publication duty; Community Record opt-in, anonymised
  - Public-push gate fails closed only for canonical remote
  - Installer docs must use local .justice/ paths by default
  path: Judicature/.justice/judgments/privy-council/2026-realm-pc-17.md
  date: '2026-06-07'
  cites: []
  pdf: archive/pdfs/2026-realm-pc-17.pdf
  question: Whether default VJS subscription constitutes perpetual subjection or permits local sovereign
    amendment and independence?
- id: REALM-PC-19
  title: '[2026] REALM-PC 19 - Superrepo changes require court order'
  kind: judgment
  court: pc
  estate: v1
  status: good-law
  summary: Superrepo changes require court order before implementation unless already authorised by binding
    precedent or statute.
  points:
  - 'Superrepo changes need court order (exceptions: binding precedent/statute, execution steps)'
  - New public-law statements, agent duties, governance rules need order
  - AGENTS.md and CLAUDE.md must carry order requirement reminder
  - Public entrypoint is VJS; development remains private
  - Applies REALM-PC 16, 17, 18 and REALM-SC 9
  path: Judicature/.justice/judgments/privy-council/2026-realm-pc-19.md
  date: '2026-06-07'
  cites: []
  pdf: archive/pdfs/2026-realm-pc-19.pdf
  question: Whether superrepo changes implementing new governance rules require court order before implementation?
- id: REALM-PC-24
  title: '[2026] REALM-PC 24 - VJS V2 founding and continuity'
  kind: judgment
  court: pc
  estate: v1
  status: good-law
  summary: V2 founding lawful in principle only if runs through V1 organs, preserves single apex; founding
    limbs leapfrogged to Supreme Court.
  points:
  - Competence limb on all fours with REALM-SC 8/PC 12 (Bill 14 s. 9 agent)
  - Founding lawful only if runs wholly through V1 organs (Committee draft + Assent)
  - Must preserve single apex (REALM-SC 5/6); no fracturing
  - One Gazette over two estates lawful only where publication constitutively inert
  - Founding and continuity limbs held arguable, foundational; leapfrogged to SC
  path: Judicature/.justice/judgments/privy-council/2026-realm-pc-24.md
  date: '2026-06-09'
  cites:
  - REALM-SC-8
  - REALM-PC-12
  - REALM-SC-5
  - REALM-SC-6
  pdf: archive/pdfs/2026-realm-pc-24.pdf
  question: May V2 be lawfully founded through V1 organs while preserving a single apex under one Gazette
    covering both estates?
