    - 'Lawpack lock: sha256:4d2639cc; confirms digest-fidelity only, not force certification'
    - Assent-Source Invariant (INV-ASSENT-SOURCE-001) proven and binding; every record carries valid assent_source
    - Each V2 court expressly constituted (2026-VJS-COURTS-CONSTITUTION-001); V1 courts relinquish runtime
      control; constitutional relay complete
    cites:
    - ACT-COMPUTER-FIRST-REALM
  COMMENCEMENT-V2-0002:
    summary: Framework Act and six subordinate regulations lodged after Sovereign Assent (2026-06-09); assented
      digests recorded; fresh lawpack lock.
    points:
    - 'Framework Act lodged with digest: sha256:90e843c1dbdcdb2e2c7026d1064a457cf7ea1dbfe80526eff96b1f7e03850470'
    - 'Six regulations lodged: REG-MIGRATION-INCORPORATION-001, REG-FEDERATION-COORDINATION-001, REG-TRANSITION-CONTINUITY-001,
      REG-CANONICALISATION-MIGRATION-001, REG-GAZETTE-CONTINUITY-001, REG-REPOS-REGISTER-001'
    - 'Old lock pinned: sha256:4d2639cc (COMMENCEMENT-V2-0001); fresh lock: sha256:8d075f7dbefba5c500884f7f0e6f89b9442c73307bf25c08fd867220a801864f'
    - Bill-32 digest, old lock, citation series, record IDs immutable and untouched
    - vjs local-ci PASS; vjs validate --staged OK (20 invariants all pass); vjs eval all green
