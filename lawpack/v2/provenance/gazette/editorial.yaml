# Gazette editorial overlay for the V2 estate: curated summaries, main
# points, and citation edges, keyed by law-object id. Presentation only,
# never a source of force; the generator falls back to mechanical
# derivation from the law text for any id not present here.
items:
  ACT-001:
    summary: Establishes V2 constitutional foundation, sources of authority hierarchy, and kernel as runtime
      authority surface.
    points:
    - V2 is kernel-governed compact lawpack; V1 preserved as archive unless expressly incorporated
    - Principal holds sovereign and prime minister offices with authority to set objectives and assent
      legislation
    - 'Authority hierarchy: real-world law, Constitution, primary Acts, regulations, orders, local decisions,
      V1 archive'
    - Kernel loads lawpack deterministically without model calls, litigation, or self-legislation
    - Specs are first-class law objects with purpose, scope, decisions, invariants, and obligations
    cites: []
  ACT-002:
    summary: Establishes three-court structure (County, Privy Council, Supreme), order binding rules,
      and word limits.
    points:
    - 'V2 has three courts: County Court (repo-local, 500 word limits), Privy Council (jurisdiction/routing,
      1000 word limits), Supreme Court (foundational doctrine, 1500 word order limit)'
    - Court of Appeal not carried forward in V2 MVP; may be added later or appeals handled by Privy Council/Supreme
      Court
    - Orders bind at runtime; opinions explain but do not bind unless incorporated into orders
    - 'Five court triggers: no existing authority, genuine distinction, overruling needed, instruction
      conflict, breach discovered'
    - Orders must be short, operative, and contain id, court, jurisdiction, status, issue, holding, directives,
      and runtime summary
    cites: []
  ACT-003:
    summary: Defines agent duties, kernel routing for governed work, and permit-obligation-proof-log lifecycle.
    points:
    - Agents act as advocate, advisor, engineer, and officer but cannot become the court or source of
      legal force
    - Governed load-bearing work requires kernel route decision unless trivial, reversible, and expressly
      exempt
    - Kernel route creates permit and obligations; agent must act within scope and attach required proof
      before closing
    - Material decisions, public record changes, external acts require 50-150 word decision logs
    - Kernel must not contain model calls, vector search, network clients, or depend on model judgment
    cites: []
  ACT-004:
    summary: Defines typed records, invariants as deterministic checks, and citation/supersession rules.
    points:
    - 'V2 records are typed: statutes, regulations, orders, rules, specs, decisions, invariants, permits,
      proofs, logs'
    - Specs define desired state with purpose, scope, decisions, invariants, obligations, and review triggers
    - 'Invariants use fixed predicate registry: path_changed, string_contains, import_contains, dependency_added,
      decision_log_exists, etc.'
    - Decisions are short (60 word max for decision, 120 for reason); permits expire after 2 hours and
      require proof to close
    - Citations are deterministic and unique; collisions are fatal; supersession must be explicit; records
      are short (route max 300 words)
    cites: []
  ACT-005:
    summary: Enforces public/private boundary, keeps public records system-data-only, and localizes private
      operational facts.
    points:
    - 'Public records contain system data only: rules, orders, procedure, abstract issues, redacted facts,
      source pointers'
    - Private operational facts, evidence, screenshots stay in local private store (.vjs/private)
    - Redaction is agent's duty; kernel scanner flags likely leaks; agent must act on flags
    - Local evidence referenced by pointer in public records without exposing private detail
    - Gazette is deterministic pointer-only archive, not runtime source; public/private boundary enforced
      by deterministic scanner, not model judgment
    cites: []
  ACT-006:
    summary: Governs external acts, public releases, destructive operations, and requires human checkpoints
      for irreversible actions.
    points:
    - Public pushes, deployments to external services require explicit route decision and release authority
    - Public release requires release warrant or Principal authorisation with human checkpoint
    - Credentials, API keys, secrets must not enter public repositories; scanner flags them and agent
      removes before commit
    - Destructive actions (deletion, reset, rebase, force-push) require explicit human approval and permit
      with human approval
    - External services are outside kernel; kernel may advise but cannot control; agent uses explicit
      credentials and authority
    cites: []
  ACT-007:
    summary: Establishes local jurisdiction on VJS installation, default subscription to lawpack, and
      local variation rules.
    points:
    - Installing VJS creates local jurisdiction with .vjs/config.toml as fixed discovery point; all other
      paths configurable
    - Installed repos subscribe to canonical V2 lawpack by default; subscription means kernel loads canonical
      lawpack on route
    - Local Principal may vary local law; local law does not override canonical without Privy Council
      order or Principal assent
    - Local orders, decisions, conventions apply only locally; do not bind other repos unless adopted
      by those repos
    - Forks inherit lawpack lineage; must declare it in .vjs/config.toml; divergence requires Privy Council
      order or Principal assent
    cites: []
  ACT-COMPUTER-FIRST-REALM:
    summary: Founding constitutional Act declaring V2 a computer-first legal system with kernel-governed
      compact lawpack.
    points:
    - Force derives from constitutive organ acts (Sovereign assent), not self-assertion; V2 silence does
      not revive V1
    - Commencement requires Sovereign Assent (external, non-automatable, non-delegable); V2 commenced 2026-06-09
    - V2 is computer-first runtime with compact lawpack; record without kernel effect excluded from authority
      graph
    - 'Authority hierarchy: real-world law, Constitution, primary Acts, regulations, Supreme Court orders,
      Privy Council orders, County orders, logs, incorporated V1'
    - Entrenched provisions (s.14, s.15, s.21) amendable only by Sovereign-assented constitutional Act
      citing section; agent cannot amend
    cites: []
  ACT-CONSOLIDATION-FRAMEWORK:
    summary: Consolidating constitutional Act restating V1 law, establishing subordinate regulation power,
      and protecting core principles.
    points:
    - Schedule 1 V1 valid-law principles adopted as substrate; runtime force only via invariant, regulation,
      or statutory instrument, not restatement alone
    - Standing Committee may make subordinate regulations under Act; cannot amend the Act, constitution,
      primary Acts, or assent rule (anti-Henry VIII)
    - Sovereign Assent is sole constitutive gate for primary/constitutional Acts; computational legislature
      may draft only, not expand competence
    - 'Protective floor non-derogable: real-world-law floor, rights/standing/due process, public/private
      boundary, restorative remedy'
    - Assent floor, apex-singleness, protective floor entrenched; amendable only by specific Sovereign
      assent citing provision
    cites: []
  REG-001:
    summary: Defines lawpack manifest fields, versioning, digest, lockfile, and schema validation.
    points:
    - Manifest contains required fields for versioning, digest, and lockfile
    - Manifest must be validated on load; lawpack digest must be checked
    - Lawpack cannot be loaded without valid manifest
    cites:
    - ACT-001
  REG-002:
    summary: 'Defines configurable directory roles for VJS records with one fixed anchor: .vjs/config.toml.'
    points:
    - 'One fixed anchor: .vjs/config.toml; all other paths configurable by role'
    - 'Configurable roles: orders_root, logs_root, submissions_root, specs_root, decisions_root, proofs_root,
      permits_root, private_root, cache_root'
    - Records resolved by role not path; no ministry-style path requirements
    cites:
    - ACT-007
  REG-003:
    summary: 'Defines citation formats for VJS records: VJS-ACT, VJS-REG, VJS-SC, VJS-PC, VJS-CC, LOG,
      SPEC, INV, DEC, PERMIT, PROOF.'
    points:
    - Citation series defined for all record types
    - Citations generated deterministically; collisions checked and prevented
    - Duplicate citations not allowed
    cites:
    - ACT-004
  REG-004:
    summary: 'Defines lifecycle for governed work: route -> permit -> action -> proof -> log -> validate
      -> close.'
    points:
    - Governed work follows mandatory lifecycle steps
    - Permit required before governed action; proofs required before closing
    - Decision log and validation required; lifecycle steps cannot be bypassed
    cites:
    - ACT-003
  REG-005:
    summary: Defines word limits for court output and decision records to keep authority compact.
    points:
    - 'County: submission 500, order 500, opinion 2000 words'
    - 'Privy Council: submission 1000, order 1000, opinion 5000 words'
    - Supreme Court order 1500 words; decision log 150; route output 300; authority summary 120
    - Word limits enforced; overlong records rejected
    cites:
    - ACT-004
  REG-006:
    summary: Bootstraps the default deterministic invariant suite for V2 kernel evaluation.
    points:
    - '13 default invariants defined: lawpack validation, no duplicate IDs/citations, orders have directives,
      public boundary, core determinism, logs short, MCP local-first, directory role resolution, V1 not
      loaded by default'
    - Invariants are evaluated deterministically
    - Invariant evaluation cannot be bypassed
    cites:
    - ACT-004
  REG-007:
    summary: 'Defines MCP safety requirements: local-first, explicit repo root, limited write tools, audit
      log, human confirmation.'
    points:
    - MCP is local-first with explicit repo root; no arbitrary shell allowed
    - Write tools limited; audit log required; human confirmation for sensitive acts
    - No release tool or direct file write exposure; all MCP input validated
    cites:
    - ACT-003
  REG-008:
    summary: Defines V1 as Gazette and archive; V2 runtime does not load V1 by default unless incorporated.
    points:
    - V1 is Gazette/archive; not runtime by default; human-readable and deterministic pointer-only
    - V1 publication is archive, not live law unless incorporated via express mechanism
    - Archive not loaded as runtime without incorporation
    cites:
    - ACT-001
  REG-CANONICALISATION-MIGRATION-001:
    summary: Makes canonicalisation a governed, lock-preserving migration; immutable digests, citations,
      IDs; no mass edits.
    points:
    - Canon is unqualified; V1 is estate label; V1 immutable in archive
    - 'Staging is mandatory: prove each fatal invariant still binds before/after; fresh lock under commencement
      addendum with old lock pinned'
    - No unstaged mass edits; paths retained or redirected; locks immutable; citations and IDs immutable
    cites:
    - ACT-CONSOLIDATION-FRAMEWORK
  REG-FEDERATION-COORDINATION-001:
    summary: Defines coordination vs sovereignty test; default subscription lawful because revocable;
      no binding without adoption.
    points:
    - Coordinating root may federate peers under one canonical lawpack and apex but may not be sovereign
    - 'Kernel-checkable bright-line: no apex assertion, no binding without adoption, no canonical override,
      no exit foreclosure'
    - Practical subjection is court standard, not kernel gate
    - Default subscription lawful because genuinely revocable
    cites:
    - ACT-CONSOLIDATION-FRAMEWORK
  REG-GAZETTE-CONTINUITY-001:
    summary: One Gazette with two estates; publication is constitutively inert; force from lawpack and
      kernel status, not publication.
    points:
    - One Gazette on canonical line carries both V1 archive and V2 current estates
    - V1 records carry estate markers and lineage edges; V1 citations are source edges, not authority
      edges
    - Publication requires lawpack validation, boundary scan, valid statuses, unique citations, lineage
      resolution, manifest includes digest
    - Export fails closed on validation failure, boundary hit, or missing elements
    cites:
    - ACT-COMPUTER-FIRST-REALM
  REG-HOOKS-001:
    summary: Hooks are deterministic functions returning typed decisions (allow, warn, block, require_route,
      require_log, require_proof).
    points:
    - Hook is switch asking if current state is valid, not the law itself; prompt is explanatory only,
      bounded at 40 words
    - 'Hook returns decision: allow, warn, block, require_route, require_log, require_proof; events: session_start,
      pre_write, post_action, pre_commit, pre_push'
    - Function lives in kernel; prompt is thin wrapper; no adjudication, law creation, or model judgment
      in hooks
    cites:
    - ACT-CONSOLIDATION-FRAMEWORK
  REG-INVOCATION-001:
    summary: Repository becomes VJS jurisdiction by local sovereign invocation, not directory ancestry;
      binding by invocation + lock + hooks.
    points:
    - Binding by local sovereign invocation + mechanical install, not directory ancestry; parent directory
      irrelevant
    - 'Install: subscribe to named lawpack, write .vjs/lawpack.lock, install hooks, record invocation'
    - Anchor is .vjs/config.toml; paths resolved by role; creates local County Court [YEAR] VJS-CC-<repo>
      N series
    - Gazette registration opt-in; private repos stay private by default; no ministry layout required
    cites:
    - ACT-CONSOLIDATION-FRAMEWORK
  REG-LAWMAKING-001:
    summary: 'Defines legislative intake: proposal, validation, adoption, citation, lawpack entry; all
      new law starts as draft.'
    points:
    - New legislation starts as draft; only assented, adopted, cited, validated records bind
    - Draft status indicates non-binding; validation required before adoption
    - Legislative amendment is append-only; old authority remains visible
    - Proposal record, validation report, citation, decision log required as proof
    cites:
    - ACT-001
  REG-MIGRATION-INCORPORATION-001:
    summary: Operationalizes incorporation pipeline; V1 law crosses only by express incorporation record
      with validity finding.
    points:
    - 'Incorporation requires: v1_source, v2_destination, operative_rule, kernel_effect, supersession/variation,
      validity_of_original'
    - Each crossing recorded one row in migration ledger; validated by fail-closed invariant
    - General law crosses centrally; repo-specific uses continuity election
    - Protective floor breach rejects incorporation; rank-floor breach rejects
    cites:
    - ACT-CONSOLIDATION-FRAMEWORK
  REG-RELEASE-WARRANT-001:
    summary: Release warrant is deterministic pre-push gate checking remote/ref/SHA, boundary scan, and
      authorising instrument.
    points:
    - Release warrant is pre_push hook function, not Sovereign assent; royal assent for law only, not
      publication
    - 'Human element: Bill 14/18 irreversible-outward checkpoint (may be standing) plus push credentials;
      operational sign-off, not re-assent'
    - 'Warrant fails closed: remote/ref/SHA mismatch, boundary scan hit, or law-change without authorising
      instrument blocks push'
    - Privy Council post-push review follows every public push
    cites:
    - ACT-CONSOLIDATION-FRAMEWORK
  REG-REPOS-REGISTER-001:
    summary: 'Mandatory transition-subscription: repos create .vjs/config.toml, declare lineage, default-subscribe
      within 90 days.'
    points:
    - Each repo must subscribe within 90 days of commencement or such period this regulation later fixes
    - 'Register schema: repo, lawpack_lineage, trust_status, subscribed_at'
    - Register is derived, pointer-only, rebuildable projection, never source of law
    - Local sovereignty (amend, pin/decline, fork, exit) preserved; mandate is to subscribe, not surrender
    cites:
    - ACT-CONSOLIDATION-FRAMEWORK
  REG-SELF-CONVENE-001:
    summary: Agent must self-convene court for forks on symmetric case file; never route fork to Principal
      for decision.
    points:
    - 'Fork disposition: convene named court on own motion with symmetric case file (no agent preference
      access)'
    - 'Self-submission duty: agent discharges without being told; waiting for Principal is falling-below,
      remedied by convening'
    - Enforced by kernel route returning court_required with must_do convene and must_not route_to_principal
    - Principal involved only for external dependency or irreversible outward act authorisation
    cites:
    - ACT-CONSOLIDATION-FRAMEWORK
  REG-TRANSITION-CONTINUITY-001:
    summary: Privy Council is transition court classifying pending V1 matters as continued, reframed,
      or moot; V1 Court perfects only.
    points:
    - Privy Council classifies each pending V1 matter as continued at point, reframed where unworkable,
      or moot
    - 'Default: continue-at-point; reframe/moot are reasoned findings, never relitigation'
    - V1 Court acts only to perfect matter already fully heard in V1 (publication only, no new doctrine)
    - Perfected V1 orders and accrued rights preserved; nothing void by reason of transfer alone
    cites:
    - ACT-CONSOLIDATION-FRAMEWORK
  AGENT-LOOKUP-001:
    summary: Retrieve current authority from kernel before governed load-bearing work; memory is not source
      of law.
    points:
    - Agent must call kernel route and record authority basis for governed work
    - 'Exception: trivial reversible preference may bypass'
    - 'Source: Bill 31, Agent Lawfulness Hooks instruments'
    cites: []
  AGENT-LOOKUP-002:
    summary: Agent must follow full route-permit-proof-log-validate lifecycle for implementation decisions
      and public changes.
    points:
    - 'Applies to: implementation decision, public record change, external act, security-sensitive act'
    - 'Must: call kernel route, follow permit, attach proof, write decision log, run validate'
    - 'Exceptions: emergency, exempt'
    - 'Source: Bill 31, Agent Lawfulness Hooks'
    cites: []
  DATA-PRIVATE-001:
    summary: Public records must not contain private facts, secrets, tokens, or unredacted evidence.
    points:
    - Must redact private facts and run public/private scan before public record change
    - Must not publish private facts, secrets, tokens, unredacted evidence
    - 'Source: Bill 27, Data boundary sweep'
    cites: []
  KERNEL-DEPENDENCY-002:
    summary: Kernel code must stay auditable and deterministic; extra crates require explicit safety or
      correctness reason.
    points:
    - 'Applies to: crates/vjs-core/**, crates/vjs-lawpack/** dependency changes'
    - Must justify dependency and run tests
    - Must not add network or model dependencies to core
    - 'Source: Bill 31, Agent Lawfulness Hooks'
    cites: []
  INV-001:
    summary: Lawpack must validate before proceeding; validation failure is fatal.
    points:
    - Deterministic lawpack validation required
    - Fatal severity; failure blocks all operations
    - 'Basis: ACT-004:s1, REG-001, REG-006'
    cites:
    - ACT-004
  INV-002:
    summary: All record IDs must be unique; duplicates are fatal.
    points:
    - ID uniqueness enforced deterministically
    - Fatal severity; collision blocks operation
    - 'Basis: ACT-004:s8, REG-003, REG-006'
    cites:
    - ACT-004
  INV-003:
    summary: All citations must be unique; duplicates are fatal.
    points:
    - Citation uniqueness enforced deterministically
    - Fatal severity; collision blocks operation
    - 'Basis: ACT-004:s8, REG-003, REG-006'
    cites:
    - ACT-004
  INV-004:
    summary: Every order must have directives and runtime summary; absence is fatal.
    points:
    - Orders must contain directives and runtime_summary fields
    - Fatal severity; order without directives rejected
    - 'Basis: ACT-002:s10, REG-006'
    cites:
    - ACT-002
  INV-005:
    summary: Public records must not contain private facts, secrets, or unredacted evidence.
    points:
    - 'Scope: lawpack/v2/**, public/**, .vjs/**'
    - Fatal severity; private facts in public record rejected
    - 'Basis: ACT-005:s1, ACT-005:s7, REG-006'
    cites:
    - ACT-005
  INV-006:
    summary: Core kernel code must not contain model calls, LLM interactions, or semantic search.
    points:
    - 'Scope: crates/vjs-core/**, crates/vjs-lawpack/**, crates/vjs-store/**'
    - Fatal severity; model call in core rejected
    - 'Basis: ACT-003:s8, DEC-004, REG-006, REG-007'
    cites:
    - ACT-003
    - DEC-004
  INV-007:
    summary: Core kernel code must not contain network clients or direct network calls.
    points:
    - 'Scope: crates/vjs-core/**, crates/vjs-lawpack/**, crates/vjs-store/**'
    - Fatal severity; network code in core rejected
    - 'Basis: ACT-003:s9, DEC-004, REG-006, REG-007'
    cites:
    - ACT-003
    - DEC-004
  INV-008:
    summary: Governed writes must have matching valid permit; absence is error severity.
    points:
    - Kernel route must be called before governed write
    - Error severity; governed write without permit blocked
    - 'Basis: ACT-003:s2, REG-004, REG-006'
    cites:
    - ACT-003
  INV-009:
    summary: Permits cannot close without required proofs; absence is error severity.
    points:
    - Proofs must be attached to close permit
    - Error severity; permit closure without proof blocked
    - 'Basis: ACT-003:s3, REG-004, REG-006'
    cites:
    - ACT-003
  INV-010:
    summary: Decision logs must be 50-150 words; overlong or too-short logs are error severity.
    points:
    - 'Log word count checked: min 50, max 150'
    - Error severity; out-of-range logs rejected
    - 'Basis: ACT-003:s4, ACT-004:s10, REG-005, REG-006'
    cites:
    - ACT-003
    - ACT-004
  INV-011:
    summary: MCP server must bind to local interface only; network exposure is error severity.
    points:
    - MCP local binding required
    - Error severity; exposed MCP rejected
    - 'Basis: ACT-003:s8, REG-007, REG-006'
    cites:
    - ACT-003
  INV-012:
    summary: Configured directory paths must resolve within the repo; escapes are error severity.
    points:
    - Configured paths checked to resolve inside repo
    - Error severity; paths outside repo rejected
    - 'Basis: ACT-007:s1, REG-002, REG-006'
    cites:
    - ACT-007
  INV-013:
    summary: V1 archive must not be loaded as runtime authority by default; default loading is error severity.
    points:
    - V1 archive not loaded unless expressly incorporated
    - Error severity; default loading rejected
    - 'Basis: ACT-001:s4, DEC-001, REG-008, REG-006'
    cites:
    - ACT-001
    - DEC-001
  INV-AGENT-EVALS-001:
    summary: Agent harness, hook, or prompt changes trigger requirement for evaluation fixture coverage.
    points:
    - 'If: crates/vjs-mcp/**, .vjs/hooks/**, AGENTS.md, VJS.md changed'
    - 'Then: crates/vjs-testkit/** must have eval coverage'
    - Warning severity; untracked changes signal regression risk
    - 'Basis: ACT-004:s1, DEC-AGENT-HARNESS-001'
    cites:
    - ACT-004
    - DEC-AGENT-HARNESS-001
  INV-ASSENT-SOURCE-001:
    summary: Every record claiming binding force must declare valid assent_source (sovereign or standing_bounded);
      fail-closed allow-list.
    points:
    - Fatal severity; missing or invalid assent_source rejects record
    - 'Allowed: sovereign_assent, standing_bounded_assent; deny-list form void as fail-open'
    - Kernel evaluator in crates/vjs-core/src/spec.rs; tests in crates/vjs-testkit/tests/assent_source_invariant.rs
    - 'Basis: ACT-COMPUTER-FIRST-REALM:s23, [2026] REALM-SC 10'
    cites:
    - ACT-COMPUTER-FIRST-REALM
  INV-HOOKS-SHORT-001:
    summary: Hooks must stay under 40 words; long hooks are fatal severity.
    points:
    - 'Scope: .vjs/hooks/** files'
    - Fatal severity; hooks over 40 words rejected
    - Legal reasoning belongs in rules/invariants/evals, not hook prose
    - 'Basis: ACT-003:s2, 2026-VJS-BOOT-009, DEC-AGENT-HARNESS-001'
    cites:
    - ACT-003
    - DEC-AGENT-HARNESS-001
  INV-LAWMAKING-001:
    summary: New law records must have authority, status, and kernel_effect fields; missing is fatal.
    points:
    - 'Scope: lawpack/v2/statutes/**, lawpack/v2/regulations/**, lawpack/v2/rules/**'
    - Fatal severity; missing required fields reject record
    - 'Fields: authority, status, kernel_effect mandatory'
    - 'Basis: ACT-004:s1, REG-LAWMAKING-001, SPEC-LAWMAKING-001'
    cites:
    - ACT-004
  INV-LAWMAKING-002:
    summary: Records with status=draft must not be included in runtime authority graph; draft binding
      is fatal.
    points:
    - 'Scope: lawpack/v2/statutes/**, lawpack/v2/regulations/**, lawpack/v2/rules/**'
    - Fatal severity; draft treated as binding rejected
    - Status must be assented, adopted, in_force before authority
    - 'Basis: ACT-001:s5, REG-LAWMAKING-001, SPEC-LAWMAKING-001'
    cites:
    - ACT-001
  INV-NO-V1-GAP-FILLER:
    summary: V1 archive must not be loaded as gap-filler for V2 silence; silence is fatal if V1 auto-imported.
    points:
    - 'Scope: lawpack/v2/statutes/**, lawpack/v2/regulations/**, lawpack/v2/rules/**, lawpack/v2/orders/**'
    - Fatal severity; V1 auto-import as binding rejected
    - V2 silence is first-impression question; V1 is persuasive archive only
    - 'Basis: ACT-COMPUTER-FIRST-REALM:s9, ACT-001:s4, 2026-VJS-BOOT-002, DEC-V1-SILENCE-001'
    cites:
    - ACT-COMPUTER-FIRST-REALM
    - ACT-001
    - DEC-V1-SILENCE-001
  INV-PROMPT-PATCH-001:
    summary: Prompt or agent harness changes must have a decision log explaining the rationale.
    points:
    - 'Scope: AGENTS.md, VJS.md, crates/vjs-mcp/**'
    - Error severity; untracked patch signals regression risk
    - Prompt prose does not reliably add capability; tools and evals do
    - 'Basis: ACT-003:s4, DEC-AGENT-HARNESS-001'
    cites:
    - ACT-003
    - DEC-AGENT-HARNESS-001
  SPEC-LAWMAKING-001:
    summary: Ensures new legislation enters V2 through proposal, validation, adoption, citation, lawpack
      entry, and decision log.
    points:
    - 'Scope: lawpack/v2/statutes/**, lawpack/v2/regulations/**, lawpack/v2/rules/**'
    - 'Decisions: DEC-007'
    - 'Invariants: INV-LAWMAKING-001, INV-LAWMAKING-002'
    - 'Review triggers: authority_basis_missing, draft_treated_as_binding, markdown_proposed_as_canonical'
    cites: []
  SPEC-AGENT-HARNESS-001:
    summary: Ensures agents governed by compact prompts, kernel tools, deterministic evals, and repair
      loops.
    points:
    - 'Scope: AGENTS.md, VJS.md, .vjs/hooks/**, crates/vjs-mcp/**, crates/vjs-testkit/**'
    - Prompts guide; tools empower; evals measure; kernel governs
    - 'Invariants: INV-HOOKS-SHORT-001, INV-PROMPT-PATCH-001, INV-AGENT-EVALS-001'
    - 'Review triggers: prompt_patched_without_eval, hook_exceeded_word_limit, harness_changed_without_eval'
    cites: []
  SPEC-KERNEL-001:
    summary: Ensures core kernel remains deterministic, local-first, and independent of model judgment.
    points:
    - 'Scope: crates/vjs-core/**, crates/vjs-lawpack/**'
    - 'Decisions: DEC-KERNEL-001, DEC-KERNEL-002'
    - 'Invariants: INV-KERNEL-001, INV-KERNEL-002, INV-KERNEL-003'
    - 'Review triggers: dependency_added, network_added, model_call_added, authority_ranking_changed'
    cites: []
  SPEC-AGENT-001:
    summary: Agent must follow route-permit-obligations-proof-log-validate lifecycle for all governed
      load-bearing work.
    points:
    - 'Scope: implementation_decision, public_record_change, external_act, security_sensitive_act'
    - 'Decisions: DEC-AGENT-001'
    - 'Invariants: INV-AGENT-001, INV-AGENT-002'
    - 'Obligations: OBL-LOG-001, OBL-VALIDATE-001'
    - 'Review triggers: permit_bypassed, proof_missing, log_missing'
    cites: []
  SPEC-ASSENT-DRAFT-001:
    summary: Draft scaffold for assent field system pending V1 constitutional route settlement; not binding.
    points:
    - 'Awaiting: Privy Council reference, Supreme Court settlement if needed, Committee second draft,
      Sovereign assent, Gazette entry, V2 adoption'
    - Proposes assent_source field system with assent_source.kind=specific_assent or standing_bounded_assent
    - Proposes delegated_lawmaking record type with scope limits and prohibited subjects
    - No force until commencement; currently at draft scaffold stage only
    cites: []
  DEC-001:
    summary: V1 preserved as Gazette and archive; V2 runtime uses compact lawpack; only expressly migrated
      V1 binds.
    points:
    - V1 discovered the law; V2 compiles it; archive preserves the journey
    - V2 runtime uses only compact executable law
    - V1 archive preserved but not loaded as runtime by default
    - 'Basis: ACT-001:s4, ACT-005:s6, REG-008'
    cites:
    - ACT-001
    - ACT-005
  DEC-002:
    summary: Kernel applies orders and rule atoms; opinions explain but do not bind unless incorporated.
    points:
    - Runtime authority must be compact and operative; opinions are for humans
    - Kernel should not reason over long prose
    - Orders directives applied; opinions treated as explanatory
    - 'Basis: ACT-002:s7, ACT-004:s1'
    cites:
    - ACT-002
    - ACT-004
  DEC-003:
    summary: V2 uses County Court, Privy Council, and Supreme Court only; Court of Appeal deferred.
    points:
    - Three courts sufficient for V2 MVP
    - Court of Appeal can be added later if appeal volume justifies
    - 'Uses: County, Privy, Supreme only'
    - 'Basis: ACT-002:s1, ACT-002:s5'
    cites:
    - ACT-002
  DEC-004:
    summary: Rust kernel is authoritative runtime machinery; MCP is adapter; kernel must not depend on
      MCP.
    points:
    - If MCP is authoritative, system becomes fragile
    - Kernel must be self-sufficient and deterministic
    - Keep kernel authoritative; keep MCP as adapter
    - 'Basis: ACT-001:s5, ACT-003:s8, REG-007'
    cites:
    - ACT-001
    - ACT-003
  DEC-005:
    summary: VJS binds records by schema, ID, and configured role, not by ceremonial path.
    points:
    - Users may choose their own directory layout
    - Ministry-style paths too state-like for user repos
    - One fixed anchor plus configurable roles is right balance
    - 'Basis: ACT-007:s1, REG-002'
    cites:
    - ACT-007
  DEC-006:
    summary: Binding authority resolved by tags, jurisdiction, rank, status, scope, supersession; not
      cosine similarity.
    points:
    - Semantic search for human discovery only, not runtime authority
    - Kernel must be deterministic and auditable
    - Resolve by tags, scope, rank, status; not by LLM or cosine
    - 'Basis: ACT-001:s5, ACT-003:s8, ACT-004:s3'
    cites:
    - ACT-001
    - ACT-003
    - ACT-004
  DEC-007:
    summary: V2 legislation is canonical as schema-validated YAML; Markdown is rendered explanation only.
    points:
    - Machine-readable law is the runtime source
    - Kernel loads YAML; humans read Markdown renderings
    - Markdown is non-authoritative commentary
    - 'Basis: ACT-001:s4, ACT-004:s6, REG-LAWMAKING-001'
    cites:
    - ACT-001
    - ACT-004
  DEC-AGENT-HARNESS-001:
    summary: Agents are governed by kernel tools, deterministic validation, permits, proofs, logs, evals;
      not long prompts.
    points:
    - Prompts guide; tools empower; evals measure; kernel governs
    - Long hooks accreted patches and bloat in V1; V2 puts capability in tools and checks
    - Hooks stay short; governed work routes through vjs.route; evals measure behavior
    - 'Basis: ACT-003:s2, ACT-004:s1, 2026-VJS-BOOT-009'
    cites:
    - ACT-003
    - ACT-004
  DEC-V1-SILENCE-001:
    summary: V2 gap does not auto-import V1 as binding; gaps are V2 first-impression questions; V1 may
      be consulted.
    points:
    - V1 may advise V2 but may not rule by silence; gaps routed to V2 court or lawmaking
    - If V1 filled every V2 gap, V2 would never supersede V1
    - V1 discovered doctrine; V2 compiles it; V1 binds only by express incorporation
    - 'Basis: ACT-001:s4, 2026-VJS-BOOT-002, DEC-001'
    cites:
    - ACT-001
    - DEC-001
  2026-VJS-SC-001:
    summary: 9-0 Supreme Court ruling on federation test, V1 incorporation, canonicalisation governance,
      and constitutional directives.
    points:
    - Coordinating root may federate peers under one canonical lawpack and apex but never be sovereign;
      kernel-checkable bright-line plus court-applied practical-subjection standard
    - General V1 law crosses only by express entry-by-entry rank-matched fail-closed incorporation in
      migration ledger; protective floor may not weaken
    - Canonicalisation prospective and non-disturbing with governed rename; assented digest, lawpack lock,
      citations, IDs immutable
    - Standing Committee directed to codify five instruments as void first drafts pending assent
    - Privy Council is transition court; V1 Court perfects already-heard matters only; Court of Appeal
      persists
    cites: []
  2026-VJS-PC-001:
    summary: 3-0 Privy Council ruling on V1->V2 transitional-continuity doctrine, pending matter classification,
      and local onboarding.
    points:
    - Transfer carries pending V1 matters forward at current state; never restarts them; perfected orders
      and accrued rights preserved
    - Pending matters classified as continued at point, reframed where unworkable, or moot; already-heard
      matters perfected for Gazette publication only
    - Local onboarding is local Principal's ACT-007 act; V1 local precedent carried by express incorporation
      or recorded revocable continuity election
    - Super-repo survives as federation under one continued apex; no root may assert second apex
    - REG-TRANSITION-CONTINUITY-001 directed through lawmaking route with s.9 and local-scope guardrails
    cites: []
  2026-VJS-PC-002:
    summary: 3-0 Privy Council ruling consolidating onto established public repo as one canonical line
      with two-estate Gazette.
    points:
    - Canon consolidates onto established public repo (main = canon, drop spent v2 ordinal with redirect);
      one Gazette carries both V1 archive and V2 estates
    - V1 archive estate anchored by immutable signed tag, protected read-only v1 branch, distinct published
      Archive directory; not bare branch
    - V1 records carry estate markers (v1_archive, archival_source_only, live_authority false); citations
      are source edges, not authority edges
    - Physical migration staged behind governed lock-preserving instrument; halts if path-continuity and
      invariant-scoping cannot be proven
    - Committee directed to codify topology in Framework Act and raft
    cites: []
  2026-VJS-PC-003:
    summary: 3-0 Privy Council ruling on back-filling s.23 and SC-10 into V1 archival estate with proper
      estate marking.
    points:
    - CASE-LAW s.23 transcribed into V1 verified against assented digest word-for-word; unverifiable wording
      left as cited gap
    - REALM-SC 10 lodged as marked derived minute (never native judgment) reproducing disposition and
      ratios only
    - Both marked archival-source-only with lineage edge to V2 provenance; registrar writes as Principal's
      warranted V1-estate act; kernel performs no part
    - Nothing fabricated; Schedule-3 stay lifts on digest-verified completion
    - Back-filled records treated as carried-forward archival source, not live authority
    cites: []
  2026-VJS-PC-004:
    summary: '3-0 Privy Council ruling on citation convention: cite statute by instrument+section, case
      law by its case (neutral citation).'
    points:
    - Statute cited by enacting instrument and section; case law cited by its case neutral citation, never
      by pseudo-section
    - V1 CASE-LAW hybrid (P articles = genuine Sovereign-enacted constitutional statute; SC articles =
      case law); stays intact in archive
    - Live V2 corpus re-cited by governed meaning-preserving clerical pass; case-to-section mapping lodged
      as resolvable register
    - Principle-20 citation gate extended to fail closed on pseudo-section over court-made article
    - Re-cutting entrenched section-keyed immutable-digest document rejected (non-disturbance)
    cites: []
  2026-VJS-PC-005:
    summary: 3-0 Privy Council ruling on Repos House as declarative registry and institutional model.
    points:
    - Repos House is lightweight declarative jurisdiction registry and certification ledger; registration
      creates no legal force; invocation and lawpack lock do
    - Certification restates deterministic kernel/gate output, never human attestation; two layers (private
      operational, public system-data-only)
    - MoJ and MBES dropped as mandatory institutions/paths/packaging; functions carried as Court Registry,
      Gazette Clerk, Toolchain Registry, Skills/Agent Registry
    - Policy proposals routed through existing lawmaking route, no new office
    - REG-REPOS-HOUSE-001 drafted under Framework Act s.7, sequenced after permit enforcement
    cites: []
  2026-VJS-PC-006:
    summary: 3-0 Privy Council ruling that canon super-repo self-invokes under REG-INVOCATION-001; Privy
      Council is realm first-instance court.
    points:
    - Canon self-invokes like any jurisdiction (binding by invocation, not authorship); authorship no
      exemption (no-one above law)
    - Lodged invocation must be perfected by installing enforcement hooks
    - Privy Council is realm-as-state's first-instance court for realm-level matters (incorporating REALM-PC
      15); appealable upward to CA and SC
    - First-instance is not apex; single apex undisturbed; no new tier, seat, apex, or citation series
      created
    - Settled by ruling and order; no legislation and no kernel change
    cites: []
  2026-VJS-BOOT-001:
    summary: V2 runtime uses orders, rules, and logs as authority; V1 archive not runtime context unless
      incorporated.
    points:
    - Orders, rules, logs are runtime authority
    - V1 archive not used as runtime unless expressly incorporated
    - Agent must use orders, rules, logs for governed work
    cites: []
  2026-VJS-BOOT-002:
    summary: V1 archive is historical and persuasive; not live runtime law unless expressly incorporated.
    points:
    - V1 is archive and historical record
    - Check incorporation before citing V1 archive
    - No default loading of V1 as runtime
    cites: []
  2026-VJS-BOOT-003:
    summary: Court of Appeal not carried forward in V2 MVP; appeals handled by Privy Council or Supreme
      Court.
    points:
    - Use County, Privy Council, Supreme Court only
    - Court of Appeal deferred; not created in MVP
    - Principal may authorize appeal routes
    cites: []
  2026-VJS-BOOT-004:
    summary: Material implementation decisions require 50-150 word decision logs.
    points:
    - Material decisions, public record changes, external acts, security-sensitive acts require decision
      logs
    - Logs must be 50-150 words
    - Logs cannot be skipped for material decisions
    cites: []
  2026-VJS-BOOT-005:
    summary: MCP adapter exposes only 6 tools; local-first; no release tools or direct file writes.
    points:
    - 'MCP tools: route, lookup, validate, log, file, status only'
    - No arbitrary file writes, no release tools, no direct push actions
    - MCP kept thin and local-first
    cites: []
  2026-VJS-BOOT-006:
    summary: Kernel must remain deterministic, model-free, and network-free.
    points:
    - vjs-core must not contain model calls, network clients, vector search, or LLM judgment
    - Model interaction belongs in vjs-mcp or external adapters
    - Kernel determinism is foundational to all governance
    cites: []
  2026-VJS-BOOT-007:
    summary: Invariants are deterministic, typed, evaluated mechanically using fixed predicate registry.
    points:
    - Invariants evaluated by fixed predicate registry in Rust
    - No LLM checks, no cosine similarity, no free-form scripts
    - Use predicate DSL for defining invariants
    cites: []
  2026-VJS-BOOT-008:
    summary: Specs are first-class law objects with purpose, scope, decisions, invariants, obligations,
      and review triggers.
    points:
    - Specs used as compact machine-checkable contracts for governed work
    - Specs link to decisions, invariants, obligations, and review triggers
    - Specs not prose-only; must be executable and linkable
    cites: []
  2026-VJS-BOOT-009:
    summary: Permits required for governed writes; hooks enforce lifecycle (permit check, pre-commit validation),
      not the law itself.
    points:
    - Permits obtained before governed write; closed with proof after
    - Hooks are session hint (40 words), pre-write check, pre-commit validation
    - Hooks do not explain law; legal reasoning belongs in rules and evals
    - Hooks enforce lifecycle transitions, not substantive doctrine
    cites: []
  2026-VJS-BOOT-010:
    summary: Public/private boundary enforced by deterministic scanner, not model judgment.
    points:
    - Boundary scan run on public record changes
    - Deterministic scanner detects secrets, tokens, hostnames, emails, private paths
    - No LLM-based boundary checks; no agent discretion without deterministic basis
    cites: []
  2026-VJS-BOOT-011:
    summary: V2 alpha must harden predicate evaluation, repo scanning, invariant validation, permits,
      hooks before adding courts, Gazette, migration.
    points:
    - Implement predicate DSL, repo state scanner, invariant wiring, permit persistence, hook installation,
      golden tests
    - No doctrine expansion, Gazette, Court of Appeal, semantic search, PDF rendering until spine hardened
    - 'Alpha priorities: core validation, permits, hooks, tests before feature expansion'
    cites: []
  2026-VJS-BOOT-012:
    summary: V2 alpha must enforce permits at staged-change and commit boundary before further expansion.
    points:
    - Wire permit gate into validate staged; load permits/proofs/logs in status
    - Block governed staged paths without matching permit; block missing before-commit obligations
    - Add hook blocking fixtures to test enforcement
    - No doctrine expansion before permit enforcement is real
    cites: []
  2026-VJS-COURTS-CONSTITUTION-001:
    summary: V2 courts expressly constituted with odd benches; County 1, Privy Council 3, Supreme Court
      5/9; Court of Appeal persists but non-convened.
    points:
    - County Court sits as single judge (odd bench of 1) over repo-local operational matters
    - Privy Council sits as odd bench of 3 over constitutional, jurisdiction, routing, public/private
      boundary matters at realm level
    - Supreme Court sits as odd bench of 5, expandable to 9 for constitutional/foundational questions,
      as single central apex
    - Court of Appeal persists as tier but administratively non-convened in MVP; may be convened if appeal
      arises (not abolished)
    - Gives effect to REALM-SC 10 handover order; force from migration Sovereign Assent
    cites: []
  COMMENCEMENT-V2-0001:
    summary: 'Sole external constitutive event: Sovereign Assent to Bill 32 on 2026-06-09; conditions precedent
      satisfied; V2 commenced.'
    points:
    - 'Sovereign Assent: wholly antecedent external act through V1 route; sole constitutive gate; non-automatable,
      non-presumable, non-delegable'
    - 'Assented text digest: sha256:8e1d3f516cb2aca8e044d8c73bdc6ededa91a47ca86b729eece06f7eee6b9a0c;
