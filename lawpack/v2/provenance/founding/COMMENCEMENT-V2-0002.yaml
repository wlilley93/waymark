title: Commencement addendum - Framework Act + raft lodged; fresh lawpack lock
date: "2026-06-09"
summary: >
  Addendum to COMMENCEMENT-V2-0001 (which stays pinned and untouched). On the
  Principal's direction "assent given, go" (2026-06-09), the assented Realm
  Consolidation and Reconciliation Framework Act and the six subordinate
  regulations made under its s.7 are lodged into the runtime lawpack, keeping the
  lawpack/v2/ path prefix (per the Canonicalisation and Migration Regulation, so
  the path-scoped invariants still bind). The AGPL-3.0 licence is adopted (s.22).
  This addendum records the resulting fresh lawpack lock; the original lock is
  preserved, never overwritten.

lodged:
  statutes:
    - ACT-CONSOLIDATION-FRAMEWORK  # the Framework Act (in_force; assent digest below)
  regulations:
    - REG-MIGRATION-INCORPORATION-001
    - REG-FEDERATION-COORDINATION-001
    - REG-TRANSITION-CONTINUITY-001
    - REG-CANONICALISATION-MIGRATION-001
    - REG-GAZETTE-CONTINUITY-001
    - REG-REPOS-REGISTER-001

assent:
