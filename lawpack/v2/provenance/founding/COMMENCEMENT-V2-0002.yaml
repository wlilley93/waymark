  assented_by: principal
  where: "where validly capable"
  record: ".vjs/submissions/filed/2026-06-09-framework-act-assent.md"

locks:
  old_lock_pinned: "sha256:4d2639cc"   # COMMENCEMENT-V2-0001; immutable, not overwritten
  fresh_lawpack_lock: "sha256:8d075f7dbefba5c500884f7f0e6f89b9442c73307bf25c08fd867220a801864f"
  fresh_lock_method: "sha256 of LC_ALL=C-sorted `find lawpack/v2 -type f | xargs sha256sum`"
  immutable_anchors_untouched:
    - "bill-32 assented digest sha256:8e1d3f51"
    - "old lawpack lock sha256:4d2639cc"
    - "VJS-ACT / VJS-REG / REALM-* citation series"
    - "all record ids"

invariants_after_lodgement: "vjs local-ci PASS; vjs validate --staged OK (20 invariants, all pass); vjs eval all green"

remaining_warranted_acts:
  - "execute the staged canonicalisation merge onto the established public repo (main = canon, drop the v2 name, V1 archive estate) under a release warrant - the Principal's outward act"
  - "vendor the full verbatim GNU AGPL-3.0 text into LICENSE on the canonical line"
  - "each repository's mandatory subscription within 90 days (Repos Register and Subscription Regulation)"
  - "resolve Schedule-3 items 2-6 (each carries a machine-checkable predicate)"
  - "publish to the Gazette (warranted push)"

note: >
  Lodgement keeps the lawpack/v2/ path; the physical repo consolidation, push,
  rename, tag, and AGPL full-text vendor remain the Principal's warranted, outward
