id: OBL-VALIDATE-001
assent_source: sovereign_assent
title: Validation proof obligation for agent actions with conditions
status: in_force
kind: validation
due: before_commit
required: true
text: >
  Agent actions that route as AllowedWithConditions shall carry validation
  proof (vjs validate output) before commit, confirming that the work and its
  decision log satisfy all lawpack invariants. Absence of validation proof
  triggers a proof_missing review and blocks commit. The kernel mints this
  obligation at route time (crates/vjs-core/src/route.rs); this instrument
  elevates the code artifact to law, binding the agent to run validation and
  attach proof before closure.
basis:
  - DEC-AGENT-001
  - SPEC-AGENT-001
