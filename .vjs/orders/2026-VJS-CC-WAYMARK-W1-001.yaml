holding: |
  Option A is adopted. W1 REGISTER-COMPLETE is GRANTED over the declared
  surface named by the evidence: register_completeness
  (PROOF-20260815-214106) and reconciliation (PROOF-20260815-214107), both
  exit 0, non-vacuous, captured automatically, and corroborated by
  composition (PROOF-20260815-214108) and contrast (PROOF-20260815-214109)
  over the same surface. The grant's claim is exact: fifteen records, at
  these digests, over eight screens; drift inside the surface spends the
  warrant (VDS S-6(4)). The chain's reservations are RECORDED, never waived:
  W2 awaits states drawn from a decided-target Figma file, a design act the
  agent has no write path to perform; W3 is the Principal's alone and no
  proof or bench substitutes for it; W4 follows W3. The states proof's
  fifteen findings stand as the honest measure of that gap. The SMTP
  credential is a Principal supply; the transport ships and the deployment
  is live on public HTTPS with invitations by link. Option B is rejected:
  refusing an earned stage until an inexpressible one clears converts
  evidence into ceremony. Option C is rejected: this Court does not relax
  another system's floors.
