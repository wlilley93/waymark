runtime_summary: |
  v1.1 binding: canonical places + map_places, facets/terms with primary and
  secondary categories, typed custom fields, If-Match optimistic concurrency with
  revisions, persisted per-map event seq with resync, ST_DWithin radius + bbox
  viewport, Geocoder interface with compliant Nominatim adapter, replaceable
  tiles with terrain off by default, dev/prod deployment split, expanded auth
  floor, no runtime plugins.
