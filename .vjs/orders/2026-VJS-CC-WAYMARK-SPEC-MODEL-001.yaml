id: 2026-VJS-CC-WAYMARK-SPEC-MODEL-001
court: county
jurisdiction: default
repo_code: WAYMARK
status: binding
issue: spec_v1_1
holding: |
  Option A is adopted in full; v1.1 is the binding build specification. The Place
  and the MapPlace are different things and v1.0 conflated them: a canonical
  places row (name, geom, address, website, operational status, OSM natural key)
  with place_sources for provider identity, and a map_places row (the group's
  bookmark: shared note, added_by, version, map-specific attributes) referencing
  it. Dedupe keys on (provider, external_id) where a source supplies one; manual
  pins match on geom+name proximity at insert with an exact-match reuse rule.
  Taxonomy becomes facets/terms: a facet is a dimension (category, vibe,
  occasion, audience, facilities, price), a term is a value in it; map_place_terms
  carries role primary|secondary so a venue is one primary category plus optional
  secondary categories and any number of other-facet terms. Filters compose
  across facets (family-friendly AND restaurant NOT bar). Custom fields become
  typed field_definitions (key, label, data_type, validation, applicable terms,
  filterable, required) with values in map_place_field_values JSONB constrained
  by the definition; "no migrations for user-defined fields" stands, "never any
  migration" does not - core concepts migrate. Conflict handling is versioned
  optimistic concurrency: every mutation of map_places bumps version and writes
  place_revisions; PATCH requires If-Match, mismatch returns 409 with the current
  record; non-overlapping field auto-merge is a client concern on top, never a
  server-side guess. The realtime layer treats WS events as notifications over
  the transactional truth: every event carries (map_id, seq) from a per-map
  monotonic sequence persisted in activity_events BEFORE broadcast; clients
  resync by sinceSeq on reconnect; handlers are idempotent; the database is the
  source of truth. Spatial queries split by kind: ST_DWithin(geography) for
  radius/nearby, bbox && ST_MakeEnvelope for viewport loading. Geocoding goes
  through a Geocoder provider interface; the Nominatim adapter serves explicit
  submitted queries only (proper UA, >=1s spacing, cached), autocomplete is
  forbidden against the public instance and a hosted/self-hosted provider is a
  later swap. Tiles and terrain are replaceable sources; terrain is a toggle,
  off by default. Deployment is split: dev on Tailscale, production multiplayer
  needs public HTTPS + transactional email + app-level invites, and the spec says
  so. The auth floor adds: login rate limiting, session rotation and revocation,
  Secure+SameSite cookies, CSRF via custom-header same-origin policy, single-use
  expiring reset and invite tokens stored hashed, audit events for auth
  mutations. No runtime plugin system in v1: TypeScript interfaces and internal
  registries only. Option B is rejected because schema normalisation after
  duplicate data exists is the measured failure mode of every prior bookmark
  map; Option C is rejected because If-Match and seq-on-write are API-contract
  decisions, not additives - every client written against a contract without
  them breaks when they arrive.
